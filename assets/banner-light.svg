<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="300" viewBox="0 0 1160 300" fill="none" role="img" aria-label="awesome-free-ai-coding — legal free LLM APIs and coding agents, probe-verified">
  <title>awesome-free-ai-coding — legal free LLM APIs and coding agents, probe-verified</title>
  <defs>
    <linearGradient id="sweep" x1="224" x2="150" y1="76" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a7f37" stop-opacity=".45"/>
      <stop offset="1" stop-color="#1a7f37" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="300" x2="1100" y1="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
  </defs>
  <style>
    /* The beam turns once every 6s (SMIL, below — a CSS transform is not animated
       in every SVG-as-image renderer). Each blip lights up as the beam reaches its
       bearing: the delays are those arrival times, not decoration. */
    .blip { opacity: .45; animation: radar-blip 6s linear infinite; }
    .b1 { animation-delay: .17s }
    .b2 { animation-delay: 4.61s }
    .b3 { animation-delay: 1.64s }
    .b4 { animation-delay: 3.26s }
    @keyframes radar-blip { 0%, 5% { opacity: 1 } 60%, 100% { opacity: .45 } }
    /* The flashing is what a reader who asked for less motion wants stopped;
       every contact stays lit instead. */
    @media (prefers-reduced-motion: reduce) {
      .blip { animation: none; opacity: 1 }
    }
  </style>
  <rect width="1158" height="298" x="1" y="1" fill="#fff" stroke="#d0d7de" stroke-width="2" rx="16"/>
  <g>
    <circle cx="150" cy="150" r="105" stroke="#1a7f37" stroke-opacity=".25" stroke-width="2"/>
    <circle cx="150" cy="150" r="70" stroke="#1a7f37" stroke-opacity=".35" stroke-width="2"/>
    <circle cx="150" cy="150" r="35" stroke="#1a7f37" stroke-opacity=".45" stroke-width="2"/>
    <line x1="45" x2="255" y1="150" y2="150" stroke="#1a7f37" stroke-opacity=".15" stroke-width="2"/>
    <line x1="150" x2="150" y1="45" y2="255" stroke="#1a7f37" stroke-opacity=".15" stroke-width="2"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 150 150" to="360 150 150" dur="6s" repeatCount="indefinite"/>
      <path fill="url(#sweep)" d="M150 150 L150 45 A105 105 0 0 1 224.25 75.75 Z"/>
      <line x1="150" x2="224.25" y1="150" y2="75.75" stroke="#1a7f37" stroke-linecap="round" stroke-width="3"/>
    </g>
    <circle cx="150" cy="150" r="5" fill="#1a7f37"/>
    <circle class="blip b1" cx="196" cy="118" r="6" fill="#1a7f37"/>
    <circle class="blip b2" cx="112" cy="102" r="5" fill="#1a7f37"/>
    <circle class="blip b3" cx="185" cy="197" r="5" fill="#0969da"/>
    <circle class="blip b4" cx="93" cy="182" r="4" fill="#cf222e"/>
  </g>
  <text x="300" y="135" fill="#1f2328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="52" font-weight="700">awesome-free-ai-coding</text>
  <rect width="640" height="5" x="302" y="158" fill="url(#accent)" rx="2.5"/>
  <text x="300" y="205" fill="#57606a" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24">Legal free LLM APIs &amp; coding agents for developers</text>
  <text x="300" y="240" fill="#6e7781" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19">self-updating · probe-verified twice a week · dead offers auto-archived</text>
</svg>
