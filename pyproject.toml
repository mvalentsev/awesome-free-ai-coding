[project]
name = "freetier-radar"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "certifi>=2026.10.19",
  "httpx>=0.27",
  "pydantic>=2.14.1",
  "pyyaml>=6.0.1",
  "jinja2>=3.1",
  "curl-cffi>=0.17.0,<0.18",
  "cryptography>=50.0.2",
]

[dependency-groups]
dev = [
  "pytest>=9.2.0",
  "pytest-asyncio>=1.4.1",
  "respx>=0.21",
]

[project.scripts]
freetier-probe = "freetier_radar.prober:main"
freetier-scout = "freetier_radar.scout:main"
freetier-render = "freetier_radar.render:main"
freetier-check = "freetier_radar.validate:main"
freetier-announce = "freetier_radar.announce:main"
freetier-indexnow = "freetier_radar.indexnow:main"
freetier-quotes = "freetier_radar.quotes:main"
freetier-tiers = "freetier_radar.tiers:main"
freetier-map = "freetier_radar.layout:main"
freetier-gate = "freetier_radar.gate:main"
freetier-bars = "freetier_radar.bars:main"
freetier-borders = "freetier_radar.borders:main"
freetier-conformance = "freetier_radar.conformance:main"
freetier-review = "freetier_radar.review:main"
freetier-archive-review = "freetier_radar.archive_review:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freetier_radar"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
