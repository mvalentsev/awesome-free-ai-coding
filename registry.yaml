entries:
- id: openrouter-free
  name: OpenRouter (free models)
  category: aggregator
  url: https://openrouter.ai
  source_urls:
  - https://openrouter.ai/docs/faq
  - https://openrouter.ai/docs/api_reference/limits
  - https://openrouter.ai/docs/cookbook/coding-agents/claude-code-integration
  card_required: false
  offering: One API key for a rotating set of :free model variants, open-weight and
    stealth models among them
  limits: 20 requests per minute on any :free id, 50 requests per day, and 1,000 per
    day once the account has purchased at least 10 credits all-time. Those four figures
    are in the page only as JS constants — FREE_MODEL_RATE_LIMIT_RPM, FREE_MODEL_NO_CREDITS_RPD,
    FREE_MODEL_HAS_CREDITS_RPD and FREE_MODEL_CREDITS_THRESHOLD — and the table that
    should show them serves empty cells to anything reading the HTML. OpenRouter's
    FAQ says its free models "have low rate limits" and "are usually not suitable
    for production use", warns that a negative credit balance can produce errors "including
    for free models", and notes a 429 may come from the upstream provider rather than
    the platform (read 2026-08-14)
  models:
  - family: nemotron-3-ultra
    released: 2026-03
    aa_model: nvidia-nemotron-3-ultra-550b-a55b
  - family: gemma-4-31b
    released: 2026-04
    aa_model: gemma-4-31b
  - family: gemma-4-26b-a4b
    released: 2026-04
    aa_model: gemma-4-26b-a4b
  - family: nemotron-3-super
    released: 2026-03
    aa_model: nvidia-nemotron-3-super-120b-a12b
  - family: north-mini-code
    released: 2026-06
    aa_model: north-mini-code
  - family: laguna-s-2.1
    released: 2026-07
  - family: laguna-xs-2.1
    released: 2026-07
  - family: nemotron-3.5-lightning
    released: 2026-08
    aa_model: nemotron-3-5-lightning
  - family: inkling
    released: 2026-07
    aa_model: inkling
  - family: inkling-small
    released: 2026-07
    aa_model: inkling-small
  - family: dots-3-note
    released: 2026-08
  - family: ling-3.0-flash-fin
    released: 2026-09
    aa_model: ling-3-0-flash-fin
  - family: ling-3.0-flash-sante
    released: 2026-09
  - family: nemotron-3-nano-omni
    released: 2026-04
    aa_model: nemotron-3-nano-omni-30b-a3b
  api:
    base_url: https://openrouter.ai/api/v1
    key_url: https://openrouter.ai/settings/keys
    auth: api-key
    openai_compatible: true
    model_ids:
    - nvidia/nemotron-3-ultra-550b-a55b:free
    - nvidia/nemotron-3-super-120b-a12b:free
    - nvidia/nemotron-3.5-lightning:free
    - nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
    - google/gemma-4-31b-it:free
    - google/gemma-4-26b-a4b-it:free
    - cohere/north-mini-code:free
    - poolside/laguna-s-2.1:free
    - poolside/laguna-xs-2.1:free
    - thinkingmachines/inkling:free
    - thinkingmachines/inkling-small:free
    - dots-studio/dots-3-note-preview:free
    - inclusionai/ling-3.0-flash-fin:free
    - inclusionai/ling-3.0-flash-sante:free
    - liquid/lfm-2.5-2.6b:free
    - z-ai/glm-5.2:free
    - qwen/qwen3.8-27b:free
    - openrouter/free
    ignored_ids:
    - nvidia/nemotron-3.5-content-safety:free
    - nex-agi/nex-n2.5-pro:free
    - nex-agi/nex-n2.5-mini:free
    no_family_ids:
    - liquid/lfm-2.5-2.6b:free
    - openrouter/free
    anthropic_base_url: https://openrouter.ai/api
    note: 'pick models with the :free suffix: every id carrying it is priced 0/0,
      20 on 2026-09-24, and the lane rotates, so a new id waits two weeks for the
      Models column. Kept out of it: openrouter/free, the free-models router; lfm-2.5-2.6b,
      which LiquidAI advises against agentic coding; and nemotron-3.5-content-safety,
      a guardrail classifier. Nex-N2.5 Pro and Mini are ignored: the catalog dates
      their free ids to end 2026-09-25. For Claude Code, OpenRouter''s cookbook sets
      ANTHROPIC_BASE_URL to https://openrouter.ai/api with ANTHROPIC_API_KEY empty
      and a :free id as ANTHROPIC_MODEL'
  data_use:
    trains: opt-out
    quote: Wherever possible, OpenRouter works with providers to ensure that prompts
      will not be trained on, but there are exceptions. If you opt out of training
      in your account settings, OpenRouter will not route to providers that train.
    url: https://openrouter.ai/docs/guides/privacy/provider-logging
  probe:
    type: api-models
    endpoint: https://openrouter.ai/api/v1/models
    keywords: []
    free_marker: :free
    dead_markers: []
    require_zero_price: true
    machinery_keywords: []
  first_seen: '2026-07-19'
  last_verified: '2026-09-24'
  probe_failures: 0
  provisional: false
  rank: 10
- id: google-ai-studio
  name: Google AI Studio (Gemini API)
  category: api-free-tier
  url: https://aistudio.google.com
  source_urls:
  - https://ai.google.dev/gemini-api/docs/pricing
  - https://ai.google.dev/gemini-api/docs/rate-limits
  - https://ai.google.dev/gemini-api/docs/changelog
  - https://ai.google.dev/gemma/docs/core/gemma_on_gemini_api
  card_required: false
  offering: Free tier on the Gemini API, priced model by model rather than as one
    account quota
  limits: 'Google prices the free tier per model: its pricing page reads "Free of
    charge" for input, output and context caching on Gemini 3.8 Flash, "our most intelligent
    Flash model, engineered for long-horizon software engineering", in the same column
    that prices it at $0.75/$3.75 per 1M on the paid tier, and on 3.7, 3.6 and 3.5
    Flash, 3.5 and 3.1 Flash-Lite, 3 Flash Preview and Gemma 4, with "Not available"
    there for Gemini 3.1 Pro Preview and Omni Flash. The 2.5 models keep a free column,
    but since 2026-09-18 the changelog says Google is "limiting access to the 2.5
    models to users who have actively used them in the past": "For any new projects,
    use our latest models: 3.5 Flash-Lite or 3.8 Flash". What the free tier costs
    instead is one row lower in each table: "Used to improve our products" is Yes
    on the free tier and No on the paid one. Per-model RPM/TPM/RPD figures sit behind
    a sign-in at aistudio.google.com/rate-limit; the public rate-limits page keeps
    only the usage-tier table, whose free row reads "Active project or free trial".
    Read 2026-09-25'
  models:
  - family: gemini-3.8-flash
    tier: strong
    released: ''
    aa_model: gemini-3-8-flash
  - family: gemini-3.7-flash
    tier: strong
    released: ''
    aa_model: gemini-3-7-flash
  - family: gemini-3.6-flash
    tier: strong
    released: ''
    aa_model: gemini-3-6-flash
  - family: gemini-3.5-flash
    released: ''
    aa_model: gemini-3-5-flash
  - family: gemini-3.5-flash-lite
    released: ''
    aa_model: gemini-3-5-flash-lite
  - family: gemini-3.1-flash-lite
    released: ''
    aa_model: gemini-3-1-flash-lite-preview
  - family: gemini-3-flash
    released: ''
  - family: gemma-4
    released: ''
  api:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    key_url: https://aistudio.google.com/apikey
    auth: api-key
    openai_compatible: true
    model_ids:
    - gemini-3.8-flash
    - gemini-3.7-flash
    - gemini-3.6-flash
    - gemini-3.5-flash
    - gemini-3.5-flash-lite
    - gemini-3.1-flash-lite
    - gemini-3-flash-preview
    - gemma-4-31b-it
    - gemma-4-26b-a4b-it
    note: pass the key as Bearer
  data_use:
    trains: 'yes'
    quote: When you use Unpaid Services, including, for example, Google AI Studio
      and the unpaid quota on Gemini API, Google uses the content you submit to the
      Services and any generated responses to provide, improve, and develop Google
      products and services and machine learning technologies
    url: https://ai.google.dev/gemini-api/terms
  probe:
    type: page-keywords
    endpoint: https://ai.google.dev/gemini-api/docs/pricing
    keywords:
    - gemini-3.8-flash
    - free of charge
    free_marker: ''
    dead_markers: []
    require_zero_price: false
    machinery_keywords: []
  first_seen: '2026-07-19'
  last_verified: '2026-09-24'
  probe_failures: 0
  provisional: false
  rank: 10
- id: groq-free
  name: Groq
  category: api-free-tier
  url: https://groq.com
  source_urls:
  - https://console.groq.com/docs/rate-limits
  card_required: false
  offering: Fast inference against a free plan Groq publishes as a per-model rate
    table
  limits: 'Groq states the free plan as a table rather than one quota, in RPM / RPD
    / TPM / TPD: 30 / 1K / 8K / 200K on openai/gpt-oss-120b, gpt-oss-20b, gpt-oss-safeguard-20b,
    qwen/qwen3.6-27b and qwen/qwen3.8-27b, 30 / 14.4K / 15K / 500K on the two meta-llama/llama-prompt-guard
    classifiers, 30 / 250 / 70K on groq/compound and compound-mini, 20 / 2K on the
    two whisper models and 10 / 100 / 1.2K / 3.6K on the two canopylabs/orpheus voices
    (read 2026-09-08). Those thirteen rows are the whole free plan, with no Llama
    among them — the Llama ids in the page''s API samples are not on it. Groq calls
    the table "a high level summary and there may be exceptions", and points at the
    limits page in an account for the exact figures'
  models:
  - family: gpt-oss-120b
    released: 2025-08
    aa_model: gpt-oss-120b
  - family: gpt-oss-20b
    released: 2025-08
    aa_model: gpt-oss-20b
  - family: qwen3.6
    released: ''
  - family: qwen3.8-27b
    tier: strong
    released: ''
    aa_model: qwen3-8-27b
  api:
    base_url: https://api.groq.com/openai/v1
    key_url: https://console.groq.com/keys
    auth: api-key
    openai_compatible: true
    model_ids:
    - openai/gpt-oss-120b
    - openai/gpt-oss-20b
    - qwen/qwen3.6-27b
    - qwen/qwen3.8-27b
    note: the chat models Groq's own Free Plan Limits table names; its safeguard and
      prompt-guard classifiers, compound systems, whisper and orpheus rows are left
      out
  data_use:
    trains: 'no'
    quote: For clarity, Groq is not permitted to use Inputs or Outputs for training
      or fine-tuning any AI Model Services or other models, unless explicitly granted
      permission or instructed by Customer.
    url: https://console.groq.com/docs/legal/services-agreement
  probe:
    type: page-keywords
    endpoint: https://console.groq.com/docs/rate-limits
    keywords:
    - free plan limits
    - qwen/qwen3.8-27b
    free_marker: ''
    dead_markers: []
    require_zero_price: false
    machinery_keywords: []
  first_seen: '2026-07-19'
  last_verified: '2026-09-24'
  probe_failures: 0
  provisional: false
  rank: 20
- id: mistral-free
  name: Mistral Studio
  category: api-free-tier
  url: https://mistral.ai
  source_urls:
  - https://mistral.ai/pricing
  - https://docs.mistral.ai/admin/billing-usage/subscriptions
  - https://docs.mistral.ai/getting-started/quickstarts/studio/activate-and-generate-api-key
  - https://docs.mistral.ai/admin/billing-usage/usage-limits
  card_required: false
  offering: Mistral's Free plan — API keys with $10 a month of included usage, shared
    by the API, Studio and the Vibe coding CLI, no card
  limits: 'The Free card on mistral.ai/pricing lists "Limited coding sessions", "Test
    Mistral models in Studio" and "$10 /mo in API credits", where Pro''s card says
    $30. The docs say where the allowance goes: "Mistral plans are global: the same
    plan applies across Vibe, Studio, and API usage", "Free mode is the default state
    for new accounts", and "Each Mistral plan includes monthly usage that is shared
    across Studio, the API, and Vibe Code. Usage consumes this monthly allowance first"
    — past it, usage "can stop until the next billing period" unless pay-as-you-go
    is switched on. The quickstart asks for nothing more: "Free mode: API access is
    enabled by default with no credit card required." What $10 buys is on the same
    page: "For example, Mistral Large costs $0.5 /M tokens in and $1.5 /M tokens out."
    Free mode also has the lowest rate limits — requests per second, tokens per minute
    and tokens per month, shown only inside the account — and API calls may be used
    to improve Mistral''s services unless the Admin panel''s `Anonymous improvement
    data` toggle is off.'
  models: []
  api:
    base_url: https://api.mistral.ai/v1
    key_url: https://console.mistral.ai/api-keys
    auth: api-key
    openai_compatible: true
    model_ids: []
    note: Free mode is on by default for a new account; create the key under Studio
      › API Keys. A key made under Code › Vibe CLI is a plan key that spends the plan's
      Vibe budget, which Mistral tells API users to avoid
  data_use:
    trains: opt-out
    quote: As stated during subscription, we may use your data (input and output)
      to train our artificial intelligence models. … You have the right to opt out
      of this program at any time.
    url: https://help.mistral.ai/en/articles/347617-do-you-use-my-user-data-to-train-your-artificial-intelligence-models
  probe:
    type: page-keywords
    endpoint: https://mistral.ai/pricing
    keywords:
    - $10 /mo in API credits
    - Test Mistral models in Studio
    free_marker: ''
    dead_markers: []
    require_zero_price: false
    machinery_keywords: []
  first_seen: '2026-07-19'
  last_verified: '2026-09-24'
  probe_failures: 0
  provisional: false
  rank: 78
