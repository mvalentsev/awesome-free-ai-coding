- id: cloudflare-workers-ai
  name: Cloudflare Workers AI
  category: api-free-tier
  url: https://www.cloudflare.com/products/workers-ai/
  source_urls:
  - https://developers.cloudflare.com/workers-ai/platform/pricing/
  - https://developers.cloudflare.com/workers-ai/platform/limits/
  card_required: false
  offering: 10k neurons/day free
  limits: Cloudflare's free allocation "allows anyone to use a total of 10,000 Neurons
    per day at no charge", which at its own $0.011 per 1,000 Neurons is about $0.11
    of inference a day. "All limits reset daily at 00:00 UTC", and past the cap "further
    operations will fail with an error" rather than being billed. Rate limits are
    per task type — 300 requests per minute for Text Generation. Seven catalog models
    sit outside the free lane whatever the neuron count — "Some models require a paid
    billing method. This applies to @cf/moonshotai/kimi-k2.6, @cf/moonshotai/kimi-k2.7-code,
    @cf/zai-org/glm-5.2, @cf/zai-org/glm-5.3, @cf/zai-org/glm-5.3-flash, @cf/deepseek-ai/deepseek-v4-flash-0731,
    and @cf/deepseek-ai/deepseek-v4-pro-0813" (read 2026-09-27; GLM 5.3 Flash was
    free on 2026-08-14)
  free_part: sum
  models: []
  api:
    base_url: https://api.cloudflare.com/client/v4/accounts/{account_id}/ai/v1
    key_url: https://dash.cloudflare.com/profile/api-tokens
    auth: api-key
    openai_compatible: true
    model_ids:
    - '@cf/qwen/qwen3.8-27b'
    - '@cf/meta/llama-4-scout-17b-16e-instruct'
    note: substitute {account_id} with your Cloudflare account ID
  data_use:
    trains: 'no'
    quote: Cloudflare does not use your Customer Content to (1) train any AI models
      made available on Workers AI or (2) improve any Cloudflare or third-party services
    url: https://developers.cloudflare.com/workers-ai/platform/data-usage/
  border:
    left_out: []
    'on': '2026-09-26'
    source: https://www.cloudflare.com/terms/
  probe:
    type: page-keywords
    endpoint: https://developers.cloudflare.com/workers-ai/platform/pricing/
    keywords:
    - 10,000 neurons per day
    - free allocation
    free_marker: ''
    require_zero_price: false
    machinery_keywords: []
  first_seen: '2026-07-19'
  last_verified: '2026-10-05'
  probe_failures: 0
  provisional: false
  rank: 40
- id: ollama-cloud
  name: Ollama Cloud
  category: api-free-tier
  url: https://ollama.com/cloud
  source_urls:
  - https://ollama.com/cloud
  card_required: false
  offering: Cloud-hosted open models on a $0 plan that grants starter usage credits
    for a starter subset of the catalog
  limits: 'The $0 plan is a wallet rather than a lane: "Starter usage credits included"
    and "Includes access to starter models", with "Add credits to unlock all models"
    under them. Neither figure is published — no credit amount and no starter-model
    list — and every cloud model carries a per-million-token price on the same page
    (gpt-oss:20b $0.07 in / $0.30 out, kimi-k3 $3.00 / $15.00). Free gets 1 concurrent
    request against Pro''s 3, and the included usage "resets monthly from the date
    you signed up" without rolling over. The starter set can only be measured: on
    2026-09-02 a key on the $0 plan got answers from gpt-oss:120b, gemma4:31b and
    nemotron-3-ultra and 402 Payment Required from minimax-m3, so the edge of the
    set is not the price — nemotron-3-ultra is inside at $0.10/$3.00, minimax-m3 outside
    at $0.60/$2.40. Read 2026-09-02'
  free_part: unnamed
  models: []
  api:
    base_url: https://ollama.com/v1
    key_url: https://ollama.com/settings/keys
    auth: api-key
    openai_compatible: true
    model_ids:
    - gpt-oss:120b
    - gemma4:31b
    - nemotron-3-ultra
    note: Starter-model eligibility is unpublished. The listed IDs answered a $0-plan
      key; minimax-m3 returned `402 Payment Required`. /v1/models lists the whole
      catalog, including models outside the starter allowance.
  data_use:
    trains: 'no'
    quote: Prompt or response data is never logged or trained on. … When Ollama partners
      with providers, we require no logging, no training, and zero data retention
      policies in place.
    url: https://ollama.com/pricing
  border:
    left_out: []
    'on': '2026-09-26'
    source: https://ollama.com/terms
  probe:
    type: page-keywords
    endpoint: https://ollama.com/cloud
    keywords:
    - Starter usage credits included
    - Includes access to starter models
    free_marker: ''
    require_zero_price: false
    catalog: https://ollama.com/v1/models
    machinery_keywords: []
  first_seen: '2026-07-19'
  last_verified: '2026-10-05'
  probe_failures: 0
  provisional: false
  rank: 92
- id: opencode
  name: opencode
  category: agent-cli
  url: https://opencode.ai
  source_urls:
  - https://opencode.ai/docs/zen/
  - https://opencode.ai/docs/
  - https://github.com/anomalyco/opencode/issues/49590#issuecomment-5723721001
  - https://dev.meta.ai/docs/reasoning.md
  card_required: false
  offering: Open-source coding agent whose opencode Zen gateway prices a rotating
    set of models at zero — inside OpenCode only, no sign-in; any provider via BYOK
  limits: 'The free ids work inside OpenCode and nowhere else. Since 2026-09-17 Zen
    has answered every other client with `403 FreeTierError: OpenCode''s free tier
    can only be used from within OpenCode`, and on 2026-09-18 an OpenCode maintainer
    wrote "You cannot use the free tier in other harnesses (this is only a limitation
    for the free tier nothing else)", so this row publishes no base URL. Inside OpenCode
    the ids are `opencode/<model-id>`, and all six answered the official 1.18.31 CLI,
    signed out, on 2026-09-18. By 2026-09-27 the page adds MiMo-V2.6-Flash Free and
    LongCat 2.5 Preview Free, waiting their two weeks, and the stealth Space Bunny
    Free and Jev 1.13 Free, a decision model, which stay out. Each is "available on
    OpenCode for a limited time", and the price is data: of the free models "collected
    data may be used to improve the model", the NVIDIA-backed ones are "Trial use
    only — do not submit personal or confidential data", and Muse Spark 1.3 Contributor
    is discounted "in exchange for permission to use your prompts and completions
    to train future Meta models". Mind the suffix: plain muse-spark-1.3 is a paid
    row, and max effort is "Standard-tier `muse-spark-1.3` only". Read 2026-09-27'
