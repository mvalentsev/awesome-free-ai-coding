entries:
- id: openrouter-free
  name: OpenRouter (free models)
  category: aggregator
  url: https://openrouter.ai
  source_urls:
  - https://openrouter.ai/docs/faq
  - https://openrouter.ai/docs/api_reference/limits
  - https://openrouter.ai/docs/cookbook/coding-agents/claude-code-integration
  card_required: false
  offering: One API key for a rotating set of :free model variants, open-weight and
    stealth models among them
  limits: 20 requests per minute on any :free id, 50 requests per day, and 1,000 per
    day once the account has purchased at least 10 credits all-time. Those four figures
    are in the page only as JS constants — FREE_MODEL_RATE_LIMIT_RPM, FREE_MODEL_NO_CREDITS_RPD,
    FREE_MODEL_HAS_CREDITS_RPD and FREE_MODEL_CREDITS_THRESHOLD — and the table that
    should show them serves empty cells to anything reading the HTML. OpenRouter's
    FAQ says its free models "have low rate limits" and "are usually not suitable
    for production use", warns that a negative credit balance can produce errors "including
    for free models", and notes a 429 may come from the upstream provider rather than
    the platform (read 2026-08-14)
  models:
  - family: nemotron-3-ultra
    tier: strong
    released: 2026-03
  - family: gemma-4
    tier: strong
    released: 2026-04
  api:
    base_url: https://openrouter.ai/api/v1
    key_url: https://openrouter.ai/settings/keys
    auth: api-key
    openai_compatible: true
    model_ids:
    - nvidia/nemotron-3-ultra-550b-a55b:free
    - nvidia/nemotron-3-super-120b-a12b:free
    - nvidia/nemotron-3.5-lightning:free
    - nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
    - nvidia/nemotron-3.5-content-safety:free
    - google/gemma-4-31b-it:free
    - google/gemma-4-26b-a4b-it:free
    - cohere/north-mini-code:free
    - poolside/laguna-s-2.1:free
    - poolside/laguna-xs-2.1:free
    - thinkingmachines/inkling:free
    - thinkingmachines/inkling-small:free
    - dots-studio/dots-3-note-preview:free
    - inclusionai/ling-3.0-flash-fin:free
    - inclusionai/ling-3.0-flash-sante:free
    - liquid/lfm-2.5-2.6b:free
    - inclusionai/ling-3.0-flash-vl:free
    - nex-agi/nex-n2.5-pro:free
    - nex-agi/nex-n2.5-mini:free
    - z-ai/glm-5.2:free
    - openrouter/free
    anthropic_base_url: https://openrouter.ai/api
    note: 'pick models with the :free suffix: every id carrying it is priced 0/0,
      twenty on 2026-09-16, and the lane rotates, so a new id waits two weeks for
      the Models column. Six are not coding models: openrouter/free is the free-models
      router, nemotron-3.5-content-safety a guardrail, ling-3.0-flash-fin and ling-3.0-flash-sante
      finance- and health-tuned, nemotron-3-nano-omni a perception sub-agent, and
      LiquidAI warns lfm-2.5-2.6b off agentic coding. For Claude Code, OpenRouter''s
      cookbook sets ANTHROPIC_BASE_URL to https://openrouter.ai/api with ANTHROPIC_API_KEY
      empty and a :free id as ANTHROPIC_MODEL'
  probe:
    type: api-models
    endpoint: https://openrouter.ai/api/v1/models
    keywords: []
    free_marker: :free
    dead_markers: []
    require_zero_price: true
    machinery_keywords: []
  first_seen: '2026-07-19'
  last_verified: '2026-09-14'
  probe_failures: 0
  provisional: false
  rank: 10
- id: google-ai-studio
  name: Google AI Studio (Gemini API)
  category: api-free-tier
  url: https://aistudio.google.com
  source_urls:
  - https://ai.google.dev/gemini-api/docs/pricing
  - https://ai.google.dev/gemini-api/docs/rate-limits
  card_required: false
  offering: Free tier on the Gemini API, priced model by model rather than as one
    account quota
  limits: 'Google prices the free tier per model: its pricing page reads "Free of
    charge" for input, output and context caching on Gemini 3.8 Flash — the newest
    of them, "our most intelligent Flash model, engineered for long-horizon software
    engineering", free in the same column that prices it at $0.75/$3.75 per 1M on
    the paid tier (read 2026-09-08) — and on 3.7 Flash, 3.6 Flash, 3.5 Flash, 3.5
    Flash-Lite, 3.1 Flash-Lite, 3 Flash Preview, 2.5 Pro and 2.5 Flash, with "Not
    available" in the same column for Gemini 3.1 Pro Preview, Omni Flash Preview and
    the Live previews. A new generation arrives here as an addition: every Flash before
    it kept its free column when 3.8 landed. What the free tier costs instead is one
    row lower in each table: "Used to improve our products" is Yes on the free tier
    and No on the paid one. The per-model RPM/TPM/RPD figures are no longer published
    anywhere a probe can read — the rate-limits page keeps only the usage-tier table,
    whose free row reads "Active project or free trial", and sends you to aistudio.google.com/rate-limit,
    which needs a sign-in (read 2026-08-14)'
  models:
  - family: gemini-3.8-flash
    tier: strong
    released: ''
  - family: gemini-3.7-flash
    tier: strong
    released: ''
  - family: gemini-3.5-flash-lite
    tier: strong
    released: ''
  - family: gemini-2.5-pro
    tier: strong
    released: ''
  api:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    key_url: https://aistudio.google.com/apikey
    auth: api-key
    openai_compatible: true
    model_ids: []
    note: pass the key as Bearer
  probe:
    type: page-keywords
    endpoint: https://ai.google.dev/gemini-api/docs/pricing
    keywords:
    - gemini-2.5-flash
    - free of charge
    free_marker: ''
    dead_markers: []
    require_zero_price: false
    machinery_keywords: []
  first_seen: '2026-07-19'
  last_verified: '2026-09-14'
  probe_failures: 0
  provisional: false
  rank: 10
- id: groq-free
  name: Groq
  category: api-free-tier
  url: https://groq.com
  source_urls:
  - https://console.groq.com/docs/rate-limits
  card_required: false
  offering: Fast inference against a free plan Groq publishes as a per-model rate
    table
  limits: 'Groq states the free plan as a table rather than one quota, in RPM / RPD
    / TPM / TPD: 30 / 1K / 8K / 200K on openai/gpt-oss-120b, gpt-oss-20b, gpt-oss-safeguard-20b,
    qwen/qwen3.6-27b and qwen/qwen3.8-27b, 30 / 14.4K / 15K / 500K on the two meta-llama/llama-prompt-guard
    classifiers, 30 / 250 / 70K on groq/compound and compound-mini, 20 / 2K on the
    two whisper models and 10 / 100 / 1.2K / 3.6K on the two canopylabs/orpheus voices
    (read 2026-09-08). Those thirteen rows are the whole free plan, and no Llama is
    among them any more: llama-3.3-70b-versatile and llama-3.1-8b-instant were both
    in the table on 2026-08-14 and are gone from it now, surviving only inside the
    OpenAPI schema and the response samples the page embeds — where llama-4 has always
    been, and where this row''s old anchor keyword was matching. Groq calls the table
    "a high level summary and there may be exceptions", and points at the limits page
    in an account for the exact figures'
  models:
  - family: gpt-oss
    tier: strong
    released: 2025-08
  - family: qwen3.6
    tier: strong
    released: ''
  - family: qwen3.8
    tier: strong
    released: ''
  api:
    base_url: https://api.groq.com/openai/v1
    key_url: https://console.groq.com/keys
    auth: api-key
    openai_compatible: true
    model_ids:
    - openai/gpt-oss-120b
    - openai/gpt-oss-20b
    - qwen/qwen3.6-27b
    - qwen/qwen3.8-27b
    note: the chat models Groq's own Free Plan Limits table names; its safeguard and
      prompt-guard classifiers, compound systems, whisper and orpheus rows are left
      out
  probe:
    type: page-keywords
    endpoint: https://console.groq.com/docs/rate-limits
    keywords:
    - free plan limits
    - qwen/qwen3.8-27b
    free_marker: ''
    dead_markers: []
    require_zero_price: false
    machinery_keywords: []
  first_seen: '2026-07-19'
  last_verified: '2026-09-14'
  probe_failures: 0
  provisional: false
  rank: 20
- id: mistral-free
  name: Mistral AI Studio
  category: api-free-tier
  url: https://mistral.ai
  source_urls:
  - https://mistral.ai/pricing
  - https://docs.mistral.ai/admin/billing-usage/subscriptions
  - https://docs.mistral.ai/getting-started/quickstarts/studio/activate-and-generate-api-key
  - https://docs.mistral.ai/admin/billing-usage/usage-limits
  card_required: false
  offering: Mistral's Free plan — API keys with $10 a month of included usage, shared
    by the API, Studio and the Vibe coding CLI, no card
  limits: 'The Free card on mistral.ai/pricing lists "Limited coding sessions", "Test
    Mistral models in Studio" and "$10 /mo in API credits", where Pro''s card says
    $30. The docs say where the allowance goes: "Mistral plans are global: the same
    plan applies across Vibe, Studio, and API usage", "Free mode is the default state
    for new accounts", and "Each Mistral plan includes monthly usage that is shared
    across Studio, the API, and Vibe Code. Usage consumes this monthly allowance first"
    — past it, usage "can stop until the next billing period" unless pay-as-you-go
    is switched on. The quickstart asks for nothing more: "Free mode: API access is
    enabled by default with no credit card required." What $10 buys is on the same
    page: "For example, Mistral Large costs $0.5 /M tokens in and $1.5 /M tokens out."
    Free mode also has the lowest rate limits — requests per second, tokens per minute
    and tokens per month, shown only inside the account — and API calls may be used
    to improve Mistral''s services unless the Admin panel''s `Anonymous improvement
    data` toggle is off.'
  models: []
  api:
    base_url: https://api.mistral.ai/v1
    key_url: https://console.mistral.ai/api-keys
    auth: api-key
    openai_compatible: true
    model_ids: []
    note: Free mode is on by default for a new account; create the key under Studio
      › API Keys. A key made under Code › Vibe CLI is a plan key that spends the plan's
      Vibe budget, which Mistral tells API users to avoid
  probe:
    type: page-keywords
    endpoint: https://mistral.ai/pricing
    keywords:
    - $10 /mo in API credits
    - Test Mistral models in Studio
    free_marker: ''
    dead_markers: []
    require_zero_price: false
    machinery_keywords: []
  first_seen: '2026-07-19'
  last_verified: '2026-09-14'
  probe_failures: 0
  provisional: false
  rank: 78
- id: github-models
  name: GitHub Models
  category: api-free-tier
  url: https://github.com/marketplace/models
  source_urls:
  - https://docs.github.com/en/github-models
  - https://github.blog/changelog/2026-07-01-github-models-is-being-fully-retired-on-july-30-2026/
  - https://models.inference.ai.azure.com
  card_required: false
  offering: Free playground+API for catalog models with GitHub account
  limits: Per-model rate limits, free tier; closed to new customers on 2026-06-16
    and fully retired (playground, catalog, inference API, BYOK) on 2026-07-30
  models:
  - family: gpt-4.1
    tier: strong
    released: 2025-04
  api:
    base_url: https://models.github.ai/inference
    key_url: https://github.com/settings/personal-access-tokens
    auth: api-key
    openai_compatible: true
    model_ids: []
    note: GitHub PAT with models:read scope; model ids namespaced (openai/...)
  probe:
    type: api-models
    endpoint: https://models.github.ai/catalog/models
    keywords: []
    free_marker: ''
    dead_markers: []
    require_zero_price: false
    machinery_keywords: []
  first_seen: '2026-07-19'
  last_verified: '2026-07-30'
  retired_on: '2026-06-16'
  probe_failures: 1
  provisional: false
  rank: 80
- id: cloudflare-workers-ai
  name: Cloudflare Workers AI
  category: api-free-tier
  url: https://workers.cloudflare.com
  source_urls:
  - https://developers.cloudflare.com/workers-ai/platform/pricing/
  - https://developers.cloudflare.com/workers-ai/platform/limits/
  card_required: false
  offering: 10k neurons/day free
  limits: 'Cloudflare''s free allocation "allows anyone to use a total of 10,000 Neurons
    per day at no charge", which at its own $0.011 per 1,000 Neurons is about $0.11
    of inference a day. "All limits reset daily at 00:00 UTC", and past the cap "further
    operations will fail with an error" rather than being billed. Rate limits are
    per task type — 300 requests per minute for Text Generation. Three catalog models
    sit outside the free lane whatever the neuron count: the same page notes that
    @cf/moonshotai/kimi-k2.6, @cf/moonshotai/kimi-k2.7-code and @cf/zai-org/glm-5.2
    "require a paid billing method" (read 2026-08-14)'
  models:
  - family: llama-4
    tier: strong
    released: 2025-04
  api:
    base_url: https://api.cloudflare.com/client/v4/accounts/{account_id}/ai/v1
    key_url: https://dash.cloudflare.com/profile/api-tokens
    auth: api-key
    openai_compatible: true
    model_ids: []
    note: substitute {account_id} with your Cloudflare account ID
  probe:
    type: page-keywords
    endpoint: https://developers.cloudflare.com/workers-ai/platform/pricing/
    keywords:
    - 10,000 neurons per day
    - free allocation
    free_marker: ''
    dead_markers: []
    require_zero_price: false
    machinery_keywords: []
  first_seen: '2026-07-19'
  last_verified: '2026-09-14'
  probe_failures: 0
  provisional: false
  rank: 40
- id: ollama-cloud
  name: Ollama Cloud
  category: api-free-tier
  url: https://ollama.com/cloud
  source_urls:
  - https://ollama.com/cloud
  card_required: false
  offering: Cloud-hosted open models on a $0 plan that grants starter usage credits
    for a starter subset of the catalog
  limits: 'The $0 plan is a wallet rather than a lane: "Starter usage credits included"
    and "Includes access to starter models", with "Add credits to unlock all models"
    under them. Neither figure is published — no credit amount and no starter-model
    list — and every cloud model carries a per-million-token price on the same page
    (gpt-oss:20b $0.07 in / $0.30 out, kimi-k3 $3.00 / $15.00). Free gets 1 concurrent
    request against Pro''s 3, and the included usage "resets monthly from the date
    you signed up" without rolling over. The starter set can only be measured: on
    2026-09-02 a key on the $0 plan got answers from gpt-oss:120b, gemma4:31b and
    nemotron-3-ultra and 402 Payment Required from minimax-m3, so the edge of the
    set is not the price — nemotron-3-ultra is inside at $0.10/$3.00, minimax-m3 outside
    at $0.60/$2.40. Read 2026-09-02'
  models: []
  api:
    base_url: https://ollama.com/v1
    key_url: https://ollama.com/settings/keys
    auth: api-key
    openai_compatible: true
    model_ids:
    - gpt-oss:120b
    - gemma4:31b
    - nemotron-3-ultra
    note: the three ids left are the ones a key on the $0 plan actually answered on
      2026-09-02, in that order of speed; minimax-m3 was dropped from this list because
      the same key gets 402 Payment Required for it. Which models the starter credits
      reach is published nowhere, so this list is measured rather than read, and /v1/models
      still lists the whole catalog, starter and metered alike
  probe:
    type: page-keywords
    endpoint: https://ollama.com/cloud
    keywords:
    - Starter usage credits included
    - Includes access to starter models
    free_marker: ''
    dead_markers: []
    require_zero_price: false
    catalog: https://ollama.com/v1/models
    machinery_keywords: []
  first_seen: '2026-07-19'
  last_verified: '2026-09-14'
  probe_failures: 0
  provisional: false
  rank: 92
- id: opencode
  name: opencode
  category: agent-cli
  url: https://opencode.ai
  source_urls:
  - https://opencode.ai/docs/zen/
  - https://opencode.ai/docs/
  - https://github.com/anomalyco/opencode/blob/dev/packages/opencode/src/session/llm/request.ts
  - https://opencode.ai/docs/go/
  - https://github.com/Kilo-Org/kilocode/issues/13723
  - https://dev.meta.ai/docs/reasoning.md
  card_required: false
  offering: Open-source coding agent whose opencode Zen gateway prices a rotating
    set of models at zero — Big Pickle, MiMo-V2.5, Ling 3.0 Flash Fin, Nemotron 3
    Ultra, Nemotron 3.5 Lightning, Muse Spark 1.3 Contributor — callable from other
    clients too, keyless, with a session header; any provider via BYOK
  limits: 'Zen prices its free ids at zero and calls each one "available on OpenCode
    for a limited time". The price is data: the privacy section says of the free models
    that "collected data may be used to improve the model", the NVIDIA-backed ones
    are "Trial use only — do not submit personal or confidential data", and Muse Spark
    1.3 Contributor trades "heavily discounted token pricing in exchange for permission
    to use your prompts and completions to train future Meta models". Mind the suffix:
    plain muse-spark-1.3 is a paid row, so the Models column names the contributor
    id, whose best allowed effort, xhigh, scores 45 on the Artificial Analysis Intelligence
    Index — max is "Standard-tier `muse-spark-1.3` only". Since 2026-09-07 every request
    for a free id must carry a stable id per conversation in x-opencode-session, a
    header OpenCode documents for other clients on the page of OpenCode Go, its keyed
    subscription: "Send a stable session ID in x-opencode-session for each conversation".
    The free ids need no key and no billing details; billing is for the metered ids.
    Read 2026-09-16'
  models:
  - family: big-pickle
    tier: strong
    released: ''
  - family: mimo-v2.5
    tier: strong
    released: ''
  - family: ling-3.0-flash-fin
    tier: strong
    released: ''
  - family: nemotron-3-ultra
    tier: strong
    released: ''
  - family: nemotron-3.5-lightning
    tier: strong
    released: ''
  - family: muse-spark-1.3-contributor
    tier: frontier
    released: 2026-09
  api:
    base_url: https://opencode.ai/zen/v1
    key_url: https://opencode.ai/auth
    auth: none
    openai_compatible: true
    model_ids:
    - ling-3.0-flash-fin-free
    - big-pickle
    - mimo-v2.5-free
    - nemotron-3-ultra-free
    - nemotron-3.5-lightning-free
    - muse-spark-1.3-contributor-free
    session_header: x-opencode-session
    note: no key needed for the free ids as long as every request carries a stable
      id per conversation in x-opencode-session; ling-3.0-flash-fin-free answered
      keyless three times out of three on 2026-09-16 while big-pickle and mimo-v2.5-free
      answered 429 FreeUsageLimitError every time. Clients send the header themselves,
      so the generated LiteLLM and opencode configs leave this row out; inside OpenCode
      the ids are opencode/<model-id>. muse-spark-1.3-contributor-free is served on
      /v1/responses only
  probe:
    type: page-keywords
    endpoint: https://opencode.ai/docs/zen/
    keywords:
    - big pickle
    - mimo-v2.5-free
    free_marker: ''
    dead_markers: []
    require_zero_price: false
    catalog: https://opencode.ai/zen/v1/models
    machinery_keywords: []
  first_seen: '2026-07-19'
  last_verified: '2026-09-14'
  probe_failures: 0
  provisional: false
  rank: 10
- id: kilo-code
  name: Kilo Code
  category: agent-cli
  url: https://kilo.ai
  source_urls:
  - https://kilo.ai/pricing
  - https://api.kilo.ai/api/gateway/models
  - https://kilo.ai/docs/gateway/authentication
  - https://kilocode.ai
  card_required: false
  offering: Open-source VS Code / JetBrains / CLI agent whose $0 plan routes "Auto
    Free" to the models the Kilo Gateway marks free; the same gateway serves them
    to any OpenAI client without a key, with BYOK and local models alongside
  limits: '$0 a month, and no account for the free lane: "The gateway allows unauthenticated
    access for free models only. Anonymous requests are identified by IP address and
    are subject to rate limiting (200 requests per hour per IP)". The lane is whatever
    the gateway marks isFree — 20 ids on 2026-09-16, Nemotron 3 Ultra, Step 3.7 Flash
    and Laguna S 2.1 among them — and it rotates within days, so an id waits two weeks
    before it joins the Models column. It costs something other than money: every
    free id carries mayTrainOnYourPrompts, which almost no metered id does. Auto Free
    routes over the free models the catalog''s autoRouting list names. Everything
    else runs on pay-as-you-go credits or a Kilo Pass subscription. Read 2026-09-16'
  models:
  - family: nemotron-3-ultra
    tier: strong
    released: 2026-03
  - family: nemotron-3-super
    tier: strong
    released: 2026-03
  - family: north-mini-code
    tier: strong
    released: 2026-06
  - family: step-3.7-flash
    tier: strong
    released: 2026-06
  - family: laguna-s-2.1
    tier: strong
    released: 2026-07
  - family: laguna-xs-2.1
    tier: strong
    released: 2026-07
  api:
    base_url: https://api.kilo.ai/api/gateway
    key_url: https://app.kilo.ai/profile
    auth: none
    openai_compatible: true
    model_ids:
    - kilo-auto/free
    - openrouter/free
    - nvidia/nemotron-3-ultra-550b-a55b:free
    - nvidia/nemotron-3-super-120b-a12b:free
    - nvidia/nemotron-3.5-lightning:free
    - nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
    - nvidia/nemotron-3.5-content-safety:free
    - cohere/north-mini-code:free
    - stepfun/step-3.7-flash:free
    - poolside/laguna-s-2.1:free
    - poolside/laguna-xs-2.1:free
    - liquid/lfm-2.5-2.6b:free
    - inclusionai/ling-3.0-flash-fin:free
    - inclusionai/ling-3.0-flash-sante:free
    - dots-studio/dots-3-note-preview:free
    - thinkingmachines/inkling-small:free
    - inclusionai/ling-3.0-flash-vl:free
    - nex-agi/nex-n2.5-pro:free
    - nex-agi/nex-n2.5-mini:free
    - z-ai/glm-5.2:free
    note: no key at all for the free ids, capped at 200 requests per hour per IP;
      a metered id answers 401 `You need to sign in to use this model`. Every id listed
      is one the catalog marks isFree and mayTrainOnYourPrompts. kilo-auto/free leads
      because it routes over the free models the catalog's autoRouting list names;
      it and openrouter/free are routers and nemotron-3.5-content-safety is a guardrail
      classifier, so none of the three is a coding model
  probe:
    type: api-models
    endpoint: https://api.kilo.ai/api/gateway/models
    keywords: []
    free_marker: :free
    dead_markers: []
    require_zero_price: true
    machinery_keywords: []
  first_seen: '2026-07-19'
  last_verified: '2026-09-14'
  probe_failures: 0
  provisional: false
  rank: 20
- id: trae
  name: Trae
  category: trial
  url: https://www.trae.ai
  source_urls:
  - https://www.trae.ai/pricing
  card_required: false
  offering: AI IDE whose Free plan runs Auto mode only — no model choice — on a monthly
    Basic usage allowance of a few dollars and 5,000 autocompletions
  limits: 'Trae publishes the Free plan as words — "Auto mode only", "Limited usage",
    "Limited Autocomplete", "Autocompletion 5000 / month", "Concurrent Cloud Tasks
    2" — and as numbers in the page payload, where basic_usage_limit is the dollar
    figure the paid plans print as "$20 usage / month". That figure depends on where
    the page is served: on 2026-09-16 a GitHub runner read $3 of Basic usage on Free
    and another network $1, with different paid-plan figures and prices too. Both
