- id: mistral-free
  name: Mistral Studio
  category: api-free-tier
  url: https://mistral.ai
  source_urls:
  - https://mistral.ai/pricing
  - https://docs.mistral.ai/admin/billing-usage/subscriptions
  - https://docs.mistral.ai/getting-started/quickstarts/studio/activate-and-generate-api-key
  - https://docs.mistral.ai/admin/billing-usage/usage-limits
  card_required: false
  offering: Mistral's Free mode — no-card API access with an unpublished monthly allowance
    shared across Studio, API and the Vibe coding CLI
  limits: The monthly allowance is shared across Studio, API and Vibe usage in the
    organization; its Free-mode amount is not published. Free mode is the default
    for new accounts, with no credit card required. At the cap usage can stop until
    the next billing period unless pay-as-you-go is enabled. API throughput values
    are visible inside the account. API calls may be used to improve Mistral services
    unless the Admin panel's `Anonymous improvement data` toggle is off.
  quotas:
  - unit: usage
    period: month
    scope: organization
    label: Shared Studio, API and Vibe allowance
    source: https://docs.mistral.ai/admin/billing-usage/subscriptions
    quote: Each Mistral plan includes monthly usage that is shared across Studio,
      the API, and Vibe Code.
    reviewed_on: '2026-10-29'
  - unit: requests
    period: second
    scope: organization-model
    state: account-specific
    label: API rate limits
    source: https://docs.mistral.ai/admin/billing-usage/usage-limits
    quote: 'Requests per second: The request throughput limit for the model.'
    reviewed_on: '2026-10-29'
  - unit: tokens
    period: minute
    scope: organization-model
    state: account-specific
    label: API rate limits
    source: https://docs.mistral.ai/admin/billing-usage/usage-limits
    quote: 'Tokens per minute: The token throughput limit for the model.'
    reviewed_on: '2026-10-29'
  free_part: sum
  models: []
  api:
    base_url: https://api.mistral.ai/v1
    key_url: https://console.mistral.ai/api-keys
    auth: api-key
    openai_compatible: true
    model_ids:
    - mistral-large-latest
    - mistral-medium-latest
    note: Free mode is on by default for a new account; create the key under Studio
      › API Keys. A key made under Code › Vibe CLI is a plan key that spends the plan's
      Vibe budget, which Mistral tells API users to avoid. The ids are the ones Mistral's
      own API quickstart and docs call
  data_use:
    trains: opt-out
    quote: As stated during subscription, we may use your data (input and output)
      to train our artificial intelligence models. … You have the right to opt out
      of this program at any time.
    url: https://help.mistral.ai/en/articles/347617-do-you-use-my-user-data-to-train-your-artificial-intelligence-models
  border:
    left_out: [CU, IR, KP, SY]
    'on': '2026-09-26'
    source: https://legal.mistral.ai/terms/commercial-terms-of-service
    quote: including, as of the Effective Date, Cuba, Iran, North Korea, Syria, and
      the Crimea, Donetsk, and Luhansk regions of Ukraine
    also_named: [AU, BD, CN, FR, IN, JP, KR, NZ, PK, SG, TH, UA, US, VN]
  probe:
    type: page-keywords
    endpoint: https://docs.mistral.ai/admin/billing-usage/subscriptions
    keywords:
    - Free mode is the default state for new accounts
    - Each Mistral plan includes monthly usage that is shared across Studio, the API,
      and Vibe Code
    free_marker: ''
    require_zero_price: false
    machinery_keywords: []
  first_seen: '2026-07-19'
  last_verified: '2026-10-26'
  probe_failures: 0
  provisional: false
  rank: 78
