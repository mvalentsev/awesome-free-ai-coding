- id: cloudflare-workers-ai
  name: Cloudflare Workers AI
  category: api-free-tier
  url: https://www.cloudflare.com/products/workers-ai/
  source_urls:
  - https://developers.cloudflare.com/workers-ai/platform/pricing/
  - https://developers.cloudflare.com/workers-ai/platform/limits/
  card_required: false
  offering: Serverless model inference on Cloudflare, with an OpenAI-compatible API
    and a daily free allowance
  limits: Past the free allowance "further operations will fail with an error". Some
    models require a paid billing method through the Workers Paid plan or prepaid
    AI Gateway credits even if neurons remain; the pricing page identifies them. The
    free text-generation rate does not apply to models requiring paid access.
  quotas:
  - amount: 10000.0
    unit: neurons
    period: day
    scope: account
    reset: All limits reset daily at 00:00 UTC.
    source: https://developers.cloudflare.com/workers-ai/platform/pricing/
    quote: Our free allocation allows anyone to use a total of 10,000 Neurons per
      day at no charge.
  - amount: 300.0
    unit: requests
    period: minute
    scope: account
    label: Free text generation
    source: https://developers.cloudflare.com/workers-ai/platform/limits/
