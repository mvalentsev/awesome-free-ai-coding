entries:
- id: openrouter-free
  name: OpenRouter (free models)
  category: aggregator
  url: https://openrouter.ai
  source_urls:
  - https://openrouter.ai/docs/faq
  - https://openrouter.ai/docs/api_reference/limits
  card_required: false
  offering: One API key for rotating :free variants of frontier models
  limits: 20 requests per minute on any :free id, 50 requests per day, and 1,000 per
    day once the account has purchased at least 10 credits all-time. Those four figures
    are in the page only as JS constants — FREE_MODEL_RATE_LIMIT_RPM, FREE_MODEL_NO_CREDITS_RPD,
    FREE_MODEL_HAS_CREDITS_RPD and FREE_MODEL_CREDITS_THRESHOLD — and the table that
    should show them serves empty cells to anything reading the HTML. OpenRouter describes
    :free as "always provided for free and has low rate limits", warns that a negative
    credit balance can produce errors "including for free models", and notes a 429
    may come from the upstream provider rather than the platform (read 2026-08-14)
  models:
  - family: gpt-oss
    tier: strong
    released: 2025-08
  - family: nemotron-3-ultra
    tier: strong
    released: 2026-03
  - family: gemma-4
    tier: strong
    released: 2026-04
  api:
    base_url: https://openrouter.ai/api/v1
    key_url: https://openrouter.ai/settings/keys
    auth: api-key
    openai_compatible: true
    model_ids:
    - openrouter/free
    - openai/gpt-oss-20b:free
    - nvidia/nemotron-3-ultra-550b-a55b:free
    - google/gemma-4-31b-it:free
    - cohere/north-mini-code:free
    - poolside/laguna-xs-2.1:free
    note: pick models with the :free suffix; the five suffixed ids were zero-priced
      on 2026-08-11. openrouter/free is different in kind — the catalog calls it the
      Free Models Router, prices it 0/0 and lets it pick whichever free model is up,
      so it is the id that survives this lane rotating (confirmed 2026-08-14). It is
      a router, not a coding model, which is why it is here and not in the column
  probe:
    type: api-models
    endpoint: https://openrouter.ai/api/v1/models
    keywords: []
    free_marker: :free
    dead_markers: []
    require_zero_price: true
  first_seen: '2026-07-19'
  last_verified: '2026-08-13'
  probe_failures: 0
  provisional: false
  rank: 10
- id: google-ai-studio
  name: Google AI Studio (Gemini API)
  category: api-free-tier
  url: https://aistudio.google.com
  source_urls:
  - https://ai.google.dev/gemini-api/docs/pricing
  - https://ai.google.dev/gemini-api/docs/rate-limits
  card_required: false
  offering: Free tier on the Gemini API, priced model by model rather than as one
    account quota
  limits: 'Google prices the free tier per model: its pricing page reads "Free of
    charge" for input, output and context caching on Gemini 3.7 Flash, 3.6 Flash,
    3.5 Flash, 3.5 Flash-Lite, 3.1 Flash-Lite, 3 Flash Preview, 2.5 Pro and 2.5 Flash,
    and "Not available" in the same column for Gemini 3.1 Pro Preview, Omni Flash
    Preview and the Live previews. What the free tier costs instead is one row lower
    in each table: "Used to improve our products" is Yes on the free tier and No on
    the paid one. The per-model RPM/TPM/RPD figures are no longer published anywhere
    a probe can read — as of its own "Last updated 2026-08-13" the rate-limits page
    keeps only the usage-tier table ("Free — Active project or free trial") and sends
    you to aistudio.google.com/rate-limit, which needs a sign-in (read 2026-08-14)'
  models:
  - family: gemini-3.7-flash
    tier: frontier
  - family: gemini-3.5-flash-lite
    tier: strong
  - family: gemini-2.5-pro
    tier: frontier
  api:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    key_url: https://aistudio.google.com/apikey
    auth: api-key
    openai_compatible: true
    model_ids: []
    note: pass the key as Bearer
  probe:
    type: page-keywords
    endpoint: https://ai.google.dev/gemini-api/docs/pricing
    keywords:
    - gemini-2.5-flash
    - free of charge
    free_marker: ''
    dead_markers: []
    require_zero_price: false
  first_seen: '2026-07-19'
  last_verified: '2026-08-13'
  probe_failures: 0
  provisional: false
  rank: 99
- id: groq-free
  name: Groq
  category: api-free-tier
  url: https://groq.com
  source_urls:
  - https://console.groq.com/docs/rate-limits
  card_required: false
  offering: Fast inference against a free plan Groq publishes as a per-model rate
    table
  limits: 'Groq states the free plan as a table rather than one quota, in RPM / RPD
    / TPM / TPD: 30 / 14.4K / 6K / 500K on llama-3.1-8b-instant, 30 / 1K / 12K / 100K
    on llama-3.3-70b-versatile, 30 / 1K / 8K / 200K on openai/gpt-oss-120b, gpt-oss-20b
    and qwen/qwen3.6-27b, 30 / 250 / 70K on groq/compound and compound-mini, 20 /
    2K on the two whisper models (read 2026-08-14). Those thirteen rows are the whole
    free plan — no llama-4 among them, though the page carries the id in the API
    schema it embeds. Groq calls the table "a high level summary and there may be
    exceptions", and points at the limits page in an account for the exact figures'
  models:
  - family: llama-3.3
    tier: strong
    released: 2024-12
  - family: gpt-oss
    tier: strong
    released: 2025-08
  - family: qwen3.6
    tier: strong
  api:
    base_url: https://api.groq.com/openai/v1
    key_url: https://console.groq.com/keys
    auth: api-key
    openai_compatible: true
    model_ids:
    - llama-3.3-70b-versatile
    - llama-3.1-8b-instant
    - openai/gpt-oss-120b
    - openai/gpt-oss-20b
    - qwen/qwen3.6-27b
    note: the ids Groq's own Free Plan Limits table names
  probe:
    type: page-keywords
    endpoint: https://console.groq.com/docs/rate-limits
    keywords:
    - free plan limits
    - llama-3.3-70b-versatile
    free_marker: ''
    dead_markers: []
    require_zero_price: false
  first_seen: '2026-07-19'
  last_verified: '2026-08-13'
  probe_failures: 0
  provisional: false
  rank: 20
- id: cerebras-free
  name: Cerebras Inference
  category: trial
  url: https://www.cerebras.ai
  source_urls:
  - https://inference-docs.cerebras.ai/support/rate-limits
  - https://www.cerebras.ai/pricing
  - https://inference-docs.cerebras.ai/models
  card_required: true
  offering: Very fast inference; $5 in trial credits that expire in 30 days, card
    required before the API answers at all
  limits: 'Cerebras'' own docs: "New accounts receive $5 in free credits after adding
    a verified payment method", credits "expire 30 days after they''re granted", and
    "If you skip adding a payment method at sign-up, Playground and API access remain
    inactive until you do". Asked "Is there a permanently free tier?" the same page
    answers "No". Free Trial rate limits are per model — 5 RPM / 30K TPM / 1M TPD
    on each of the three (read 2026-08-14). The marketing pricing page still promises
    the credits "after making an account" and mentions no card. Cerebras'' model
    catalog adds that "Z.ai GLM 4.7 is scheduled for deprecation on August 17, 2026",
    so expect the Models column below to lose that row on or after that date'
  models:
  - family: gpt-oss
    tier: strong
    released: 2025-08
  - family: glm-4.7
    tier: strong
    released: 2026-01
  - family: gemma-4
    tier: strong
    released: 2026-04
  api:
    base_url: https://api.cerebras.ai/v1
    key_url: https://cloud.cerebras.ai
    auth: api-key
    openai_compatible: true
    model_ids:
    - gpt-oss-120b
    - zai-glm-4.7
    - gemma-4-31b
    note: 'the Free Trial tier reaches every model in the public catalog, which is
      these three: "Every model on the public Model Catalog is available on the Free
      Trial tier, subject to the per-model Free Trial rate limits"'
  probe:
    type: page-keywords
    endpoint: https://inference-docs.cerebras.ai/support/rate-limits
    keywords:
    - after adding a verified payment method
    - credits expire 30 days after
    free_marker: ''
    dead_markers: []
    require_zero_price: false
  first_seen: '2026-07-19'
  last_verified: '2026-08-13'
  probe_failures: 0
  provisional: false
  rank: 30
- id: mistral-free
  name: Mistral La Plateforme
  category: api-free-tier
  url: https://mistral.ai
  source_urls:
  - https://docs.mistral.ai/admin/user-management-finops/tier
  card_required: false
  offering: Free mode on La Plateforme — API keys plus an included monthly usage
    allowance
  limits: 'Mistral states the offer in one sentence and publishes no figure for it:
    "Free mode lets you create API keys and use included monthly usage within the
    limits shown on the Limits page". The limits it describes are per model — tokens
    per minute, requests per second, audio seconds per month — and are shown only
    inside an account, and paid use is documented as an extension of the same plan
    rather than a second one ("It is not a separate plan for the API"). The page
    names no model, which is why the Free models column here is empty (read
    2026-08-14)'
  models: []
  api:
    base_url: https://api.mistral.ai/v1
    key_url: https://console.mistral.ai/api-keys
    auth: api-key
    openai_compatible: true
    model_ids: []
    note: Experiment tier needs account activation
  probe:
    type: page-keywords
    endpoint: https://docs.mistral.ai/admin/user-management-finops/tier
    keywords:
    - free mode
    - included monthly usage within the limits shown on the Limits page
    free_marker: ''
    dead_markers: []
    require_zero_price: false
  first_seen: '2026-07-19'
  last_verified: '2026-08-13'
  probe_failures: 0
  provisional: false
  rank: 90
- id: github-models
  name: GitHub Models
  category: api-free-tier
  url: https://github.com/marketplace/models
  source_urls:
  - https://docs.github.com/en/github-models
  - https://github.blog/changelog/2026-07-01-github-models-is-being-fully-retired-on-july-30-2026/
  card_required: false
  offering: Free playground+API for catalog models with GitHub account
  limits: Per-model rate limits, free tier; closed to new customers on 2026-06-16
    and fully retired (playground, catalog, inference API, BYOK) on 2026-07-30
  models:
  - family: gpt-4.1
    tier: strong
    released: 2025-04
  api:
    base_url: https://models.github.ai/inference
    key_url: https://github.com/settings/personal-access-tokens
    auth: api-key
    openai_compatible: true
    model_ids: []
    note: GitHub PAT with models:read scope; model ids namespaced (openai/...)
  probe:
    type: api-models
    endpoint: https://models.github.ai/catalog/models
    keywords: []
    free_marker: ''
    dead_markers: []
    require_zero_price: false
  first_seen: '2026-07-19'
  last_verified: '2026-07-30'
  retired_on: '2026-06-16'
  probe_failures: 1
  provisional: false
  rank: 80
- id: cloudflare-workers-ai
  name: Cloudflare Workers AI
  category: api-free-tier
  url: https://workers.cloudflare.com
  source_urls:
  - https://developers.cloudflare.com/workers-ai/platform/pricing/
  - https://developers.cloudflare.com/workers-ai/platform/limits/
  card_required: false
  offering: 10k neurons/day free
  limits: 'Cloudflare''s free allocation "allows anyone to use a total of 10,000 Neurons
    per day at no charge", which at its own $0.011 per 1,000 Neurons is about $0.11
    of inference a day. "All limits reset daily at 00:00 UTC", and past the cap "further
    operations will fail with an error" rather than being billed. Rate limits are
    per task type — 300 requests per minute for Text Generation. Three catalog models
    sit outside the free lane whatever the neuron count: the same page notes that
    @cf/moonshotai/kimi-k2.6, @cf/moonshotai/kimi-k2.7-code and @cf/zai-org/glm-5.2
    "require a paid billing method" (read 2026-08-14)'
  models:
  - family: llama-4
    tier: strong
    released: 2025-04
  api:
    base_url: https://api.cloudflare.com/client/v4/accounts/{account_id}/ai/v1
    key_url: https://dash.cloudflare.com/profile/api-tokens
    auth: api-key
    openai_compatible: true
    model_ids: []
    note: substitute {account_id} with your Cloudflare account ID
  probe:
    type: page-keywords
    endpoint: https://developers.cloudflare.com/workers-ai/platform/pricing/
    keywords:
    - 10,000 neurons per day
    - free allocation
    free_marker: ''
    dead_markers: []
    require_zero_price: false
  first_seen: '2026-07-19'
  last_verified: '2026-08-13'
  probe_failures: 0
  provisional: false
  rank: 60
- id: ollama-cloud
  name: Ollama Cloud
  category: api-free-tier
  url: https://ollama.com/cloud
  source_urls:
  - https://ollama.com/cloud
  card_required: false
  offering: Cloud-hosted open models with free usage tier
  limits: 'The $0 plan reads "Access cloud models" and nothing more: which models
    it reaches is not published anywhere on ollama.com, only implied by a per-model
    "usage level" from 1 (gpt-oss:20b) to 4 (deepseek-v4-pro), while Pro is sold as
    "Access larger, more powerful cloud models". Tested by hand rather than read: nemotron-3
    ultra/super/nano, gpt-oss 120b/20b, gemma4:31b and minimax-m3 answered on the free
    plan on 2026-08-03, and every flagship (DeepSeek V4, GLM-5.x, Kimi K2.x, Qwen3.5,
    Mistral Large 3) returned 403 subscription-required'
  models: []
  api:
    base_url: https://ollama.com/v1
    key_url: https://ollama.com/settings/keys
    auth: api-key
    openai_compatible: true
    model_ids:
    - nemotron-3-ultra
    - minimax-m3
    - gpt-oss:120b
    - gemma4:31b
    note: Free-tier model set verified live 2026-08-03 by calling them; /v1/models
      lists the full catalog including subscription-only models
  probe:
    type: page-keywords
    endpoint: https://ollama.com/cloud
    keywords:
    - $0
    - Access cloud models
    free_marker: ''
    dead_markers: []
    require_zero_price: false
  first_seen: '2026-07-19'
  last_verified: '2026-08-13'
  probe_failures: 0
  provisional: false
  rank: 70
- id: opencode
  name: opencode
  category: agent-cli
  url: https://opencode.ai
  source_urls:
  - https://opencode.ai/docs/zen/
  - https://opencode.ai/docs/
  card_required: false
  offering: Open-source TUI/desktop coding agent with seven zero-priced models included
    via the opencode Zen gateway (Big Pickle, DeepSeek V4 Flash, MiMo-V2.5, Hy3, Laguna
    S 2.1, Nemotron 3 Ultra, Nemotron 3.5 Lightning); any provider via BYOK too
  limits: 'Zen prices seven ids at zero — big-pickle, deepseek-v4-flash-free, mimo-v2.5-free,
    hy3-free, laguna-s-2.1-free, nemotron-3-ultra-free and nemotron-3.5-lightning-free
    — and calls every one of them "available on OpenCode for a limited time" while
    the team collects feedback. That feedback is the price: the privacy section exempts
    each free model from Zen''s zero-retention policy ("during its free period, collected
    data may be used to improve the model"), and the two NVIDIA-backed ones are "trial
    use only — do not submit personal or confidential data". Mind the suffix: plain
    deepseek-v4-flash is the paid row at $0.14/$0.28 per 1M tokens. The documented
    signup is "sign in to OpenCode Zen, add your billing details, and copy your API
    key", and auto-reload charges $20 whenever the balance falls below $5 (read 2026-08-14)'
  models:
  - family: big-pickle
    tier: strong
    released: ''
  - family: deepseek-v4-flash
    tier: strong
    released: ''
  - family: mimo-v2.5
    tier: strong
    released: ''
  - family: hy3
    tier: strong
    released: ''
  - family: laguna-s-2.1
    tier: strong
    released: ''
  - family: nemotron-3-ultra
    tier: strong
    released: ''
  - family: nemotron-3.5-lightning
    tier: strong
    released: ''
  api:
    base_url: https://opencode.ai/zen/v1
    key_url: https://opencode.ai/auth
    auth: api-key
    openai_compatible: true
    model_ids:
    - big-pickle
    - deepseek-v4-flash-free
    - mimo-v2.5-free
    - hy3-free
    - laguna-s-2.1-free
    - nemotron-3-ultra-free
    - nemotron-3.5-lightning-free
    note: these are the seven ids Zen prices at zero; inside an opencode config the
      same id is written opencode/<model-id>. Every other id on the same base URL
      is metered
  probe:
    type: page-keywords
    endpoint: https://opencode.ai/docs/zen/
    keywords:
    - big pickle
    - mimo-v2.5-free
    free_marker: ''
    dead_markers: []
    require_zero_price: false
  first_seen: '2026-07-19'
  last_verified: '2026-08-13'
  probe_failures: 0
  provisional: false
  rank: 10
- id: kilo-code
  name: Kilo Code
  category: agent-cli
  url: https://kilo.ai
  source_urls:
  - https://kilo.ai/pricing
  - https://api.kilo.ai/api/gateway/models
  - https://kilocode.ai
  card_required: false
  offering: Open-source VS Code / JetBrains / CLI agent; its $0 plan routes "Auto
    Free" to the zero-priced models the Kilo Gateway carries, and the same gateway
    answers any OpenAI client directly, with BYOK and local models (Ollama, LM Studio)
    alongside
  limits: $0/mo, no hosted credit required — the free lane is a rotating set of zero-priced
    ids, 13 of them on 2026-08-14 with Nemotron 3 Ultra among them; everything else
    runs on pay-as-you-go credits or a Kilo Pass subscription
  models:
  - family: nemotron-3-ultra
    tier: frontier
    released: 2026-03
  - family: nemotron-3-super
    tier: strong
    released: 2026-03
  - family: north-mini-code
    tier: strong
    released: 2026-06
  - family: step-3.7-flash
    tier: strong
    released: 2026-06
  - family: laguna-s-2.1
    tier: strong
    released: 2026-07
  - family: laguna-xs-2.1
    tier: strong
    released: 2026-07
  api:
    base_url: https://api.kilo.ai/api/gateway
    key_url: https://app.kilo.ai/profile
    auth: api-key
    openai_compatible: true
    model_ids:
    - kilo-auto/free
    - openrouter/free
    - nvidia/nemotron-3-ultra-550b-a55b:free
    - nvidia/nemotron-3-super-120b-a12b:free
    - nvidia/nemotron-3.5-lightning:free
    - nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
    - nvidia/nemotron-3.5-content-safety:free
    - cohere/north-mini-code:free
    - stepfun/step-3.7-flash:free
    - poolside/laguna-s-2.1:free
    - poolside/laguna-xs-2.1:free
    - liquid/lfm-2.5-2.6b:free
    - tencent/hy3:free
    note: every id listed is priced 0 — the same catalog meters 346 more. kilo-auto/free
      and openrouter/free are routers, and nemotron-3.5-content-safety is a guardrail
      classifier, so none of the three is a coding model. The lane rotates fast —
      Ling 3.0 Flash left it in 2026-08, ling-3.0-tiny:free stood in its place for
      three days and was gone by 2026-08-14, with liquid/lfm-2.5-2.6b:free arriving
      instead — which is why the ids that come and go stay here and out of the
      Models column
  probe:
    type: api-models
    endpoint: https://api.kilo.ai/api/gateway/models
    keywords: []
    free_marker: :free
    dead_markers: []
    require_zero_price: true
  first_seen: '2026-07-19'
  last_verified: '2026-08-13'
  probe_failures: 0
  provisional: false
  rank: 20
- id: trae
  name: Trae
  category: trial
  url: https://www.trae.ai
  source_urls:
  - https://www.trae.ai/pricing
  card_required: false
  offering: Free access to frontier models in IDE
  limits: 'Trae publishes the free plan as words in its comparison table — "Limited
    usage", "Standard queue", "Autocompletion 5000 / month", "Concurrent Cloud Tasks
    2" — and as numbers in the payload that table is rendered from: the same basic_usage_limit
    field that prints "$5 Basic usage" on Lite and "$20" on Pro reads 3 on Free, alongside
    advanced_model_request_limit 1000, premium_model_fast_request_limit 10, premium_model_slow_request_limit
    50 and no_bonus_quota true. So the free plan is $3 of monthly Basic usage with
    no bonus quota, and the FAQ entry that would define Basic usage is collapsed with
    its answer absent from the page (read 2026-08-14)'
  models: []
  probe:
    type: page-keywords
    endpoint: https://www.trae.ai/pricing
    keywords:
    - '"name":"free"'
    - advanced_model_request_limit
    free_marker: ''
    dead_markers: []
    require_zero_price: false
  first_seen: '2026-07-19'
  last_verified: '2026-08-13'
  probe_failures: 0
  provisional: false
  rank: 70
- id: windsurf
  name: Devin Desktop (formerly Windsurf)
  category: trial
  url: https://devin.ai/desktop
  source_urls:
  - https://devin.ai/pricing
  - https://devin.ai/blog/windsurf-is-now-devin-desktop
  - https://windsurf.com
  - https://codeium.com
  card_required: false
  offering: Free plan of Cognition's desktop coding agent — the IDE that shipped as
    Windsurf
  limits: 'The $0 plan is "Light quota to code with agents", "Limited model availability",
    unlimited inline edits and unlimited Tab completions. Which models that quota
    reaches is published nowhere. "Access to OpenAI, Claude, and Gemini frontier models"
    is what the $20 Pro plan adds; the only mention of a small model on the whole
    page is a tip about making a quota last; and the one tier-tagged catalogue Cognition
    serves, docs.devin.ai/desktop/models, carries TEAMS_TIER_PRO and TEAMS_TIER_ENTERPRISE_SAAS
    and no free tier at all, pricing Claude Haiku 4.5 under Enterprise. The product
    was renamed on 2 June 2026 — "Windsurf is now Devin Desktop" — and windsurf.com,
    windsurf.com/pricing and docs.windsurf.com all 308 to devin.ai, where the word
    Windsurf no longer appears on the pricing page (read 2026-08-14)'
  models: []
  probe:
    type: page-keywords
    endpoint: https://devin.ai/pricing
    keywords:
    - light quota to code with agents
    - Limited model availability
    free_marker: ''
    dead_markers: []
    require_zero_price: false
  first_seen: '2026-07-19'
  last_verified: '2026-08-13'
  probe_failures: 0
  provisional: false
  rank: 50
- id: mimo-code
  name: MiMo Code
  category: agent-cli
  url: https://mimo.xiaomi.com/coder
  source_urls:
  - https://raw.githubusercontent.com/XiaomiMiMo/MiMo-Code/main/README.md
  - https://mimo.xiaomi.com/mimocode/start
  - https://github.com/XiaomiMiMo/MiMo-Code/blob/main/packages/opencode/src/util/free-api-sunset.ts
  card_required: false
  offering: Xiaomi's open-source (MIT) terminal coding agent; its built-in "MiMo Auto"
    channel used to run Xiaomi's MiMo models with no login, API key, or card
  limits: 'Anonymous MiMo Auto channel ended 2026-07-26 10:00 UTC — the client blocks
    it past that timestamp (FREE_API_SUNSET_AT) and prompts: "The free API service
    has ended"; a paid Token Plan or a third-party API key is required now. The repo
    README still advertises the free channel'
  models:
  - family: mimo-v2.5
    tier: strong
    released: ''
