entries:
- id: openrouter-free
  name: OpenRouter (free models)
  category: aggregator
  url: https://openrouter.ai
  source_urls:
  - https://openrouter.ai/docs/faq
  - https://openrouter.ai/docs/api_reference/limits
  - https://openrouter.ai/docs/cookbook/coding-agents/claude-code-integration
  card_required: false
  offering: One API key for a rotating set of :free model variants, open-weight and
    stealth models among them
  limits: OpenRouter's FAQ says its free models "have low rate limits" and "are usually
    not suitable for production use", and its limits page warns that a negative credit
    balance can produce errors "including for free models" and that a 429 can come
    from the upstream provider rather than the platform (read 2026-09-27). The docs
    define the daily counter as "Free-model requests recorded so far in the current
    UTC day". The higher daily ceiling is granted "starting one credit below the table’s
    threshold" to absorb rounding and top-up fees.
  quotas:
  - amount: 50.0
    unit: requests
    period: day
    scope: account
    source: https://openrouter.ai/docs/api_reference/limits
    quote: const FREE_MODEL_RATE_LIMIT_RPM=20;const FREE_MODEL_NO_CREDITS_RPD=50;const
      FREE_MODEL_HAS_CREDITS_RPD=1e3;const FREE_MODEL_CREDITS_THRESHOLD=10;
    read: constant
    constant: FREE_MODEL_NO_CREDITS_RPD
  - amount: 20.0
    unit: requests
    period: minute
    scope: account
    source: https://openrouter.ai/docs/api_reference/limits
    quote: const FREE_MODEL_RATE_LIMIT_RPM=20;const FREE_MODEL_NO_CREDITS_RPD=50;const
      FREE_MODEL_HAS_CREDITS_RPD=1e3;const FREE_MODEL_CREDITS_THRESHOLD=10;
    read: constant
    constant: FREE_MODEL_RATE_LIMIT_RPM
  - amount: 1000.0
    unit: requests
    period: day
    scope: account
    condition: after 10 credits purchased all-time
    condition_quote: The limit tier is selected by all-time credits purchased, independently
      of is_free_tier.
    source: https://openrouter.ai/docs/api_reference/limits
    quote: const FREE_MODEL_RATE_LIMIT_RPM=20;const FREE_MODEL_NO_CREDITS_RPD=50;const
      FREE_MODEL_HAS_CREDITS_RPD=1e3;const FREE_MODEL_CREDITS_THRESHOLD=10;
    read: constant
    constant: FREE_MODEL_HAS_CREDITS_RPD
  free_part: models
  models:
  - family: nemotron-3-ultra
    aa_model: nvidia-nemotron-3-ultra-550b-a55b
  - family: gemma-4-31b
    aa_model: gemma-4-31b
  - family: gemma-4-26b-a4b
    aa_model: gemma-4-26b-a4b
  - family: north-mini-code
    aa_model: north-mini-code
  - family: laguna-s-2.1
  - family: laguna-xs-2.1
  - family: nemotron-3.5-lightning
    aa_model: nemotron-3-5-lightning
  - family: inkling
    aa_model: inkling
  - family: inkling-small
    aa_model: inkling-small
  - family: dots-3-note
  - family: nemotron-3-nano-omni
    aa_model: nemotron-3-nano-omni-30b-a3b
  - family: nemotron-3.5-super-vl-120b-a12b
    aa_model: nemotron-3-5-super-vl
  api:
    base_url: https://openrouter.ai/api/v1
    key_url: https://openrouter.ai/settings/keys
    auth: api-key
    openai_compatible: true
    model_ids:
    - nvidia/nemotron-3-ultra-550b-a55b:free
    - nvidia/nemotron-3.5-lightning:free
    - nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
    - google/gemma-4-31b-it:free
    - google/gemma-4-26b-a4b-it:free
    - cohere/north-mini-code:free
    - poolside/laguna-s-2.1:free
    - poolside/laguna-xs-2.1:free
    - thinkingmachines/inkling:free
    - thinkingmachines/inkling-small:free
    - dots-studio/dots-3-note-preview:free
    - liquid/lfm-2.5-2.6b:free
    - openrouter/free
    - nvidia/nemotron-3.5-super-vl:free
    - xingchen-agi/xing4.0-29b-a4b:free
    - recursive/flint-v1.0:free
    model_bindings:
      nvidia/nemotron-3.5-super-vl:free:
        family: nemotron-3.5-super-vl-120b-a12b
        source: https://build.nvidia.com/nvidia/nemotron-3.5-super-vl-120b-a12b/modelcard
        quote: NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
    ignored_ids:
    - nvidia/nemotron-3.5-content-safety:free
    - google/lyria-3-pro-preview
    - google/lyria-3-clip-preview
    no_family_ids:
    - liquid/lfm-2.5-2.6b:free
    - openrouter/free
    - recursive/flint-v1.0:free
    anthropic_base_url: https://openrouter.ai/api
    codex:
      base_url: https://openrouter.ai/api/v1
      source: https://openrouter.ai/docs/cookbook/coding-agents/codex-cli
      quote: Configure Codex for OpenRouter
    note: Use IDs with the :free suffix; their input and output prices are zero. openrouter/free
      chooses a free model automatically. LiquidAI advises against agentic coding
      with lfm-2.5-2.6b. For Claude Code, set ANTHROPIC_BASE_URL=https://openrouter.ai/api,
      leave ANTHROPIC_API_KEY empty and use a :free ID as ANTHROPIC_MODEL.
  data_use:
    trains: opt-out
    quote: Wherever possible, OpenRouter works with providers to ensure that prompts
      will not be trained on, but there are exceptions. If you opt out of training
      in your account settings, OpenRouter will not route to providers that train.
    url: https://openrouter.ai/docs/guides/privacy/provider-logging
  border:
    left_out: []
    'on': '2026-09-26'
    source: https://openrouter.ai/terms
  probe:
    type: api-models
    endpoint: https://openrouter.ai/api/v1/models
    keywords: []
    free_marker: :free
    require_zero_price: true
    machinery_keywords: []
  first_seen: '2026-07-19'
  last_verified: '2026-10-26'
  probe_failures: 0
  provisional: false
  rank: 10
- id: google-ai-studio
  name: Google AI Studio (Gemini API)
  category: api-free-tier
  url: https://aistudio.google.com
  source_urls:
  - https://ai.google.dev/gemini-api/docs/pricing
  - https://ai.google.dev/gemini-api/docs/rate-limits
  - https://ai.google.dev/gemini-api/docs/changelog
  - https://ai.google.dev/gemma/docs/core/gemma_on_gemini_api
  - https://ai.google.dev/gemini-api/docs/models/gemini-3.7-flash
  - https://ai.google.dev/gemini-api/docs/models/gemini-3.5-flash
  card_required: false
  offering: Free tier on the Gemini API, priced model by model rather than as one
    account quota
  limits: Free eligibility is priced per model. The current Flash, Flash-Lite and
    Gemma rows have a free input/output column; Gemini 3.1 Pro Preview and Omni Flash
    do not. Access to the 2.5 models is restricted to projects that previously used
    them. Actual rate limits are visible after signing in to AI Studio. Free-tier
    prompts and responses may be used to improve Google products; paid usage has different
    data-use terms. Context caching is free on the Flash models and unavailable on
    the Flash-Lite ones.
  quotas:
  - unit: usage
    scope: project-model
    state: account-specific
    source: https://ai.google.dev/gemini-api/docs/rate-limits
    quote: View your active rate limits in AI Studio
    reviewed_on: '2026-10-27'
  free_part: models
  models:
  - family: gemini-3.8-flash
    tier: notable
    aa_model: gemini-3-8-flash
  - family: gemini-3.6-flash
    aa_model: gemini-3-6-flash
  - family: gemini-3.5-flash-lite
    aa_model: gemini-3-5-flash-lite
  - family: gemini-3.1-flash-lite
    aa_model: gemini-3-1-flash-lite-preview
  - family: gemini-3-flash
    aa_model: gemini-3-flash
  - family: gemma-4
  api:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    key_url: https://aistudio.google.com/apikey
    auth: api-key
    openai_compatible: true
    model_ids:
    - gemini-3.8-flash
    - gemini-3.6-flash
    - gemini-3.5-flash-lite
    - gemini-3.1-flash-lite
    - gemini-3-flash-preview
    - gemma-4-31b-it
    - gemma-4-26b-a4b-it
    - gemini-2.5-pro
    - gemini-2.5-flash
    - gemini-2.5-flash-lite
    model_bindings:
      gemini-2.5-pro:
        family: gemini-2.5-pro
        source: https://ai.google.dev/gemini-api/docs/pricing
        quote: gemini-2.5-pro
      gemini-2.5-flash:
        family: gemini-2.5-flash
        source: https://ai.google.dev/gemini-api/docs/pricing
        quote: gemini-2.5-flash
      gemini-2.5-flash-lite:
        family: gemini-2.5-flash-lite
        source: https://ai.google.dev/gemini-api/docs/pricing
        quote: gemini-2.5-flash-lite
    note: Pass the key as Bearer. The 2.5 IDs require projects that previously used
      those models; new projects should choose the current Flash or Gemma IDs.
  data_use:
    trains: 'yes'
    quote: When you use Unpaid Services, including, for example, Google AI Studio
      and the unpaid quota on Gemini API, Google uses the content you submit to the
      Services and any generated responses to provide, improve, and develop Google
      products and services and machine learning technologies
    url: https://ai.google.dev/gemini-api/terms
  border:
    served: [AD, AE, AG, AI, AL, AM, AO, AQ, AR, AS, AT, AU, AW, AX, AZ, BA, BB, BD,
      BE, BF, BG, BH, BI, BJ, BL, BM, BN, BO, BQ, BR, BS, BT, BW, BZ, CA, CC, CD,
      CF, CG, CH, CI, CK, CL, CM, CO, CR, CV, CW, CX, CY, CZ, DE, DJ, DK, DM, DO,
      DZ, EC, EE, EG, EH, ER, ES, ET, FI, FJ, FK, FM, FO, FR, GA, GB, GD, GE, GF,
      GG, GH, GI, GL, GM, GN, GQ, GR, GS, GT, GU, GW, GY, HM, HN, HR, HT, HU, ID,
      IE, IL, IM, IN, IO, IQ, IS, IT, JE, JM, JO, JP, KE, KG, KH, KI, KM, KN, KR,
      KW, KY, KZ, LA, LB, LC, LI, LK, LR, LS, LT, LU, LV, LY, MA, MC, MD, ME, MG,
      MH, MK, ML, MN, MP, MR, MS, MT, MU, MV, MW, MX, MY, MZ, NA, NC, NE, NF, NG,
      NI, NL, 'NO', NP, NR, NU, NZ, OM, PA, PE, PG, PH, PK, PL, PM, PN, PR, PS, PT,
      PW, PY, QA, RE, RO, RS, RW, SA, SB, SC, SD, SE, SG, SH, SI, SK, SL, SM, SN,
      SO, SR, SS, ST, SV, SZ, TC, TD, TG, TH, TJ, TK, TL, TM, TN, TO, TR, TT, TV,
      TW, TZ, UA, UG, UM, US, UY, UZ, VA, VC, VE, VG, VI, VN, VU, WF, WS, XK, YE,
      ZA, ZM, ZW]
    'on': '2026-09-26'
