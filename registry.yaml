  category: aggregator
  url: https://vercel.com/ai-gateway
  source_urls:
  - https://vercel.com/docs/ai-gateway/pricing
  - https://vercel.com/docs/ai-gateway/openai-compat
  card_required: false
  offering: One OpenAI-compatible endpoint for 300+ models, with $5 of gateway credits
    included every month and two models that never touch the credit
  limits: $5/month credit at provider list rates, renewed monthly; lower per-model
    rate limits, no BYOK. Exactly two of the 327 catalogued models are priced 0 in
    and 0 out — Laguna S 2.1 Free for coding and z.ai's GLM-4.6V-Flash for vision
    (128k context, images and PDFs, tool use) — and neither draws the credit down.
    Mind the suffix on the first one, since the same catalog carries poolside/laguna-s-2.1
    without it at $0.10/$0.20 per 1M tokens (read 2026-08-14). Buying credits ends
    the monthly free credit
  models:
  - family: laguna-s-2.1
    tier: strong
    released: 2026-07
  - family: glm-4.6v-flash
    tier: strong
    released: 2026-01
  api:
    base_url: https://ai-gateway.vercel.sh/v1
    key_url: https://vercel.com/dashboard/ai-gateway/api-keys
    auth: api-key
    openai_compatible: true
    model_ids:
    - poolside/laguna-s-2.1-free
    - zai/glm-4.6v-flash
    note: both ids cost nothing; any other Free-Tier-eligible model spends the $5
      monthly credit. glm-4.6v-flash is zero here because z.ai prices it at zero
      itself — its own table reads Free on all four columns while every neighbour
      reads "Limited-time Free" — so this is a vendor policy rather than a gateway
      promo lane. inclusionai/ling-3.0-flash-free left the catalog in 2026-08 and
      the ling-3.0-tiny-free standing where it was publishes an empty pricing
      object, so nothing there says it is free
  probe:
    type: api-models
    endpoint: https://ai-gateway.vercel.sh/v1/models
    keywords: []
    free_marker: ''
    dead_markers: []
    require_zero_price: true
  first_seen: '2026-08-03'
  last_verified: '2026-08-13'
  probe_failures: 0
  provisional: true
  rank: 100
