entries:
- id: openrouter-free
  name: OpenRouter (free models)
  category: aggregator
  url: https://openrouter.ai
  source_urls:
  - https://openrouter.ai/docs/faq
  - https://openrouter.ai/docs/api_reference/limits
  card_required: false
  offering: One API key for rotating :free variants of frontier models
  limits: 20 requests per minute on any :free id, 50 requests per day, and 1,000 per
    day once the account has purchased at least 10 credits all-time. Those four figures
    are in the page only as JS constants — FREE_MODEL_RATE_LIMIT_RPM, FREE_MODEL_NO_CREDITS_RPD,
    FREE_MODEL_HAS_CREDITS_RPD and FREE_MODEL_CREDITS_THRESHOLD — and the table that
    should show them serves empty cells to anything reading the HTML. OpenRouter describes
    :free as "always provided for free and has low rate limits", warns that a negative
    credit balance can produce errors "including for free models", and notes a 429
    may come from the upstream provider rather than the platform (read 2026-08-14)
  models:
  - family: nemotron-3-ultra
    tier: frontier
    released: 2026-03
  - family: gemma-4
    tier: strong
    released: 2026-04
  api:
    base_url: https://openrouter.ai/api/v1
    key_url: https://openrouter.ai/settings/keys
    auth: api-key
    openai_compatible: true
    model_ids:
    - openrouter/free
    - nvidia/nemotron-3-ultra-550b-a55b:free
    - nvidia/nemotron-3-super-120b-a12b:free
    - nvidia/nemotron-3.5-lightning:free
    - nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
    - nvidia/nemotron-3.5-content-safety:free
    - google/gemma-4-31b-it:free
    - google/gemma-4-26b-a4b-it:free
    - cohere/north-mini-code:free
    - poolside/laguna-s-2.1:free
    - poolside/laguna-xs-2.1:free
    - z-ai/glm-5.2:free
    - minimax/minimax-m3:free
    - minimax/minimax-m2.7:free
    - thinkingmachines/inkling:free
    - thinkingmachines/inkling-small:free
    - dots-studio/dots-3-note-preview:free
    - inclusionai/ling-3.0-flash-fin:free
    - liquid/lfm-2.5-2.6b:free
    note: 'pick models with the :free suffix; all eighteen ids carrying it are priced
      0/0 and the other 354 rows are metered (read 2026-08-28). openai/gpt-oss-20b:free
      left that set between the 2026-08-20 and 2026-08-24 probes, leaving its metered
      twin behind and taking gpt-oss out of the column. Five are not coding models:
      openrouter/free is the Free Models Router, priced 0/0, picking whichever free
      model is up and the id that survives this lane rotating; nemotron-3.5-content-safety
      is a guardrail, ling-3.0-flash-fin finance-tuned, nemotron-3-nano-omni a perception
      sub-agent, and LiquidAI warns lfm-2.5-2.6b off agentic coding'
  probe:
    type: api-models
    endpoint: https://openrouter.ai/api/v1/models
    keywords: []
    free_marker: :free
    dead_markers: []
    require_zero_price: true
  first_seen: '2026-07-19'
  last_verified: '2026-08-31'
  probe_failures: 0
  provisional: false
  rank: 10
- id: google-ai-studio
  name: Google AI Studio (Gemini API)
  category: api-free-tier
  url: https://aistudio.google.com
  source_urls:
  - https://ai.google.dev/gemini-api/docs/pricing
  - https://ai.google.dev/gemini-api/docs/rate-limits
  card_required: false
  offering: Free tier on the Gemini API, priced model by model rather than as one
    account quota
  limits: 'Google prices the free tier per model: its pricing page reads "Free of
    charge" for input, output and context caching on Gemini 3.7 Flash, 3.6 Flash,
    3.5 Flash, 3.5 Flash-Lite, 3.1 Flash-Lite, 3 Flash Preview, 2.5 Pro and 2.5 Flash,
    and "Not available" in the same column for Gemini 3.1 Pro Preview, Omni Flash
    Preview and the Live previews. What the free tier costs instead is one row lower
    in each table: "Used to improve our products" is Yes on the free tier and No on
    the paid one. The per-model RPM/TPM/RPD figures are no longer published anywhere
    a probe can read — as of its own "Last updated 2026-08-13" the rate-limits page
    keeps only the usage-tier table ("Free — Active project or free trial") and sends
    you to aistudio.google.com/rate-limit, which needs a sign-in (read 2026-08-14)'
  models:
  - family: gemini-3.7-flash
    tier: frontier
    released: ''
  - family: gemini-3.5-flash-lite
    tier: strong
    released: ''
  - family: gemini-2.5-pro
    tier: frontier
    released: ''
  api:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    key_url: https://aistudio.google.com/apikey
    auth: api-key
    openai_compatible: true
    model_ids: []
    note: pass the key as Bearer
  probe:
    type: page-keywords
    endpoint: https://ai.google.dev/gemini-api/docs/pricing
    keywords:
    - gemini-2.5-flash
    - free of charge
    free_marker: ''
    dead_markers: []
    require_zero_price: false
  first_seen: '2026-07-19'
  last_verified: '2026-08-31'
  probe_failures: 0
  provisional: false
  rank: 10
- id: groq-free
  name: Groq
  category: api-free-tier
  url: https://groq.com
  source_urls:
  - https://console.groq.com/docs/rate-limits
  card_required: false
  offering: Fast inference against a free plan Groq publishes as a per-model rate
    table
  limits: 'Groq states the free plan as a table rather than one quota, in RPM / RPD
    / TPM / TPD: 30 / 14.4K / 6K / 500K on llama-3.1-8b-instant, 30 / 1K / 12K / 100K
    on llama-3.3-70b-versatile, 30 / 1K / 8K / 200K on openai/gpt-oss-120b, gpt-oss-20b
    and qwen/qwen3.6-27b, 30 / 250 / 70K on groq/compound and compound-mini, 20 /
    2K on the two whisper models (read 2026-08-14). Those thirteen rows are the whole
    free plan — no llama-4 among them, though the page carries the id in the API schema
    it embeds. Groq calls the table "a high level summary and there may be exceptions",
    and points at the limits page in an account for the exact figures'
  models:
  - family: llama-3.3
    tier: strong
    released: 2024-12
  - family: gpt-oss
    tier: strong
    released: 2025-08
  - family: qwen3.6
    tier: strong
    released: ''
  api:
    base_url: https://api.groq.com/openai/v1
    key_url: https://console.groq.com/keys
    auth: api-key
    openai_compatible: true
    model_ids:
    - llama-3.3-70b-versatile
    - llama-3.1-8b-instant
    - openai/gpt-oss-120b
    - openai/gpt-oss-20b
    - qwen/qwen3.6-27b
    note: the ids Groq's own Free Plan Limits table names
  probe:
    type: page-keywords
    endpoint: https://console.groq.com/docs/rate-limits
    keywords:
    - free plan limits
    - llama-3.3-70b-versatile
    free_marker: ''
    dead_markers: []
    require_zero_price: false
  first_seen: '2026-07-19'
  last_verified: '2026-08-31'
  probe_failures: 0
  provisional: false
  rank: 20
- id: cerebras-free
  name: Cerebras Inference
  category: trial
  url: https://www.cerebras.ai
  source_urls:
  - https://inference-docs.cerebras.ai/support/rate-limits
  - https://www.cerebras.ai/pricing
  - https://inference-docs.cerebras.ai/models
  card_required: true
  offering: Very fast inference; $5 in trial credits that expire in 30 days, card
    required before the API answers at all
  limits: 'Cerebras'' own docs: "New accounts receive $5 in free credits after adding
    a verified payment method", credits "expire 30 days after they''re granted", and
    "If you skip adding a payment method at sign-up, Playground and API access remain
    inactive until you do". Asked "Is there a permanently free tier?" the same page
    answers "No". Free Trial rate limits are per model — 5 RPM / 30K TPM / 1M TPH
    / 1M TPD on each of the two the public catalog now lists, GLM 4.7 having been
    deprecated on 2026-08-17 exactly as that catalog announced; the TPM figure is
    the uncached bucket, and cached tokens run against a separate total limit of 3×
    it (read 2026-08-19). The marketing pricing page still promises the credits "after
    making an account" and mentions no card — that was the old API tier, which accounts
    opened before the change kept until 2026-08-17 and which is now gone'
  models:
  - family: gpt-oss
    tier: strong
    released: 2025-08
  - family: gemma-4
    tier: strong
    released: 2026-04
  api:
    base_url: https://api.cerebras.ai/v1
    key_url: https://cloud.cerebras.ai
    auth: api-key
    openai_compatible: true
    model_ids:
    - gpt-oss-120b
    - gemma-4-31b
    note: 'the Free Trial tier reaches every model in the public catalog, which is
      these two: "Every model on the public Model Catalog is available on the Free
      Trial tier, subject to the per-model Free Trial rate limits"'
  probe:
    type: page-keywords
    endpoint: https://inference-docs.cerebras.ai/support/rate-limits
    keywords:
    - after adding a verified payment method
    - credits expire 30 days after
    free_marker: ''
    dead_markers: []
    require_zero_price: false
  first_seen: '2026-07-19'
  last_verified: '2026-08-31'
  probe_failures: 0
  provisional: false
  rank: 35
- id: mistral-free
  name: Mistral La Plateforme
  category: api-free-tier
  url: https://mistral.ai
  source_urls:
  - https://docs.mistral.ai/admin/user-management-finops/tier
  card_required: false
  offering: Free mode on La Plateforme — API keys plus an included monthly usage allowance
  limits: 'Mistral states the offer in one sentence and publishes no figure for it:
    "Free mode lets you create API keys and use included monthly usage within the
    limits shown on the Limits page". The limits it describes are per model — tokens
    per minute, requests per second, audio seconds per month — and are shown only
    inside an account, and paid use is documented as an extension of the same plan
    rather than a second one ("It is not a separate plan for the API"). The page names
    no model, which is why the Free models column here is empty (read 2026-08-14)'
  models: []
  api:
    base_url: https://api.mistral.ai/v1
    key_url: https://console.mistral.ai/api-keys
    auth: api-key
    openai_compatible: true
    model_ids: []
    note: Experiment tier needs account activation
  probe:
    type: page-keywords
    endpoint: https://docs.mistral.ai/admin/user-management-finops/tier
    keywords:
    - free mode
    - included monthly usage within the limits shown on the Limits page
    free_marker: ''
    dead_markers: []
    require_zero_price: false
  first_seen: '2026-07-19'
  last_verified: '2026-08-31'
  probe_failures: 0
  provisional: false
  rank: 94
- id: github-models
  name: GitHub Models
  category: api-free-tier
  url: https://github.com/marketplace/models
  source_urls:
  - https://docs.github.com/en/github-models
  - https://github.blog/changelog/2026-07-01-github-models-is-being-fully-retired-on-july-30-2026/
  card_required: false
  offering: Free playground+API for catalog models with GitHub account
  limits: Per-model rate limits, free tier; closed to new customers on 2026-06-16
    and fully retired (playground, catalog, inference API, BYOK) on 2026-07-30
  models:
  - family: gpt-4.1
    tier: strong
    released: 2025-04
  api:
    base_url: https://models.github.ai/inference
    key_url: https://github.com/settings/personal-access-tokens
    auth: api-key
    openai_compatible: true
    model_ids: []
    note: GitHub PAT with models:read scope; model ids namespaced (openai/...)
  probe:
    type: api-models
    endpoint: https://models.github.ai/catalog/models
    keywords: []
    free_marker: ''
    dead_markers: []
    require_zero_price: false
  first_seen: '2026-07-19'
  last_verified: '2026-07-30'
  retired_on: '2026-06-16'
  probe_failures: 1
  provisional: false
  rank: 80
- id: cloudflare-workers-ai
  name: Cloudflare Workers AI
  category: api-free-tier
  url: https://workers.cloudflare.com
  source_urls:
  - https://developers.cloudflare.com/workers-ai/platform/pricing/
  - https://developers.cloudflare.com/workers-ai/platform/limits/
  card_required: false
  offering: 10k neurons/day free
  limits: 'Cloudflare''s free allocation "allows anyone to use a total of 10,000 Neurons
    per day at no charge", which at its own $0.011 per 1,000 Neurons is about $0.11
    of inference a day. "All limits reset daily at 00:00 UTC", and past the cap "further
    operations will fail with an error" rather than being billed. Rate limits are
    per task type — 300 requests per minute for Text Generation. Three catalog models
    sit outside the free lane whatever the neuron count: the same page notes that
    @cf/moonshotai/kimi-k2.6, @cf/moonshotai/kimi-k2.7-code and @cf/zai-org/glm-5.2
    "require a paid billing method" (read 2026-08-14)'
  models:
  - family: llama-4
    tier: strong
    released: 2025-04
  api:
    base_url: https://api.cloudflare.com/client/v4/accounts/{account_id}/ai/v1
    key_url: https://dash.cloudflare.com/profile/api-tokens
    auth: api-key
    openai_compatible: true
    model_ids: []
    note: substitute {account_id} with your Cloudflare account ID
  probe:
    type: page-keywords
    endpoint: https://developers.cloudflare.com/workers-ai/platform/pricing/
    keywords:
    - 10,000 neurons per day
    - free allocation
    free_marker: ''
    dead_markers: []
    require_zero_price: false
  first_seen: '2026-07-19'
  last_verified: '2026-08-31'
  probe_failures: 0
  provisional: false
  rank: 40
- id: ollama-cloud
  name: Ollama Cloud
  category: api-free-tier
  url: https://ollama.com/cloud
  source_urls:
  - https://ollama.com/cloud
  card_required: false
  offering: Cloud-hosted open models on a $0 plan that grants starter usage credits
    for a starter subset of the catalog
  limits: 'The $0 plan was rewritten between the 2026-08-27 and 2026-08-31 runs, and
    it is now a wallet rather than a lane: it reads "Starter usage credits included"
    and "Includes access to starter models", with "Add credits to unlock all models"
    under them. Neither figure is published — the page names no credit amount and
    no starter model list, and the cloud-model list it links (ollama.com/search?c=cloud)
    marks none of them starter. Every cloud model now carries a per-million-token
    price on that same page: gpt-oss:20b $0.07 in / $0.30 out, minimax-m3 $0.60 /
    $2.40, kimi-k3 $3.00 / $15.00. Free gets 1 concurrent request against Pro''s 3,
    and the included usage "resets monthly from the date you signed up" and does not
    roll over. Gone with the rewrite: the $0 "Access cloud models" line this row was
    probed on, and the per-model usage level 1-4 that stood in for a free-model list.
    Read 2026-09-02, with the starter set mapped by calling it, since nothing publishes
    it: from one key on the $0 plan, gpt-oss:120b answered in 1-11s, gemma4:31b in
    1-5s and nemotron-3-ultra in 50-279s, all on 2026-09-02, while minimax-m3 answered
    402 Payment Required on both 2026-08-31 and 2026-09-02 after serving all month.
    The 402 is the edge of the starter set rather than a spent balance, and that edge
    is not the price: nemotron-3-ultra is inside it at $0.10/$3.00 while minimax-m3
    is outside it at $0.60/$2.40'
  models: []
  api:
    base_url: https://ollama.com/v1
    key_url: https://ollama.com/settings/keys
    auth: api-key
    openai_compatible: true
    model_ids:
    - gpt-oss:120b
    - gemma4:31b
    - nemotron-3-ultra
    note: the three ids left are the ones a key on the $0 plan actually answered on
      2026-09-02, in that order of speed; minimax-m3 was dropped from this list because
      the same key gets 402 Payment Required for it. Which models the starter credits
      reach is published nowhere, so this list is measured rather than read, and /v1/models
      still lists the whole catalog, starter and metered alike
  probe:
    type: page-keywords
    endpoint: https://ollama.com/cloud
    keywords:
    - Starter usage credits included
    - Includes access to starter models
    free_marker: ''
    dead_markers: []
    require_zero_price: false
  first_seen: '2026-07-19'
  last_verified: '2026-08-31'
  probe_failures: 0
  provisional: false
  rank: 92
- id: opencode
  name: opencode
  category: agent-cli
  url: https://opencode.ai
  source_urls:
  - https://opencode.ai/docs/zen/
  - https://opencode.ai/docs/
  card_required: false
  offering: Open-source TUI/desktop coding agent with six zero-priced models included
    via the opencode Zen gateway (Big Pickle, MiMo-V2.5, Ling 3.0 Flash Fin, Nemotron
    3 Ultra, Nemotron 3.5 Lightning, Muse Spark 1.2 Contributor); any provider via
    BYOK too
  limits: 'Zen prices six ids at zero — big-pickle, mimo-v2.5-free, ling-3.0-flash-fin-free,
    nemotron-3-ultra-free, nemotron-3.5-lightning-free and muse-spark-1.2-contributor-free
    — and calls every one of them "available on OpenCode for a limited time" while
    the team collects feedback. That feedback is the price: the privacy section exempts
    each free model from Zen''s zero-retention policy ("during its free period, collected
    data may be used to improve the model"), the two NVIDIA-backed ones are "trial
    use only — do not submit personal or confidential data", and the newest buys its
    zero with training rights — "heavily discounted token pricing in exchange for
    permission to use your prompts and completions to train future Meta models", on
    a row the pricing table still prints as Free in and Free out. Mind the suffix:
    plain muse-spark-1.2 is the paid row at $1.25/$4.25 per 1M tokens. Two ids left
    the free table by the 2026-08-20 read — deepseek-v4-flash is now metered at $0.22/$0.66
    off-peak and $0.44/$1.32 peak, and laguna-s-2.1 is off the page entirely — though
    both -free ids are still in the catalog. Zen documents signup as "sign in to OpenCode
    Zen, add your billing details, and copy your API key", but the free ids answer
    without payment details on file — tested by hand rather than read, 2026-08-15.
    Billing is what the metered ids want, and once it is on, auto-reload tops the
    balance up by $20 whenever it falls below $5 (read 2026-08-20). The lane still
    counts six, but not the same six: on 2026-08-30 hy3-free was gone from the page
    altogether — no row in the pricing table, no id in the endpoints table, and not
    listed under Deprecated models either — while ling-3.0-flash-fin-free had arrived
    priced Free in, Free out'
  models:
  - family: big-pickle
    tier: strong
    released: ''
  - family: mimo-v2.5
    tier: strong
    released: ''
  - family: ling-3.0-flash-fin
    tier: strong
    released: ''
  - family: nemotron-3-ultra
    tier: frontier
    released: ''
  - family: nemotron-3.5-lightning
    tier: strong
    released: ''
  - family: muse-spark-1.2
    tier: strong
    released: ''
  api:
    base_url: https://opencode.ai/zen/v1
    key_url: https://opencode.ai/auth
    auth: api-key
    openai_compatible: true
    model_ids:
    - big-pickle
    - mimo-v2.5-free
    - ling-3.0-flash-fin-free
    - nemotron-3-ultra-free
    - nemotron-3.5-lightning-free
    - muse-spark-1.2-contributor-free
    note: these are the six ids Zen prices at zero; inside an opencode config the
      same id is written opencode/<model-id>. Every other id on the same base URL
      is metered. The catalog also still returns deepseek-v4-flash-free and laguna-s-2.1-free,
      which the pricing table stopped listing at zero — treat them as metered until
      it says otherwise
  probe:
    type: page-keywords
    endpoint: https://opencode.ai/docs/zen/
    keywords:
    - big pickle
    - mimo-v2.5-free
    free_marker: ''
    dead_markers: []
    require_zero_price: false
  first_seen: '2026-07-19'
  last_verified: '2026-08-31'
  probe_failures: 0
  provisional: false
  rank: 10
- id: kilo-code
  name: Kilo Code
  category: agent-cli
  url: https://kilo.ai
  source_urls:
  - https://kilo.ai/pricing
  - https://api.kilo.ai/api/gateway/models
  - https://kilocode.ai
  card_required: false
  offering: Open-source VS Code / JetBrains / CLI agent; its $0 plan routes "Auto
    Free" to the zero-priced models the Kilo Gateway carries, and the same gateway
    answers any OpenAI client directly, with BYOK and local models (Ollama, LM Studio)
    alongside
  limits: '$0/mo, no hosted credit required — the free lane is a rotating set of the
    ids the gateway itself marks isFree, 19 of them on 2026-09-02 against 13 on 2026-08-14,
    with Nemotron 3 Ultra and MiniMax M3 among them; everything else runs on pay-as-you-go
    credits or a Kilo Pass subscription. The lane costs something other than money:
    all 19 carry mayTrainOnYourPrompts, while 341 of the 346 metered ids do not —
    the five exceptions are stealth/* models struck under the same bargain. Two metered
    rows are priced 0 and marked isFree false, Google''s Lyria 3 music previews, so
    a price of zero is not the lane here either. The rotation is quick: Ling 3.0 Flash
    left in 2026-08, ling-3.0-tiny:free stood in for three days and was gone by 2026-08-14,
    liquid/lfm-2.5-2.6b:free arrived instead, and by 2026-09-02 tencent/hy3:free had
    been demoted to the metered tencent/hy3 while MiniMax M3 and M2.7, Ling 3.0 Flash
    Fin, Dots3-Note, LongCat 2.0 and both Inkling sizes had arrived'
  models:
  - family: nemotron-3-ultra
    tier: frontier
    released: 2026-03
  - family: nemotron-3-super
    tier: strong
    released: 2026-03
  - family: north-mini-code
    tier: strong
    released: 2026-06
  - family: step-3.7-flash
    tier: strong
    released: 2026-06
  - family: laguna-s-2.1
    tier: strong
    released: 2026-07
  - family: laguna-xs-2.1
    tier: strong
    released: 2026-07
  api:
    base_url: https://api.kilo.ai/api/gateway
    key_url: https://app.kilo.ai/profile
    auth: api-key
    openai_compatible: true
    model_ids:
    - kilo-auto/free
    - openrouter/free
    - nvidia/nemotron-3-ultra-550b-a55b:free
    - nvidia/nemotron-3-super-120b-a12b:free
    - nvidia/nemotron-3.5-lightning:free
    - nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
    - nvidia/nemotron-3.5-content-safety:free
    - cohere/north-mini-code:free
    - stepfun/step-3.7-flash:free
    - poolside/laguna-s-2.1:free
    - poolside/laguna-xs-2.1:free
    - liquid/lfm-2.5-2.6b:free
    - minimax/minimax-m3:free
    - minimax/minimax-m2.7:free
    - inclusionai/ling-3.0-flash-fin:free
    - dots-studio/dots-3-note-preview:free
    - thinkingmachines/inkling:free
    - thinkingmachines/inkling-small:free
    - meituan/longcat-2.0-free
    note: every id listed is one the catalog marks isFree — the same catalog meters
      346 more. kilo-auto/free and openrouter/free are routers and nemotron-3.5-content-safety
      is a guardrail classifier, so none of the three is a coding model. These ids
      come and go faster than the offer does, which is why they stay here and out
      of the Models column
  probe:
    type: api-models
    endpoint: https://api.kilo.ai/api/gateway/models
    keywords: []
    free_marker: :free
    dead_markers: []
    require_zero_price: true
  first_seen: '2026-07-19'
  last_verified: '2026-08-31'
