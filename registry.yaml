- id: freebuff
  name: Freebuff
  category: agent-cli
  url: https://freebuff.com
  source_urls:
  - https://freebuff.com/cli
  - https://freebuff.com/terms-of-service
  card_required: false
  offering: Ad-funded coding agent in five surfaces — CLI, desktop, browser app builder,
    cloud sandbox on any GitHub repo, and chat — with no account, no API key and no
    card; GLM 5.3 Flash by default, with GPT-5.6 Luna, DeepSeek V4 Flash and MiMo
    2.5 in the picker
  limits: 'How it can be free is answered by the vendor in five words — "Freebuff
    is supported by text ads" — and the CLI asks for nothing to prove it: "npm install
    -g freebuff", then "No API key and no credit card. It just runs." What it costs
    instead is geography and sessions. Full mode is restricted to 25 named countries
    (US, Canada, UK, Australia, New Zealand, Norway, Sweden, Netherlands, Denmark,
    Germany, France, Italy, Spain, Portugal, Finland, Belgium, Luxembourg, Liechtenstein,
    Switzerland, Austria, Singapore, Malta, Israel, Ireland, Iceland); "if you are
    outside those countries or using a VPN, Freebuff still works in limited mode",
    and limited mode is MiMo 2.5 alone. The quota is counted in sessions and no free
    figure is published: the Terms sell paid plans as adding "session capacity on
    top of the free service" and say each plan carries "daily, rolling five-day, and
    monthly session limits, per-model limits" without naming the free ones, while
    "referrals and bounties earn extra sessions on top". Solar Pro 4 sits in the picker
    as a "limited-time trial" and is left out of the models column for that reason,
    as is the Gemini 3.1 Flash Lite that runs file-finding and research behind the
    scenes. On data the FAQ is narrow and specific: "we do not collect your traces
    or files unless the model provider does. Currently, this applies only to DeepSeek
    models", and the picker marks DeepSeek V4 Flash "may use data for AI training".
    Read 2026-09-02'
