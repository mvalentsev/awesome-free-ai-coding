# Generation bumps a human has already looked at and rejected.
#
# The scout proposes supersede marks but never writes them (see scout.py), so
# nothing in registry.yaml records a decision NOT to bump a family — and the
# same suggestion comes back in every PR. This file is that memory: a triple
# listed here is reported as "already dismissed" instead of being proposed
# again. Delete a line to let the scout raise the question once more.
#
# It is not a blocklist for the family: only this exact (entry, family, target)
# is silenced, so a genuinely newer free generation still gets proposed.

dismissed:
  - entry: zai-glm
    family: glm-4.7-flash
    superseded_by: glm-5.2
    dismissed_on: 2026-08-04
    reason: >-
      GLM-5.x is z.ai's paid flagship — the entry's own limits say so. Applying
      this bump emptied the README's only free z.ai model and dropped the entry
      from the generated configs (PR #5, closed). The scout proposing it sees a
      list of family names, not the free tier they belong to.

  # The same mistake, newly reachable: `glm-5` became a family name in this list
  # on 2026-08-14 when AIHubMix was added, because AIHubMix subsidises
  # coding-glm-5*-free and genuinely serves that generation for nothing. It is
  # the only place here that does. On z.ai and Vercel the GLM-5.x flagships are
  # metered and the free lane is the Flash line. Each of these three would
  # replace a verified free family with one nobody has verified as free on that
  # vendor. Three more lines stood here and went the same way, the family leaving
  # the row and taking its dismissal with it: cerebras-free glm-4.7 → glm-5,
  # until Cerebras deprecated GLM 4.7 on 2026-08-17; vercel-ai-gateway
  # glm-4.6v-flash → glm-5, until that model left Vercel's catalog by
  # 2026-08-20; and routeway llama-3.3 → llama-4, dismissed on 2026-08-14 after
  # a check against Routeway's own catalog and removed on 2026-08-30, when the
  # last Llama left that gateway's free lane and the family left the row.
  - entry: zai-glm
    family: glm-4.5-flash
    superseded_by: glm-5
    dismissed_on: 2026-08-14
    reason: >-
      glm-5 is free on AIHubMix, which pays for it, and metered on z.ai.
  - entry: zai-glm
    family: glm-4.6v-flash
    superseded_by: glm-5
    dismissed_on: 2026-08-14
    reason: >-
      glm-5 is free on AIHubMix, which pays for it, and metered on z.ai.
  - entry: zai-glm
    family: glm-4.7-flash
    superseded_by: glm-5
    dismissed_on: 2026-08-14
    reason: >-
      The 2026-08-04 dismissal with the same reasoning, retargeted: the scout
      now names the family glm-5 rather than glm-5.2.

  # The same error the glm-5 block above describes, arriving by the last route a
  # vendor leaves open: a page that contradicts itself. Its companion — routeway
  # llama-3.3 → llama-4, where a priced catalog carried the newer generation
  # outside the free lane — stood here from 2026-08-14 until 2026-08-30, when
  # Routeway's free lane dropped to three ids and no Llama was among them.
  - entry: kiro
    family: deepseek-v3.2
    superseded_by: deepseek-v4-flash
    dismissed_on: 2026-08-20
    reason: >-
      Applied once, in PR #3, and wrong from the start: kiro.dev/pricing names
      neither DeepSeek V4 nor any 4.x DeepSeek, free or paid. What it does name,
      in the footnote under its Free Tier column, is "open weight models such as
      Qwen3 Coder Next, DeepSeek 3.2, and MiniMax M2.1", and kiro.dev/docs/models
      ticks the same two in its Free column. The mark pointed at a generation
      this vendor does not carry, and its only effect was to hide a free model
      from the row.
  - entry: kiro
    family: minimax-2.1
    superseded_by: minimax-3
    dismissed_on: 2026-08-20
    reason: >-
      The same mark on the same row for the same reason. MiniMax M3 is not on
      kiro.dev/pricing at all; M2.5 is, on the paid side, and M2.1 is what the
      free footnote grants.
  - entry: kiro
    family: claude-sonnet-4.5
    superseded_by: claude-sonnet-4.6
    dismissed_on: 2026-08-14
    reason: >-
      kiro.dev/docs/models prices every model against an explicit Free column:
      Sonnet 4.5 is ticked, Sonnet 4.6 is blank and sits with the Opus models
      the same page sells to paid plans. The pricing page the probe reads says
      both — its plan card and its footnote say the free tier gets Sonnet 4.5,
      its FAQ prose says Sonnet 4.6 — so this bump will be proposed again from
      that page every run, which is what this file is for.

  # Two of the six bumps the 2026-08-14 rehearsal on b4e0b3b offered, each
  # checked against the vendor rather than against the proposal. A third,
  # vercel-ai-gateway glm-4.6v-flash → glm-4.7, stood here until the model it
  # protected left Vercel's catalog by 2026-08-20. The other three were left
  # standing because nobody has read their pages today:
  # zai-glm glm-4.5-flash → glm-4.6v-flash and glm-4.6v-flash → glm-4.7, both
  # inside z.ai's own Flash line, and upstage solar-mini → solar-pro-3, where
  # the row already lists both families.
  - entry: google-jules
    family: gemini-2.5
    superseded_by: gemini-3.1-pro
    dismissed_on: 2026-08-14
    reason: >-
      Gemini 3 Pro is what the paid plans buy. jules.google/docs/usage-limits
      sets Model Access per plan: "Gemini 2.5 Pro" on the free Jules row,
      "Higher access to the latest model (starting with Gemini 3 Pro)" on
      Jules in Pro and "Priority access" on Ultra. The free row is pinned to
      2.5 deliberately, and gemini-3.1-pro is not a name that page uses at all.
  - entry: groq-free
    family: llama-3.3
    superseded_by: llama-4
    dismissed_on: 2026-08-14
    reason: >-
      The bump 9c92a9b removed, arriving again from the same bytes that caused
      it: console.groq.com/docs/rate-limits carries llama-4 only inside the
      OpenAPI schema it embeds, while the Free Plan Limits table it renders has
      thirteen rows and no Llama 4 among them. Expect this one every run — the
      id is in the page and the offer is not.

  # Both bumps PR #12 reported, each read off the vendor's own free/paid column
  # on 2026-08-28. They fail the same way from opposite directions: Google
  # prints the newer generation as not free, and SambaNova prints it as free
  # twice over, in a lane the older one is already in.
  - entry: google-ai-studio
    family: gemini-2.5-pro
    superseded_by: gemini-3.1-pro
    dismissed_on: 2026-08-28
    reason: >-
      ai.google.dev/gemini-api/docs/pricing gives every model a Free Tier
      column. On Gemini 3.1 Pro Preview it reads "Not available" for input,
      output and context caching, beside $2.00 and $12.00 per 1M tokens on the
      paid tier; on Gemini 2.5 Pro the same column reads "Free of charge" for
      input and output. The bump would swap the row's only free Pro model for
      the one Google sells — the google-jules dismissal above, on Google's
      other free lane, for the same reason.
  - entry: sambanova-cloud
    family: deepseek
    superseded_by: deepseek-v3.2
    dismissed_on: 2026-08-28
    reason: >-
      docs.sambanova.ai/docs/en/models/rate-limits carries two Free Tier
      tables and DeepSeek is in both — DeepSeek-V3.1 under Production models,
      DeepSeek-V3.2 under Preview, each at 20 RPM / 20 RPD / 200,000 TPD. The
      unversioned family covers both, which is what the entry's limits already
      say ("DeepSeek V3.1/V3.2"). Applying the mark would hide the only
      DeepSeek in the row and pin what it names to the Preview lane the same
      page says "may be removed at short notice".
