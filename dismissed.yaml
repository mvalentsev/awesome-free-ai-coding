# Generation bumps a human has already looked at and rejected.
#
# The scout proposes supersede marks but never writes them (see scout.py), so
# nothing in registry.yaml records a decision NOT to bump a family — and the
# same suggestion comes back in every PR. This file is that memory: a triple
# listed here is reported as "already dismissed" instead of being proposed
# again. Delete a line to let the scout raise the question once more.
#
# It is not a blocklist for the family: only this exact (entry, family, target)
# is silenced, so a genuinely newer free generation still gets proposed.

dismissed:
  - entry: zai-glm
    family: glm-4.7-flash
    superseded_by: glm-5.2
    dismissed_on: 2026-08-04
    reason: >-
      GLM-5.x is z.ai's paid flagship — the entry's own limits say so. Applying
      this bump emptied the README's only free z.ai model and dropped the entry
      from the generated configs (PR #5, closed). The scout proposing it sees a
      list of family names, not the free tier they belong to.

  # The same mistake, newly reachable: `glm-5` became a family name in this list
  # on 2026-08-14 when AIHubMix was added, because AIHubMix subsidises
  # coding-glm-5*-free and genuinely serves that generation for nothing. It is
  # the only place here that does. On z.ai, Vercel and Cerebras the GLM-5.x
  # flagships are metered and the free lane is the Flash line — Cerebras' own
  # Free Trial table listed gpt-oss-120b, zai-glm-4.7 and gemma-4-31b on
  # 2026-08-14, with no glm-5 row at all. Each of these five would replace a
  # verified free family with one nobody has verified as free on that vendor.
  # Left deliberately un-dismissed from the same run: routeway llama-3.3 →
  # llama-4, which nobody here had checked against Routeway's catalog. Checked
  # on 2026-08-14 and dismissed at the bottom of this file.
  - entry: zai-glm
    family: glm-4.5-flash
    superseded_by: glm-5
    dismissed_on: 2026-08-14
    reason: >-
      glm-5 is free on AIHubMix, which pays for it, and metered on z.ai.
  - entry: zai-glm
    family: glm-4.6v-flash
    superseded_by: glm-5
    dismissed_on: 2026-08-14
    reason: >-
      glm-5 is free on AIHubMix, which pays for it, and metered on z.ai.
  - entry: zai-glm
    family: glm-4.7-flash
    superseded_by: glm-5
    dismissed_on: 2026-08-14
    reason: >-
      The 2026-08-04 dismissal with the same reasoning, retargeted: the scout
      now names the family glm-5 rather than glm-5.2.
  - entry: vercel-ai-gateway
    family: glm-4.6v-flash
    superseded_by: glm-5
    dismissed_on: 2026-08-14
    reason: >-
      Vercel's zero-priced z.ai row is the Flash model; glm-5 is metered there.
  - entry: cerebras-free
    family: glm-4.7
    superseded_by: glm-5
    dismissed_on: 2026-08-14
    reason: >-
      Cerebras' Free Trial table listed zai-glm-4.7 and no glm-5 row on
      2026-08-14, and that trial needs a card in any case.

  # The two bumps the 2026-08-14 rehearsal offered that were left for a checker.
  # Both are the same error the glm-5 block above describes, arriving by the two
  # other routes a vendor leaves open: a priced catalog that carries the newer
  # generation outside the free lane, and a page that contradicts itself.
  - entry: routeway
    family: llama-3.3
    superseded_by: llama-4
    dismissed_on: 2026-08-14
    reason: >-
      Routeway does carry Llama 4 — llama-4-maverick at $0.11/$0.44 and
      llama-4-scout at $0.10/$0.225 per 1M tokens. Its free lane is the
      `:free` suffix priced at zero, and the only Llama in it is
      llama-3.3-70b-instruct:free (11 free ids read from
      api.routeway.ai/v1/models on 2026-08-14). A catalog a row can reach is
      not the same as the lane that row is listed for.
  - entry: kiro
    family: claude-sonnet-4.5
    superseded_by: claude-sonnet-4.6
    dismissed_on: 2026-08-14
    reason: >-
      kiro.dev/docs/models prices every model against an explicit Free column:
      Sonnet 4.5 is ticked, Sonnet 4.6 is blank and sits with the Opus models
      the same page sells to paid plans. The pricing page the probe reads says
      both — its plan card and its footnote say the free tier gets Sonnet 4.5,
      its FAQ prose says Sonnet 4.6 — so this bump will be proposed again from
      that page every run, which is what this file is for.

  # Three of the six bumps the 2026-08-14 rehearsal on b4e0b3b offered, each
  # checked against the vendor rather than against the proposal. The other
  # three were left standing because nobody has read their pages today:
  # zai-glm glm-4.5-flash → glm-4.6v-flash and glm-4.6v-flash → glm-4.7, both
  # inside z.ai's own Flash line, and upstage solar-mini → solar-pro-3, where
  # the row already lists both families.
  - entry: google-jules
    family: gemini-2.5
    superseded_by: gemini-3.1-pro
    dismissed_on: 2026-08-14
    reason: >-
      Gemini 3 Pro is what the paid plans buy. jules.google/docs/usage-limits
      sets Model Access per plan: "Gemini 2.5 Pro" on the free Jules row,
      "Higher access to the latest model (starting with Gemini 3 Pro)" on
      Jules in Pro and "Priority access" on Ultra. The free row is pinned to
      2.5 deliberately, and gemini-3.1-pro is not a name that page uses at all.
  - entry: groq-free
    family: llama-3.3
    superseded_by: llama-4
    dismissed_on: 2026-08-14
    reason: >-
      The bump 9c92a9b removed, arriving again from the same bytes that caused
      it: console.groq.com/docs/rate-limits carries llama-4 only inside the
      OpenAPI schema it embeds, while the Free Plan Limits table it renders has
      thirteen rows and no Llama 4 among them. Expect this one every run — the
      id is in the page and the offer is not.
  - entry: vercel-ai-gateway
    family: glm-4.6v-flash
    superseded_by: glm-4.7
    dismissed_on: 2026-08-14
    reason: >-
      Measured off ai-gateway.vercel.sh/v1/models on 2026-08-14: zai/glm-4.7 is
      $0.60/$2.20 per 1M, and of the 327 models in that catalog exactly two are
      priced 0 in and 0 out — poolside/laguna-s-2.1-free and zai/glm-4.6v-flash.
      The Flash row is the free lane; every other GLM there is metered.
