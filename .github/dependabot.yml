# Here for one reason: `astral-sh/setup-uv` is pinned to an exact version in
# every workflow because its publisher stopped shipping major tags at v8, and a
# pin nobody watches is how a workflow ends up majors behind — setup-uv sat at
# v5 against v10 before 2026-08-14. The other actions float their major tag and
# are along for the ride.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
