# Two things nobody would otherwise move. `astral-sh/setup-uv` is pinned to an
# exact version in every workflow because its publisher stopped shipping major
# tags at v8, and a pin nobody watches is how a workflow ends up majors behind —
# setup-uv sat at v5 against v10 before 2026-08-14. The other actions float
# their major tag and are along for the ride.
#
# And uv.lock, in one pull request a month for every package in it — the
# dependencies' own dependencies too (`all`). The request changes the lock
# alone while pyproject.toml already allows the new version
# (`increase-if-necessary`), which a floor with no cap always does: a floor
# there is the lowest version CI runs the code on (the `floors` job in ci.yml),
# not the newest one out, so a release never moves it. `lockfile-only` says
# that outright, but with it Dependabot's uv updater moved no package the lock
# holds only for another one: its log read update_not_possible for each of
# them on 2026-09-28.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    versioning-strategy: increase-if-necessary
    allow:
      - dependency-type: all
    groups:
      locked:
        patterns: ["*"]
    commit-message:
      prefix: chore
