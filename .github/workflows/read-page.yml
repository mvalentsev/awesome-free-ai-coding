name: read-page

# Temporary read-only comparison on this research branch. No verification fields
# are written. Input names match the existing dispatch workflow on main.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: Pages to compare
        required: true
        type: string
      keywords:
        description: Optional comparison note
        type: string
        default: ''
permissions:
  contents: read
jobs:
  compare:
    runs-on: ${{ fromJSON(vars.RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.12'
      # Primary PyPI releases checked 2026-10-12; versions and upload dates are
      # preserved in the review evidence. Isolated comparison dependencies only.
      - name: Compare real public-page readers
        run: >-
          uv run --with 'scrapling[fetchers]==0.4.15'
          --with curl_cffi==0.16.3 --with playwright==1.63.0
          python tests/page_readers_live.py --out comparison
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: public-page-comparison
          path: comparison/
          if-no-files-found: error
