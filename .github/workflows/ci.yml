name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Every Python CONTRIBUTING.md names, oldest first: claims.CLAIMS holds its
    # sentence to this list, and the suite holds the oldest to requires-python
    # in pyproject.toml and the list to every minor from there up.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    name: test (Python ${{ matrix.python }})
    runs-on: ${{ fromJSON(vars.RUNNER || '"ubuntu-latest"') }}
    steps:
      # The whole history, so the log check below can read the push's parent.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # An exact version where checkout above it floats a major tag:
      # setup-uv stopped publishing major and minor tags at v8, on purpose, so
      # `@v10` is a ref that does not exist and the step fails outright. The
      # pin is watched by .github/dependabot.yml, which is the only reason it
      # can be this specific without going stale.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}

      # The versions uv.lock pins, and a red run when the lock no longer
      # matches pyproject.toml — never a lock resolved afresh on the runner,
      # which is not the one committed.
      - run: uv sync --locked

      - run: uv run pytest -q

      # Validates registry.yaml (pydantic) and the templates on every PR —
      # including scout PRs, which only touch the registry — and then compares
      # every generated file with what is committed. Everything this repository
      # publishes is rendered from the registry and all of it is checked in, so
      # a registry edit that skipped the render leaves the README, the JSON an
      # LLM reads, the configs a reader pastes and a page per row advertising a
      # registry that has moved on, until a scheduled run happens to fix it.
      # --check writes nothing: it renders into a temporary directory and
      # reports, so CI still never mutates tracked files.
      - name: Registry renders, and the committed files are that render
        run: uv run freetier-render --registry registry.yaml --templates templates --check

      # The curated files beside the registry are read by the scout, which runs
      # behind a catch-all, so a malformed one would reach main as a green run
      # that had silently done nothing. This is where it is caught, together
      # with the contradictions that span two files.
      - name: Curated files + cross-file consistency
        run: uv run freetier-check

      # What no check of one tree can see: history.jsonl grown, commit by
      # commit, by exactly the lines each commit's render records, the
      # announcer's ledger only ever appended to, and on a pull request the
      # fields a probe earns (last_verified, probe_failures, provisional,
      # first_seen) left as the run wrote them. The pre-commit hook holds a commit to the same rules
      # before it exists; this holds a push or a pull request made without it.
      # On a pull request HEAD is the merge commit, and its first parent is the
      # branch the request would land on.
      - name: Logs appended to, earned fields untouched
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            uv run freetier-gate diff HEAD^1 --earned
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            uv run freetier-gate diff "${{ github.event.before }}"
          fi

  # The lowest version pyproject.toml allows of every dependency it names, on
  # the oldest Python it allows, so a floor written there is one the code has
  # run on. UV_RESOLUTION holds every uv command in the job to it: a plain
  # `uv run` would first sync the environment back to uv.lock.
  floors:
    runs-on: ${{ fromJSON(vars.RUNNER || '"ubuntu-latest"') }}
    env:
      UV_RESOLUTION: lowest-direct
    steps:
      - uses: actions/checkout@v7

      # Exact by necessity — see the note above.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"

      - run: uv sync

      - run: uv run pytest -q

      - name: Registry renders, and the committed files are that render
        run: uv run freetier-render --registry registry.yaml --templates templates --check

      - name: Curated files + cross-file consistency
        run: uv run freetier-check
