name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ fromJSON(vars.RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v7

      # An exact version where the two lines around it float a major tag:
      # setup-uv stopped publishing major and minor tags at v8, on purpose, so
      # `@v10` is a ref that does not exist and the step fails outright. The
      # pin is watched by .github/dependabot.yml, which is the only reason it
      # can be this specific without going stale.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"

      - run: uv sync

      - run: uv run pytest -q

      # Validates registry.yaml (pydantic) and the templates on every PR —
      # including scout PRs, which only touch the registry. Renders outside
      # the repo so CI never mutates tracked files.
      - name: Registry + render smoke check
        run: uv run freetier-render --registry registry.yaml --templates templates --out /tmp/README.md

      # The four curated files beside the registry are read only by the scout,
      # which runs behind a catch-all — so a malformed one used to reach main and
      # turn into a green run that had silently done nothing. This is where that
      # gets caught now, together with the contradictions that span two files.
      - name: Curated files + cross-file consistency
        run: uv run freetier-check
