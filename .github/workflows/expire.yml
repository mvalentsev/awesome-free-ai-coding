name: expire promotions

on:
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

# Serialize every writer of main with the verification workflow. An hourly
# check is a no-op unless a documented deadline has passed; it calls no vendor
# API or scout backend and cannot earn verification fields.
concurrency:
  group: update
  cancel-in-progress: false
  queue: max

jobs:
  expire:
    runs-on: ${{ fromJSON(vars.RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 20
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Publish ended promotions and scheduled shutdowns
        id: publish
        run: |
          uv run freetier-render --expire-only
          if git diff --quiet -- registry.yaml history.jsonl; then
            exit 0
          fi
          uv run freetier-check
          uv run freetier-render --check
          uv run freetier-gate diff HEAD --earned
          uv run pytest -q
          git config user.name "freetier-bot"
          git config user.email "freetier-bot@users.noreply.github.com"
          paths=$(uv run freetier-map paths run)
          test -n "$paths"
          git add -- $paths
          git commit -m "chore: expire model promotions $(date -u +%F)"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Check clients after a changed configuration
        if: ${{ steps.publish.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run freetier-conformance dispatch --before "$(git rev-parse HEAD^)" --sha "$(git rev-parse HEAD)"
      - name: Dispatch Pages and IndexNow reconciliation
        if: ${{ always() && steps.publish.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REBUILD_PAGES: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$REBUILD_PAGES" != true ] && uv run freetier-indexnow --check-delivery; then
            exit 0
          fi
          gh workflow run indexnow.yml --repo "$GITHUB_REPOSITORY" --ref main -f "rebuild_pages=$REBUILD_PAGES"
