name: indexnow

# Bing, Yandex and the engines that share their index read what IndexNow names,
# and Bing's index is what the search inside ChatGPT, Copilot and DuckDuckGo
# reads. The scheduled run pings after its own push; a push made by hand — a row
# added, a page rewritten, a model page born — would wait up to four days for
# the next run, so a push to main that changes a file the site publishes pings
# as well. The run's own push is made with GITHUB_TOKEN, which starts no
# workflow, so the two never ping for the same commit.
on:
  push:
    branches: [main]
    # Every file the site publishes: layout.MAP's lines marked `published`, and
    # no other. tests/test_layout.py holds the two lists to one.
    paths:
      - "registry.yaml"
      - "watchlist.yaml"
      - "blocklist.yaml"
      - "sources.yaml"
      - "dismissed.yaml"
      - "history.jsonl"
      - "announced.jsonl"
      - "index.html"
      - "configs/opencode.json"
      - "configs/litellm.yaml"
      - "configs/free-llm.env.example"
      - "configs/claude-code.sh"
      - "index.json"
      - "feed.xml"
      - "llms.txt"
      - "providers/*.md"
      - "models/*.md"
      - "browse.html"
      - "404.html"
      - "assets/*.svg"
      - "assets/*.png"
      - "eb68c254f1e03877b906ccc800002691.txt"
      - "CONTRIBUTING.md"
      - "LICENSE"

permissions:
  contents: read
  pages: read

# A newer push publishes a newer site; the older ping has nothing left to say.
concurrency:
  group: indexnow
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ${{ fromJSON(vars.RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # Exact by necessity — see the note in ci.yml.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"

      - run: uv sync

      # Pages builds a push in a minute or two, and an engine that fetched on
      # the ping would read the pages before it: `--after-pages-build` waits for
      # the build of this very commit (indexnow.wait_for_pages, the scheduled
      # run's wait too); a push that lands meanwhile cancels this job. Best
      # effort, as on the scheduled run: an engine being down is not a reason to
      # mark a push that has already published as failed.
      - name: Tell search engines what changed (IndexNow)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run freetier-indexnow --index index.json --after-pages-build "${{ github.sha }}"
