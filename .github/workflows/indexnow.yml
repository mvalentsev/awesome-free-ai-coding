name: indexnow

# One sender for human pushes, verification and hourly expiry, including a
# retry when expiry finds nothing to change. The bot dispatches this workflow
# explicitly because its GITHUB_TOKEN pushes do not start push workflows
# (GitHub trigger-a-workflow docs, checked 2026-11-22).
on:
  workflow_dispatch:
    inputs:
      rebuild_pages:
        description: "Request a Pages rebuild even if this commit is already served"
        type: boolean
        default: false
  push:
    branches: [main]
    # Every file the site publishes: layout.MAP's lines marked `published`, and
    # no other. freetier-render generates this projection; tests/test_layout.py
    # independently checks the filter against the map.
    paths:
      - "registry.yaml"
      - "watchlist.yaml"
      - "blocklist.yaml"
      - "sources.yaml"
      - "dismissed.yaml"
      - "history.jsonl"
      - "announced.jsonl"
      - "index.html"
      - "configs/opencode.json"
      - "configs/litellm.yaml"
      - "configs/free-llm.env.example"
      - "configs/claude-code.sh"
      - "configs/codex/*.config.toml"
      - "index.json"
      - "feed.xml"
      - "llms.txt"
      - "assets/readme/*.svg"
      - "providers/*.md"
      - "models/*.md"
      - "browse.html"
      - "404.html"
      - "assets/favicon.svg"
      - "assets/github-mark.svg"
      - "assets/social-preview.svg"
      - "assets/*.png"
      - "assets/*.js"
      - "assets/anchorjs-LICENSE.txt"
      - "assets/*.css"
      - "eb68c254f1e03877b906ccc800002691.txt"
      - "CONTRIBUTING.md"
      - "LICENSE"

permissions:
  contents: write
  deployments: read
  pages: write

# Serialize the read, submission and advance of the shared delivery ref.
# Checkout reads main after the run acquires the slot, so an older queued
# event can recover the current publication too.
concurrency:
  group: indexnow
  cancel-in-progress: false
  queue: max

jobs:
  ping:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ fromJSON(vars.RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 25
    steps:
      # The delivery ref points to a commit in main's history.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      # Exact by necessity — see the note in ci.yml.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"

      - run: uv sync

      - name: Tell search engines what changed (IndexNow)
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REBUILD_PAGES: ${{ inputs.rebuild_pages }}
        run: |
          args=(--deliver)
          if [ "$REBUILD_PAGES" = true ]; then
            args+=(--request-pages-build)
          elif [ "$EVENT" = workflow_dispatch ]; then
            args+=(--ensure-pages-build)
          fi
          uv run freetier-indexnow "${args[@]}"
