name: update

on:
  schedule:
    - cron: "23 5 * * 1,4"   # twice a week, Monday and Thursday 05:23 UTC
  workflow_dispatch:
    inputs:
      scout_backend:
        description: "LLM backend — auto runs the usual chain; a name forces that one and fails if it is unconfigured"
        type: choice
        default: auto
        options:
          - auto
          - custom
          - custom-fallback
          - gemini
          - openrouter
          - ovh-anonymous
      dry_run:
        description: "Run every phase, commit nothing, open no PR (report lands in the run summary)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ${{ fromJSON(vars.RUNNER || '"ubuntu-latest"') }}
    # The scout keeps its own wall-clock budget (SCOUT_DEADLINE_SECONDS); this is
    # the backstop for everything else, so a hung run cannot sit on the runner
    # for the default six hours.
    timeout-minutes: 60
    steps:
      # The whole history, 3 MB: freetier-bars dates every id a free lane lists
      # from the commits that added it to registry.yaml.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Exact by necessity — see the note in ci.yml.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"

      - run: uv sync

      # A real run's probe exits 0 whatever it finds and hands its failures to
      # the scout. A dry run's exits 1 on a failing row, and without this one
      # FAIL would skip every step after it — the checks a dry run is
      # dispatched to try among them (Yolo-Auto's, 2026-09-25). A scheduled
      # run has no inputs, so null == true is false and nothing changes there.
      - name: Probe all entries
        continue-on-error: ${{ inputs.dry_run == true }}
        run: uv run freetier-probe --registry registry.yaml --failures failures ${{ inputs.dry_run && '--dry-run' || '' }}

      # A tier is a measurement, and a measurement goes stale: the index moves as
      # models ship. Re-read on every run, so the frontier answer at the top of the
      # README follows the index instead of the day a mark was typed. Best effort:
      # the leaderboard being down or reshaped is not a reason to stop a run that
      # has probes to record, and the marks stay as they were.
      - name: Re-read tier marks from the Artificial Analysis index
        continue-on-error: true
        run: uv run freetier-tiers --registry registry.yaml --write

      # Which ids a free lane has carried for two weeks with no Models-column
      # family, and when the rest fall due. A report for the reviewer, never a
      # gate: the calendar moves an id from waiting to due without a commit.
      - name: Report the models owed a family
        continue-on-error: true
        run: uv run freetier-bars | tee -a "$GITHUB_STEP_SUMMARY"

      # The render records what this run changed in history.jsonl — with any
      # change the calendar made since the last commit — before it writes a page.
      - name: Record what changed and render every page
        run: uv run freetier-render --registry registry.yaml --templates templates --out README.md

      # CI never runs on this workflow's own push (GITHUB_TOKEN starts no
      # workflow), so what CI would check is checked here, before the commit:
      # the curated files, the map and the hand-written claims, every generated
      # file against the registry, history.jsonl grown by exactly what the
      # render recorded, the announcer's ledger left alone, and the tests —
      # some of which read the committed files, such as the README's ceiling.
      # A red step leaves main as it was and the findings in this log. It runs
      # on a dry run too, which is how a change to it is tried before a real run.
      - name: Check what the run is about to commit
        run: |
          uv run freetier-check
          uv run freetier-render --check
          uv run freetier-gate diff HEAD
          uv run pytest -q

      - name: Commit verification results to main
        id: commit
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "freetier-bot"
          git config user.email "freetier-bot@users.noreply.github.com"
          # What the run writes is the map's list (layout.MAP), not one typed
          # here: a file the render starts writing is committed by the first run
          # that writes it, and a page it stops writing is committed as removed.
          paths=$(uv run freetier-map paths run) || exit 1
          [ -n "$paths" ] || { echo "::error::the map names no file the run writes"; exit 1; }
          git add -- $paths
          if git diff --staged --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: verification $(date -u +%F)"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # Bing, Yandex and the engines sharing their index recrawl a site this
      # size every few weeks on their own; a ping after a push has the pages
      # that changed read the same day. Best effort: an engine being down is
      # not a reason to fail a run that has already published.
      - name: Tell search engines what changed (IndexNow)
        if: ${{ !inputs.dry_run && steps.commit.outputs.pushed == 'true' }}
        continue-on-error: true
        run: uv run freetier-indexnow --index index.json

      # Says what the history just recorded, from the project's own accounts,
      # once per event and channel (announced.jsonl is the ledger). With no
      # credentials configured it prints so and exits 0 — the step exists
      # before the accounts do. Runs after the verification commit so a post
      # never links a page that is not yet deployed, and never on a dry run.
      - name: Announce what changed
        if: ${{ !inputs.dry_run }}
        env:
          BLUESKY_HANDLE: ${{ vars.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_BASE_URL: ${{ vars.MASTODON_BASE_URL }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: |
          uv run freetier-announce --history history.jsonl --registry registry.yaml --ledger announced.jsonl
          # The ledger exists only once something was posted; `git add` on a
          # missing path is an error, and an empty ledger is not worth a commit.
          [ -f announced.jsonl ] && git add announced.jsonl
          git diff --staged --quiet || git commit -m "chore: announcements $(date -u +%F)"
          git push

      - name: Scout (web discovery + LLM proposals)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCOUT_BASE_URL: ${{ vars.SCOUT_BASE_URL }}
          SCOUT_MODEL: ${{ vars.SCOUT_MODEL }}
          SCOUT_API_KEY: ${{ secrets.SCOUT_API_KEY }}
          SCOUT_FALLBACK_BASE_URL: ${{ vars.SCOUT_FALLBACK_BASE_URL }}
          SCOUT_FALLBACK_MODEL: ${{ vars.SCOUT_FALLBACK_MODEL }}
          SCOUT_FALLBACK_API_KEY: ${{ secrets.SCOUT_FALLBACK_API_KEY }}
          SCOUT_FORCE_BACKEND: ${{ inputs.scout_backend }}
          SCOUT_DEADLINE_SECONDS: ${{ vars.SCOUT_DEADLINE_SECONDS }}
        run: uv run freetier-scout --registry registry.yaml --failures failures/failures.json --pr-body scout-pr.md ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Record the scout's changes and render every page
        run: uv run freetier-render --registry registry.yaml --templates templates --out README.md

      # A pull request this workflow opens starts no CI run (GITHUB_TOKEN), and
      # PR #17 went up failing freetier-check with nothing on it saying so. The
      # checks run here on the branch's tree, earned fields and new rows
      # included, and their result heads the PR body and the run summary.
      - name: Check the scout's branch
        run: |
          {
            echo "## Checks on this branch"
            echo
            echo "CI does not run on a pull request this workflow opens, so these ran here:"
            echo
            for cmd in "freetier-check" "freetier-render --check" "freetier-gate diff HEAD --earned" "pytest -q"; do
              if out=$(uv run $cmd 2>&1); then
                echo "- ✓ \`$cmd\`"
              else
                echo "- ✗ \`$cmd\`"
                echo
                echo '```'
                echo "$out" | tail -30
                echo '```'
              fi
            done
            echo
            cat scout-pr.md
          } > scout-pr.checked.md
          mv scout-pr.checked.md scout-pr.md

      # The scout's report is the only account of what the run found. On a dry
      # run there is no PR to carry it, and on a scheduled run it is worth
      # having next to the log rather than only in the PR body.
      - name: Publish the scout report in the run summary
        if: always()
        run: cat scout-pr.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Open scout PR
        if: ${{ !inputs.dry_run }}
        uses: peter-evans/create-pull-request@v8
        with:
          branch: scout/weekly
          delete-branch: true
          title: "scout: registry proposals"
          body-path: scout-pr.md
          labels: scout

      # Runs last, and only ever after the pull request and the summary exist,
      # because a red run here is a notification and not an invitation to rerun:
      # a rerun checks out the old SHA and its push is refused as
      # non-fast-forward. A scout that could not think and a scout that found
      # nothing produce the same empty report, and on 2026-08-31 the difference
      # went unnoticed for four days behind a green tick — every backend in the
      # chain was down and the generation check never ran.
      - name: Check the scout actually had a backend
        if: always()
        run: |
          if [ ! -f scout-status.json ]; then
            echo "::error::the scout wrote no status file — it died before it could report"
            exit 1
          fi
          cat scout-status.json
          uv run python - <<'PY'
          import json, sys
          status = json.load(open("scout-status.json"))
          aborted, outages = status.get("aborted"), status.get("llm_outages") or []
          # A curated feed that stopped carrying its list is a notice, never a
          # red run: it costs leads, and the rest of the run is sound.
          for warning in status.get("feed_warnings") or []:
              print(f"::warning::curated feed: {warning}")
          if aborted:
              print(f"::error::scout aborted: {aborted}")
          if outages:
              print("::error::no backend in the chain answered for "
                    + ", ".join(outages) + " — those phases did not run")
          sys.exit(1 if aborted or outages else 0)
          PY
