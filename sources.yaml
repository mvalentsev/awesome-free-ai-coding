# Lists, catalogs and directories read as a possible feed and NOT adopted.
#
# `CURATED_FEEDS` in src/freetier_radar/discovery.py is the other half of this
# decision: the lists the scout actually fetches on every run. Nothing held this
# half, so the cost of opening a list that carries no provider data was paid
# again every time the link resurfaced — three lists went through that in a
# single week and left no trace in the repository, because the reasoning existed
# only in whichever conversation happened to have it.
#
# Same shape as watchlist.yaml, one level up. That file records a verdict on a
# service; this one records a verdict on the thing that proposes services. Both
# are verdicts on a DATE: after SOURCE_RECHECK_DAYS (180) a row stops being
# trusted and starts being reported in the scout's PR body as due for a re-read,
# because a directory can grow into a feed long after someone first opened it.
# `reopen_if` names what would change the answer, so the next look starts from
# the last one instead of from zero.
#
# This is not a blocklist. A source usually lands here for carrying nothing this
# registry can use, which is a statement about the overlap and not about the
# list. One entry below is here for the opposite reason — what it carries is
# disqualified by CONTRIBUTING rather than merely absent — and it is filed here
# anyway, because a verdict on a list belongs with the verdicts on lists even
# when the answer is that kind of no.

read:
  - url: https://github.com/Shubhamsaboo/awesome-llm-apps
    name: Shubhamsaboo/awesome-llm-apps
    checked_on: '2026-08-30'
    reason: >-
      132k stars and none of them about free tiers: it is a catalog of 100+
      agent, RAG and agent-skill templates you clone and run, so its providers
      appear as the paid API a demo happens to call. Read whole rather than by
      README — 1116 files, every URL extracted — it names 201 hosts this
      repository does not carry, and not one of them is an inference provider
      with a free tier; they are dev tooling and SaaS (Firecrawl, E2B, Qdrant,
      Tavily, Exa, SerpAPI, Composio). Free-tier language occurs six times in
      the whole tree, and the only occurrence naming an API provider is
      "Free tier available for testing" about OpenRouter, listed here since the
      beginning. The two vendors it did surface, Together AI and Perplexity,
      are in watchlist.yaml as of the same day. Re-checked 2026-08-30, since it
      pushes most days: the whole tree still holds exactly two paths matching
      "provider" or "free", and both are React context components
      (BuilderAgentProvider.tsx, CopilotKitProvider.tsx). Still app templates.
    reopen_if: >-
      It starts publishing a provider or free-tier table rather than app
      templates.

  - url: https://github.com/ShaikhWarsi/free-ai-tools
    name: ShaikhWarsi/free-ai-tools
    checked_on: '2026-08-14'
    reason: >-
      A general free-AI-tools directory, not a model-endpoint list. Of the 105
      hosts in its 76KB README, 52 are already carried; the remainder is
      writing, design, legal and automation software (canva.com, grammarly.com,
      elevenlabs.io, harvey.ai, n8n.io, quillbot.com) that this registry does
      not cover by category rather than by verdict. Its in-scope names were
      triaged the day it was read and became watchlist rows — DeepInfra,
      Fireworks, Baseten, Hyperbolic, Inference.net, Chutes, NLP Cloud,
      Tabnine, JetBrains AI, Bolt.new, Lovable and v0 — so the yield has
      already been taken. Note for any re-read: its tools.ts data file is a
      subset of the README, so diff both or the second half goes unseen.
      Re-read the same day at the user's request and nothing had moved — its
      last commit is 2026-08-09, five days before the first read — so the
      second pass went after what the first had not looked for. Two things
      came back. Its Related Resources section names five lists, four of them
      already answered here and one, inmve/free-ai-coding, that was not; it
      has its own row below. And its own tables disagree with each other: the
      Commercial Use Summary marks Cohere "Yes", while its changelog removed
      Cohere as "non-commercial only". Cohere's pricing page settles it
      against the table, and this registry's row now carries the restriction.
    reopen_if: >-
      It splits the LLM-API rows into their own machine-readable file, or its
      uncovered hosts stop being non-API tools.

  - url: https://github.com/mnfst/awesome-free-llm-apis
    name: mnfst/awesome-free-llm-apis
    checked_on: '2026-08-30'
    reason: >-
      The right subject and nothing new in it. Of the 38 hosts it links, 35 are
      already carried; the three that are not are awesome.re (the list badge),
      manifest.build (the maintainer's own product) and open.bigmodel.cn, which
      is the China console of the vendor already listed under z.ai. A sixth
      feed that re-states the five is prompt budget spent on agreement.
      Re-read 2026-08-30 after a 2026-08-21 push: 43 hosts now, and the two it
      gained over the first read are docs.bigmodel.cn and dash.cloudflare.com —
      second spellings of vendors already carried. The verdict is unchanged.
    reopen_if: >-
      Its provider table grows past what the curated feeds already carry.

  - url: https://github.com/nherx/free-llm-api-resources
    name: nherx/free-llm-api-resources
    checked_on: '2026-08-30'
    reason: >-
      Read on 2026-08-11 as a possible successor to cheahjs/free-llm-api-resources,
      which GitHub had started 404ing and which was dropped from CURATED_FEEDS
      that day, and re-read on 2026-08-14 unchanged in substance. It carries the
      name and not the data — 6KB whose only links are "Download Latest Release"
      and "Report Issues", both to github.com, and no provider table at all.
      Re-read 2026-08-30 because the repository had grown from 6KB to 997KB,
      which is the shape of the reopen condition below and is not what happened.
      What arrived is the original's CODE, not its data: src/data.py is 294 lines
      of MODEL_TO_NAME_MAPPING plus three ignore-lists, with no provider, no
      quota and no URL in it, and src/pull_available_models.py is the script that
      queried the providers — 44 hosts, 8 of them not carried here, every one
      either dead (api.kluster.ai, sunset 2026-06-09) or a paid cloud. The rest
      of the weight is a 547KB zip. The README is unchanged SEO filler whose
      every call to action, "Report Issues" included, points at that zip.
    reopen_if: >-
      It publishes the provider TABLES the original carried — vendor, quota,
      source page — as text in the repository. More code from the original is
      not the data, and neither is another release archive.

  - url: https://github.com/MrFadiAi/free-llm-gateway
    name: MrFadiAi/free-llm-gateway
    checked_on: '2026-08-14'
    reason: >-
      Software, not a listing, and its provider list is downstream of a feed
      already declined here. It is a self-hosted FastAPI server — "Configure
      your free API keys in `.env`, then use one base URL + one master key" —
      so it is the BYOK-only case CONTRIBUTING excludes: it bundles no model
      access of its own, and it is not a hosted relay either, which is why it
      is here rather than on the blocklist. Read whole, not by README: 66
      distinct hosts across models.yaml (55KB), config.py, providers.py,
      provider_guides.py, .env.example and three dated test reports. Every
      inference provider among them is already carried; what is left is two
      benchmark sites (artificialanalysis.ai, lmarena.ai), Together AI's API
      host under its second domain, and models.inference.ai.azure.com, which
      is GitHub Models, archived here on 2026-07-30. Its README says where the
      set comes from — "Auto-sync — pulls new free models from
      awesome-free-llm-apis" — the list declined ten lines above. Its own
      claims are the stale kind this file exists to stop paying for twice:
      PROVIDER_TEST_RESULTS.md, dated 2026-05-24 like the last push, credits
      Cerebras with a "30 RPM free tier" where Cerebras' docs give the Free
      Trial 5 RPM against card-required credits, and the README still lists
      GitHub Models.
    reopen_if: >-
      It starts publishing free-tier terms it verified itself rather than a
      key-configuration list, or its provider set stops tracking
      mnfst/awesome-free-llm-apis.

  - url: https://github.com/xtekky/gpt4free
    name: xtekky/gpt4free
    checked_on: '2026-08-30'
    reason: >-
      The one entry here that is not a directory at all, and the only one whose
      contents this repository rejects on principle rather than on overlap: it
      is a Python library whose 101 provider classes reach paid products by
      impersonating their own clients — Microsoft Copilot, Perplexity, Grok,
      Claude, the Gemini web app, Qwen chat, DeepSeek chat, Meta AI, You.com,
      Quillbot, Opera Aria, Blackbox, four Hugging Face Spaces — which is the
      "reverse proxies, key sharing, scraped or unofficial gateways" line in
      CONTRIBUTING, in one repository. Its own hosted instance, g4f.space, has
      been on the blocklist since before this file existed. Read whole anyway,
      because a provider adapter is a claim someone made work: 219 hosts across
      g4f/ and docs/, of which 45 are already carried here and every remaining
      official inference provider is a name this repository already has a
      verdict on. One file distorts the count — needs_auth/BlackboxPro.py is a
      model catalog, so lambdalabs, snowflake, databricks, featherless and a
      dozen more appear in it as model-provenance links rather than as
      endpoints anyone here could call. What was genuinely new was eight
      services with no verdict in this repository, now in watchlist.yaml, and
      three that no longer exist: cablyai.com and theb.ai do not resolve,
      fenayai.com answers a Cloudflare 530, and gpt4free still ships a class for
      each. Its one transferable idea is config.yaml routing — named routes that
      fall through a provider chain on conditions like
      "quota.models.<id>.remainingFraction > 0 and error_count < 3", the shape
      configs/litellm.yaml would take if it grouped deployments. Measured
      against this registry rather than admired: 7 of 71 callable ids are served
      by two or more entries, and 5 of those 7 are OpenRouter's own :free
      catalog seen through two gateways, so the fallback group it suggests has
      two real members and one of them is a card-required trial. Re-checked
      2026-08-30 by diffing the changed file list rather than re-reading 219
      hosts, because the reopen condition below is narrow: of everything the
      repository has changed since 2026-08-14, the provider work touched
      DeepInfra, Airforce, Gemini, Nvidia and Ollama — five adapters this
      repository already has a verdict on, two of them blocklisted. No table of
      official free tiers appeared.
    reopen_if: >-
      It starts publishing a table of official free tiers — vendor, quota,
      source page — rather than provider adapters. A new adapter is not a
      reason: this read covered every one of them.

  - url: https://github.com/inmve/free-ai-coding
    name: inmve/free-ai-coding
    checked_on: '2026-08-14'
    reason: >-
      Reached from ShaikhWarsi's Related Resources on a re-read, and the right
      shape on paper: 759 stars, a README.template.md built by
      scripts/build-readmes.js out of locales/*.json, where the tool rows are
      structured objects rather than prose. That is close to the split this
      file asks other directories for — and it stopped. The last commit is
      2025-12-05 and locales/en.json still carries meta.lastUpdated "December
      5, 2025", eight months of drift that shows: it sells Gemini CLI's free
      tier (closed 2026-06-18), Amazon Q Developer (superseded by Kiro),
      Cursor "Free until Dec 11, 2025" and Windsurf under a name Cognition
      retired on 2026-06-02. All 45 domains it links already have a verdict
      here — three of them only after this read, because kilocode.ai,
      codeium.com and windsurf.com redirect into rows we list and were
      recorded under no name. Its ranking rule, "pro-grade means >60% on
      SWE-bench Verified", is the self-reported benchmark score this project
      has declined six times.
    reopen_if: >-
      It starts committing again, or its locale files begin carrying a quota
      the curated feeds do not.

  - url: https://github.com/codertesla/ai-coding-deals
    name: codertesla/ai-coding-deals
    checked_on: '2026-09-02'
    reason: >-
      A deals list, not a free-tier list, and it says so itself: "free tiers,
      discounts, referral credits & open-source alternatives". Read whole on
      2026-09-02, both READMEs, last pushed 2026-08-04. It links 35 hosts
      outside GitHub, 14 of which had no verdict here, and only four of those
      14 carry a free-tier claim at all: freebuff.com, which this read added to
      the registry, plus qodo.ai (free Developer tier — 30 PR reviews/month and
      250 IDE credits), codebuddy.ai (250 credits per 2 weeks) and
      augmentcode.com (a Community tier it does not quantify). The other ten
      are a card-required 7-day SuperGrok trial that bills $30/month if you
      forget, a Kimi membership lottery drawn from an invite link, WeChat
      signup credits, a 90-day 1M-token Tencent trial grant and outright paid
      tools. Most rows carry the maintainer's own referral code — the Freebuff,
      Kimi, Tencent and WorkBuddy links all do — which is a standing reason to
      read the vendor rather than the row. Its promo-expiry checker
      (scripts/check_promo_expiry.py, run weekly) is the one piece of
      machinery here worth borrowing: it is a deadline sweep, which is what a
      list of dated offers needs and a list of standing free tiers does not.
    reopen_if: >-
      It separates free tiers from discounts into their own table, or its
      free-tier rows start naming quotas and model lists instead of savings.
