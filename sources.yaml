      been on the blocklist since before this file existed. Read whole anyway,
      because a provider adapter is a claim someone made work: 219 hosts across
      g4f/ and docs/, of which 45 are already carried here and every remaining
      official inference provider is a name this repository already has a
      verdict on. One file distorts the count — needs_auth/BlackboxPro.py is a
      model catalog, so lambdalabs, snowflake, databricks, featherless and a
      dozen more appear in it as model-provenance links rather than as
      endpoints anyone here could call. What was genuinely new was eight
      services with no verdict in this repository, now in watchlist.yaml, and
      three that no longer exist: cablyai.com and theb.ai do not resolve,
      fenayai.com answers a Cloudflare 530, and gpt4free still ships a class for
      each. Its one transferable idea is config.yaml routing — named routes that
      fall through a provider chain on conditions like
      "quota.models.<id>.remainingFraction > 0 and error_count < 3", the shape
