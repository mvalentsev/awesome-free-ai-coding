      machinery here worth borrowing: it is a deadline sweep, which is what a
      list of dated offers needs and a list of standing free tiers does not.
      The three claims were read against the vendors on 2026-09-02: qodo.ai's
      pricing page carries a 14-day no-card trial and no Developer plan (a
      trial row now), codebuddy.ai's Free plan is real and readable on its
