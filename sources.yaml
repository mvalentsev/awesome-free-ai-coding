      the registry, plus qodo.ai (free Developer tier — 30 PR reviews/month and
      250 IDE credits), codebuddy.ai (250 credits per 2 weeks) and
      augmentcode.com (a Community tier it does not quantify). The other ten
      are a card-required 7-day SuperGrok trial that bills $30/month if you
      forget, a Kimi membership lottery drawn from an invite link, WeChat
      signup credits, a 90-day 1M-token Tencent trial grant and outright paid
      tools. Most rows carry the maintainer's own referral code — the Freebuff,
      Kimi, Tencent and WorkBuddy links all do — which its CONTRIBUTING allows
      on one condition, that "the deal is genuinely good for the user (same or
      better than the public price)", and which is a standing reason to read
      the vendor rather than the row. Its freshness badge is worth the same
      caution: it renders last_verified-2026--08 while the README's own line
      reads "Last comprehensive verification: June 2026". The two names it
      surfaced that this registry already holds show what reading the row costs
      — Amazon Q Developer and Supermaven are both watchlisted here with
      verdicts the list does not have, that Q is the predecessor AWS is folding
      into Kiro and that Supermaven's real free tier is inline completions with
      no API. Its promo-expiry checker
      (scripts/check_promo_expiry.py, run weekly) is the one piece of
      machinery here worth borrowing: it is a deadline sweep, which is what a
      list of dated offers needs and a list of standing free tiers does not.
      The three claims were read against the vendors on 2026-09-02: qodo.ai's
      pricing page carries a 14-day no-card trial and no Developer plan (a
      trial row now), codebuddy.ai's Free plan is real and readable on its
      VitePress docs — 100 credits a month plus a daily bonus and 250 welcome
      credits, near the "250 credits per 2 weeks" the list says (a trial row
      now), and augmentcode.com prices two plans from $100 a month and names
      no free one (watchlisted). Two of four free-tier claims survived a read
      of the vendor, one of them reworded.
    reopen_if: >-
      It separates free tiers from discounts into their own table, or its
      free-tier rows start naming quotas and model lists instead of savings.

