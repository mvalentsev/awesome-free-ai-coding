  - url: https://api.freellmapi.co/v1/latest
    name: freellmapi hosted catalog
    checked_on: '2026-09-21'
    reason: >-
      The signed catalog that tashfeenahmed/freellmapi's installs sync twice a
      day, public on its monthly tier: version 2026.09.21 held 309 models on 22
      platforms, each with request and token limits, a monthly token budget, a
      context window and tool and vision flags, and 71 quirks — the operator's
      own key-tested notes, many of them dated. The 21 platforms with chat
      models all have a verdict here — the 22nd, Pinecone, serves only
      embeddings, which this list leaves out — and the repository's key list,
      read every run as a curated feed, names all 21 and some forty more, so
      the catalog brings the scout no lead the feed does not. Its figures are
      one operator's measurements and they lag the vendors' own pages this
      registry reads: ModelScope still at 2,000 calls a day where the limits
      page meters 魔粒, Mistral as per-minute and monthly token caps where the
      pricing page now gives the Free plan $10 a month in credits. The quirks
      were read whole as leads; where they touch a row here they agree with it
      — NVIDIA's ~40 requests a minute, OpenRouter's account-wide 50 a day,
      Hugging Face's $0.10 a month, OVHcloud's two anonymous requests a minute
      — and the rest concern vendors already watchlisted or blocklisted. What
      they taught was a probe check: gateways answering an id with a model it
      does not name (every Lucidity open/* route as synth-2.5-preview, eleven
      Septor -free aliases as minimax-m2.5-free), which the keyless probe here
      now reads off every answer.
    reopen_if: >-
      It lists a chat platform with no verdict here, or the repository's key
      list stops naming every chat platform the catalog serves.

