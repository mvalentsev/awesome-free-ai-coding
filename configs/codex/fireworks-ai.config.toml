# Codex CLI on Fireworks AI's free lane — generated from registry.yaml, do not
# edit by hand.
# Fireworks AI's own page sets Codex CLI up on this lane,
# https://docs.fireworks.ai/nexus/harnesses, and every run of the list reads
# it back and asks the lane's Responses route again; only a key can run a turn
# there. Needs Codex CLI 0.134 or later; the file goes where Codex keeps its
# config, ~/.codex unless CODEX_HOME says otherwise:
#
#   cp configs/codex/fireworks-ai.config.toml ~/.codex/
#   codex -p fireworks-ai
#
# The key comes from $FIREWORKS_AI_API_KEY, the variable free-llm.env.example
# exports; get one at https://app.fireworks.ai/settings/users/api-keys. With
# $FIREWORKS_AI_API_KEY unset or empty, Codex stops before it sends anything,
# so no other key of yours reaches the lane. The model is the first id the row
# lists; what the free part covers and every id are on the row's page,
# https://mvalentsev.github.io/awesome-free-ai-coding/providers/fireworks-ai/
# — codex -p fireworks-ai -m <id> takes another.
model = "accounts/fireworks/models/deepseek-v4p1-flash"
model_provider = "fireworks-ai"
# The same three settings in every Codex profile here, so the request Codex
# sends is the one the list's run checks; each is off for lanes that refuse it
# or cannot run it. Reasoning summaries: some LiteLLM releases hand the
# setting to a lane as a reasoning_effort object (1.102 does), which the lanes
# tried refused.
model_reasoning_summary = "none"
# Web search: a tool OpenAI's servers run, which LiteLLM passes on to a lane
# as web_search_options.
web_search = "disabled"

[features]
# Sub-agents: Codex sends their tools as a namespace, which LiteLLM 1.98 and
# later pass on as plain functions; with them on, a turn failed both through
# LiteLLM and on a lane called directly.
multi_agent = false

[model_providers.fireworks-ai]
name = "Fireworks AI"
base_url = "https://api.fireworks.ai/inference/v1"
wire_api = "responses"
env_key = "FIREWORKS_AI_API_KEY"
