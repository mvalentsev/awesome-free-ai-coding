# Codex CLI on HPC-AI Model APIs's free lane — generated from registry.yaml, do not
# edit by hand.
# HPC-AI Model APIs's own page sets Codex CLI up on this lane,
# https://www.hpc-ai.com/doc/docs/Model-APIs/Integration/Codex/, and every run
# of the list reads it back and asks the lane's Responses route again; only a
# key can run a turn there. Needs Codex CLI 0.134 or later; the file goes
# where Codex keeps its config, ~/.codex unless CODEX_HOME says otherwise:
#
#   cp configs/codex/hpc-ai.config.toml ~/.codex/
#   codex -p hpc-ai
#
# The key comes from $HPC_AI_API_KEY, the variable free-llm.env.example
# exports; get one at https://www.hpc-ai.com/models-console/api-key. With
# $HPC_AI_API_KEY unset or empty, Codex stops before it sends anything, so no
# other key of yours reaches the lane. The default prefers an unfunded,
# undated id; what the free part covers and every id are on the row's page,
# https://mvalentsev.github.io/awesome-free-ai-coding/providers/hpc-ai/ —
# codex -p hpc-ai -m <id> takes another.
model = "zai-org/glm-5.3-flash"
model_provider = "hpc-ai"
# The same three settings in every Codex profile here, so the request Codex
# sends is the one the list's run checks; each is off for lanes that refuse it
# or cannot run it. Reasoning summaries: some LiteLLM releases hand the
# setting to a lane as a reasoning_effort object (1.102 does), which the lanes
# tried refused.
model_reasoning_summary = "none"
# Web search: a tool OpenAI's servers run, which LiteLLM passes on to a lane
# as web_search_options.
web_search = "disabled"

[features]
# Sub-agents: Codex sends their tools as a namespace, which LiteLLM 1.98 and
# later pass on as plain functions; with them on, a turn failed both through
# LiteLLM and on a lane called directly.
multi_agent = false

[model_providers.hpc-ai]
name = "HPC-AI Model APIs"
base_url = "https://api.hpc-ai.com/inference/v1"
wire_api = "responses"
env_key = "HPC_AI_API_KEY"
