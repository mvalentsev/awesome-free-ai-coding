# Codex CLI on Token Harbor's free lane — generated from registry.yaml, do not
# edit by hand.
# Token Harbor's own page sets Codex CLI up on this lane,
# https://tokenharbor.ai/docs/integrations/codex, and every run of the list
# reads it back and asks the lane's Responses route again; only a key can run
# a turn there. Needs Codex CLI 0.134 or later; the file goes where Codex
# keeps its config, ~/.codex unless CODEX_HOME says otherwise:
#
#   cp configs/codex/token-harbor.config.toml ~/.codex/
#   codex -p token-harbor
#
# The key comes from $TOKEN_HARBOR_API_KEY, the variable free-llm.env.example
# exports; get one at https://tokenharbor.ai/dashboard/api-keys. With
# $TOKEN_HARBOR_API_KEY unset or empty, Codex stops before it sends anything,
# so no other key of yours reaches the lane. The model is the first free id
# the row lists; the quota and every free id are on the row's page,
# https://mvalentsev.github.io/awesome-free-ai-coding/providers/token-harbor/
# — codex -p token-harbor -m <id> takes another.
model = "deepseek-v4.1-flash:free"
model_provider = "token-harbor"
# The same three settings in every Codex profile here, so the request Codex
# sends is the one the list's run checks; each is off for lanes that refuse it
# or cannot run it. Reasoning summaries: some LiteLLM releases hand the
# setting to a lane as a reasoning_effort object (1.102 does), which the lanes
# tried refused.
model_reasoning_summary = "none"
# Web search: a tool OpenAI's servers run, which LiteLLM passes on to a lane
# as web_search_options.
web_search = "disabled"

[features]
# Sub-agents: Codex sends their tools as a namespace, which LiteLLM 1.98 and
# later pass on as plain functions; with them on, a turn failed both through
# LiteLLM and on a lane called directly.
multi_agent = false

[model_providers.token-harbor]
name = "Token Harbor"
base_url = "https://tokenharbor.ai/v1"
wire_api = "responses"
env_key = "TOKEN_HARBOR_API_KEY"
