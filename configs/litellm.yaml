# Free LLM providers as a LiteLLM proxy config — generated from
# registry.yaml, do not edit by hand.
# Run: litellm --config litellm.yaml --host 127.0.0.1
# The proxy listens on 0.0.0.0 unless --host says otherwise, and this file
# sets no master_key, so without that flag anyone on your network can spend
# the keys it reads from the environment (see free-llm.env.example).
# Entries marked `api_key: none` need no account at all.
#
# Or ask for a group instead of a model: free/strong or free/nokey pool
# every lane of that tier, and a call falls back down that order when a
# lane runs out of quota or has no key set here — set only the keys you
# have, and a lane without one is skipped.
# Left out: Kilo Code — its keyless lane answers only a call with no Authorization header, and LiteLLM sends one on every call.
# Left out: VLM Run Gateway — its keyless lane answers only a call with no Authorization header, and LiteLLM sends one on every call.
# Left out: OVHcloud AI Endpoints — its keyless lane answers only a call with no Authorization header, and LiteLLM sends one on every call.
