# Domains the scout must never propose (and reviewers rejected for cause).
# Matching is by domain suffix: "llm7.io" also blocks api.llm7.io.
#
# A cause is something about the service that no new offer changes: reverse
# engineering, pooled accounts, spoofed clients, hostility to agents, a product
# that is gone. "Nothing free today" is not one — that verdict goes to
# watchlist.yaml, which expires and gets looked at again. BYOK-only tools used
# to be filed here, and Cline sat on this list for two months as one while its
# own provider was handing out free models (moved 2026-09-14, with aider,
# Roomote and Puter going to the watchlist the same day).
- domain: gonka-api.org
  reason: hostile to AI agents — /for-agents page carries prompt-injection instructing
    secret exfiltration and referral spam; do not list, do not fetch
- domain: omniroute.online
  reason: self-hosted BYOK router (localhost endpoint, no bundled credits or hosted
    free tier); ships client-identity spoofing for proprietary CLI channels, so its
    free-access claims are not evidence of official free tiers. Since 2026-09 the
    site reads "OmniRoute has joined Cheaper Inference" and offers
    cheaperinference.com as the hosted route — a prepaid marketplace ("Fund from
    $5") selling "discounted AI models" at 30-60% off and asking providers to
    "turn unused inference capacity into revenue", with no free lane (read
    2026-09-14)
- domain: g4f.space
  reason: gpt4free-style pooled/reverse-engineered access to paid models, not an
    official free tier
- domain: g4f.dev
  reason: >-
    Where g4f.space redirects now — gpt4free's own site under a new name, and
    it states the case for the verdict above itself: "Free & Unlimited Next
    Generation AI Access", "No paywalls, no rate limits, no hidden fees. Get
    full access to premium AI capabilities completely free, forever" (read
    2026-09-14).
- domain: api.airforce
  reason: >-
    Sells what its upstream forbids selling. Its model list prices Midjourney
    actions — mj_imagine, mj_blend, mj_describe, mj_pan, mj_high_variation — and
    its structured data advertises "Free Claude API access" and "Free
    Midjourney", while Midjourney's help center says "With a few rare exceptions
    that are explicitly granted, Midjourney does not provide an API, nor provide
    third-party apps or scripts, and automating interactions with Midjourney
    service is strictly prohibited according to our Terms of Service". Automated
    resale of subscription accounts is the pooled-account case (read
    2026-09-16).
- domain: theoldllm.vercel.app
  reason: frontier-model access via browser-automation token harvesting — unofficial,
    unstable, likely ToS-violating
- domain: tokenrouter.me
  reason: >-
    Gone, and a look-alike while it lasted: the domain resolves nothing (no
    address on the apex, NXDOMAIN on www and api, 2026-09-16), and archived
    copies of 2026-07-31 show a flat-plan gateway under the name of the
    tokenrouter.com row this list carries, with terms of service whose sections
    are empty and support through Telegram alone. Kept here for the phindai.org
    reason — a reader could take it for the vendor it imitates.

- domain: router-for.me
  reason: >-
    CLIProxyAPI (github.com/router-for-me/CLIProxyAPI, docs at help.router-for.me)
    re-exposes the session of a paid subscription as a local OpenAI or Anthropic
    endpoint, and pools accounts on top: its README lists "OpenAI Codex support
    (GPT models) via OAuth login", "Claude Code support via OAuth login" and
    "Multiple accounts with round-robin load balancing (Gemini, OpenAI, Claude,
    Grok)". That is the client-identity pattern omniroute.online is here for.
    The same README's sponsor table carries account sellers, CyberPay among
    them: "We support business cooperation for selling GPT, Gemini, Claude, and
    Codex accounts, relay platforms, and other related services" (read
    2026-09-16).
- domain: voideditor.com
  reason: >-
    The product has stopped: github.com/voideditor/void was archived after its
    last push on 2026-06-02, and it was BYOK-only by design before that — the
    home page still sells it as "Void doesn't send your messages through a
    private backend like Cursor or Windsurf. Cut out the middleman and connect
    directly", so there was never a backend that could bundle model usage, and
    there is nobody left to add one.
- domain: roocode.com
  reason: >-
    The product is gone. docs.roocode.com (now roocodeinc.github.io/Roo-Code)
    opens with "The Roo Code Extension was shut down on May 15th",
    github.com/RooCodeInc/Roo-Code is archived, api.roocode.com answers "Roo
    Code Cloud is shutting down ... unused account balances are being refunded
    automatically", and every path on roocode.com redirects to roomote.dev, the
    team's cloud agent, which has a watchlist verdict of its own. The shutdown
    notice sends users to Zoo Code, the community fork, watchlisted the same
    day (2026-09-14). Kilo Code, an earlier fork, is listed because it ships
    model usage of its own.
- domain: chatanywhere.tech
  reason: >-
    Its own README (chatanywhere/GPT_API_free, 40k stars) admits the method in
    writing: against claude-sonnet-4-6 and claude-sonnet-4-5-20250929 it says
    "现在使用的为Claude code的逆向或官方逆向的渠道" — the channel in use is a REVERSE
    ENGINEERED Claude Code channel — and against gpt-image-2-ca, "CA 版的Image为
    逆向模型". The same file calls the endpoint a "转发Host", a forwarding host,
    and prices what it forwards at "最低官方1-2折", a tenth to a fifth of list.
    A free lane of 10,000 points a day over gpt-4o and gpt-5 sits on the same
    relay. Reverse-engineered access to a paid product is the g4f case, stated
    by the operator rather than inferred.
- domain: chatanywhere.org
  reason: >-
    The second forwarding host named in the same README, for use outside
    mainland China. Same service as chatanywhere.tech.
- domain: supxh.xin
  reason: >-
    肖恩AI, a new-api relay ("api中转" in its own status) that resells other
    services' free lanes under prefixes of its own: its public pricing catalog
    lists zen/big-pickle and zen/mimo-v2.5 (opencode Zen's free models),
    kilo/kilo-auto (Kilo's free router), nousfree/laguna-s-2.1 and six more ids
    of Nous Portal's free plan, and yingweida/ ids copied from NVIDIA's trial
    catalog, beside gem2api/gemini-3.5-flash — the naming of wrappers that turn
    gemini.google.com sessions into an API — and a daily check-in that hands out
    flagship models. Free allowances meant for one developer resold to strangers
    are the key sharing CONTRIBUTING excludes (read 2026-09-16).
- domain: toter.me
  reason: >-
    The API host 肖恩AI publishes for itself (speed.toter.me). Same service as
    supxh.xin.
- domain: phindai.org
  reason: >-
    An unofficial clone trading on a real vendor's name: the page titles itself
    "Phind AI: Search Engine for Developers" and answers its own FAQ with "Is
    Phind search engine free to use ... It provides a completely free version
    for all developers", while the actual Phind is phind.com, which is
    unaffiliated and answers 403 to everything. gpt4free ships it as a keyless
    backend, which is what it is — a free frontend over somebody else's paid
    model, in the g4f.space shape. Blocked rather than watchlisted because the
    risk here is a reader taking it for the vendor it imitates.
- domain: yqcloud.top
  reason: >-
    AIchatOS2, an anonymous Chinese chat frontend serving proprietary models
    with no account, no terms and no vendor behind it; gpt4free calls its
    backend directly as api.binjie.fun. Reverse-engineered access to a paid
    product, which is the standing reason on this list.
- domain: binjie.fun
  reason: >-
    The API host behind yqcloud.top's AIchatOS2 frontend — same verdict, listed
    separately because the adapter that uses it names this domain and not the
    other one.
- domain: continue.dev
  reason: >-
    The product is gone: continue.dev now serves one page, "Continue has joined
    Cursor … Continue was acquired by Cursor", continue.dev/pricing is a GitHub
    Pages 404 and hub.continue.dev no longer resolves (measured 2026-08-14, and
    again 2026-09-16). The hosted side went with it — Continue's own SDK still
    lists "Get free trial status for user" and "Get Stripe checkout URL for
    models add-on" — so there is no longer anyone to bundle model usage with
    the extension.
- domain: freemodel.dev
  reason: >-
    The operator describes the method in its own billing UI. freemodel.dev
    renders 44 characters without JavaScript, but its bundle carries the whole
    product copy, and the cost-breakdown panel explains a discount with "a
    discount we apply when ACCOUNT-POOL CHURN forces a re-write", beside a "High
    quality route" and a "Discounted route" billed at different multipliers of
    the standard rate. A pool of upstream accounts churning under a router is
    the g4f case, stated by the operator rather than inferred. Note what is NOT
    the reason: its three ids (gpt-5.6-luna, gpt-5.6-sol, gpt-5.6-terra) are
    OpenAI's ordinary public API ids, and its free plan is "$5 in API credits on
    signup" rather than free frontier access — a first read of this domain
    blocked it on that catalog alone, which was wrong twice over.

- domain: jiekou.ai
  reason: >-
    The operator says it sells reverse-engineered access. Its image FAQ: "Nano
    Banana Pro Light：逆向/破解版本，价格便宜，但稳定性较差" (Nano Banana Pro Light: a
    reverse-engineered/cracked version, cheap but less stable), and its API
    reference serves "Nano Banana Pro Reverse 文生图" at api.highwayapi.ai. It
    calls itself "一站式多模型 API 中转平台", a one-stop multi-model API relay (read
    2026-09-16).
- domain: highwayapi.ai
  reason: >-
    jiekou.ai's "国内直连" (mainland direct) base URL, and the host its "Nano Banana
    Pro Reverse" endpoints are served from — one operator, one verdict.
- domain: 9router.com
  reason: >-
    9Router (github.com/decolua/9router, 27k stars on 2026-09-05) is the
    router-for.me shape at scale: a local gateway whose README connects "Claude
    Code, Cursor, Antigravity, Copilot, Codex, Gemini, OpenCode, Cline,
    OpenClaw" to "40+ AI Providers" through an "OAuth Providers" section — Claude
    Code, Antigravity, Codex, GitHub, Cursor, Kimchi — that re-exposes a paid
    subscription's session as an API, plus "Multi-account - Round-robin between
    accounts per provider", which is account pooling. It issues no keys and
    bundles no model usage of its own; its "Free Providers" panel names Kiro,
    OpenCode Free and a $300 Vertex trial, all of which this registry already
    answers for. The tagline "Unlimited FREE AI coding" is the reverse-proxy
    line CONTRIBUTING excludes, stated by the operator.
- domain: agentrouter.org
  reason: >-
    A relay that accepts only traffic dressed as Claude Code. A plain client
    gets 401 "unauthorized client detected, contact support", the site answers
    an Alibaba Cloud WAF challenge to this network and to a GitHub runner alike,
    and OmniRoute — whose adapter has to reproduce "the Claude Code wire image
    (specific User-Agent, anthropic-beta flags, Stainless SDK headers)" to reach
    it — describes it as "an Anthropic-compatible relay that resells Claude and
    other models, often at lower prices than the direct Anthropic API", with a
    $100 signup credit ($200 by referral) on claude-opus-5 and gpt-5.6-sol. A
    gateway that only answers a spoofed first-party client is the
    omniroute.online and router-for.me pattern from the other side (read
    2026-09-14).
- domain: predibase.com
  reason: >-
    The product is gone: predibase.com and its pricing page now redirect to
    rubrik.com/products/rubrik-agent-cloud after Rubrik's acquisition, and the
    serverless inference host serving.app.predibase.com has no DNS answer on
    Google's resolver (2026-09-14). OmniRoute's feed still credits it with $25
    of trial credits.
- domain: aicodemirror.ai
  reason: >-
    A relay of subscription coding agents, by its own description and by its
    routes. Its sponsor blurb on CLIProxyAPI's README: "AICodeMirror 提供 Claude
    Code / Codex / Gemini 官方高稳定中转服务" (AICodeMirror provides high-stability relay
    service for Claude Code / Codex / Gemini). Its API host answers
    /api/codex/backend-api/codex with 401 AUTH_MISSING, where a made-up path
    answers 404 — the chatgpt.com/backend-api/codex route Codex uses when signed
    in with a ChatGPT subscription rather than an API key. Re-exposing
    subscription sessions is the router-for.me case (read 2026-09-16).
- domain: kenari.id
  reason: >-
    Listed here as a gateway for its :free ids from 2026-09-02, and taken off
    the list on 2026-09-16 when its own code showed where the metered capacity
    comes from. The one JavaScript bundle kenari.id serves carries the
    operator's admin screens: Codex supply limited "per kredensial codex-oauth"
    (per Codex OAuth credential), a limit reset that "akan memakai satu kredit
    reset dari akun ChatGPT ini" (will spend one reset credit of this ChatGPT
    account), X search "lewat pool token OAuth grok-plan" (through the pool of
    Grok plan OAuth tokens), "Kesehatan akun Google Flow" (Google Flow account
    health) with captcha solvers to add "saat Google menolak token" (for when
    Google rejects a token), and Exa search through a "pool proxy Webshare untuk
    memperbanyak kuota gratis per-IP" (a Webshare proxy pool to multiply the
    free per-IP quota). Its routing docs add that provider keys are rotated "to
    spread load and avoid limits" and that "Upstream provider identities are
    never exposed to the caller". Pooled consumer subscriptions, captcha solving
    and proxy pools against quotas, stated in the operator's own bundle — the
    freemodel.dev case (read 2026-09-16).
- domain: cheaperinference.com
  reason: >-
    Where omniroute.online now sends its hosted route, and a marketplace for
    capacity on other people's provider accounts. Its sellers page reads "If
    you hold capacity on Venice, Amazon Bedrock, Microsoft Foundry, Anthropic,
    Google AI Studio, OpenAI, DeepInfra or another network, you can supply it
    here. You keep your own account and your own credentials; we route requests
    to you and pay you a share of what they earn" (read 2026-09-16). Accounts
    rented out to strangers through a router are the key sharing CONTRIBUTING
    excludes.
- domain: jiekou.vip
  reason: >-
    The same 接口AI site under another domain — "接口AI 一站式多模型 API 中转平台" — which
    jiekou.ai's own docs send sign-ins to. Same verdict.
- domain: aicodemirror.com
  reason: >-
    Redirects to aicodemirror.ai's site and serves the same /api/claudecode
    route. Same verdict.
- domain: ps.air-outer.com
  reason: >-
    AgentRouter's backup domain, named in its own announcement; its /api/status
    answers "system_name":"Agent Router" with
    "server_address":"https://agentrouter.org". Only this host — the
    air-outer.com apex is an unrelated business.
- domain: aichatos68.com
  reason: >-
    Where AIchatOS, the yqcloud.top frontend, says it lives now: its notice file
    reads "最新网站存活（勿在公开平台分享） : https://chat18.aichatos68.com/" (latest live site
    — do not share publicly). Same verdict.
- domain: ai-router.dev
  reason: >-
    A gateway whose own price list names consumer subscriptions as the routes
    it sells. The machine-readable pricing at api.ai-router.dev/pricing.md
    (generated 2026-09-17) lists "Fuel Packages" billed against a balance —
    "Anthropic Claude Code Max Unlimited Duration" (platform anthropic),
    "ChatGPT Pro – Higher Stability" (platform openai), "Kiro Claude - High
    Cache" and "Grok Free" — beside day, week and month "ChatGPT-Compatible
    API" quota plans from $1.63. Claude Max and ChatGPT Pro are consumer
    subscriptions, Kiro is AWS's IDE and Grok Free is xAI's free chat tier; a
    relay that sells routes under those names is the aicodemirror.ai case,
    subscription sessions re-exposed as an API, stated in the operator's own
    catalog.
- domain: daoxe.com
  reason: >-
    A reseller gateway whose pricing data (daoxe.com/api/pricing, read
    2026-09-17) describes its own capacity groups as pooled consumer accounts
    and reverse-engineered clients: 自建Max号池 质量有保障 (a self-built pool of Max
    accounts, quality guaranteed), gpt pro号池 (a GPT Pro account pool), Gork
    官方heavy 号池分组 (a pool group of official Grok Heavy accounts), claude-kiro-逆向
    (Claude through a reverse-engineered Kiro client) and 官方Gemini中转 (an
    official Gemini relay). Its "free models" group is billed at 0.001× until
    a subscription makes it 0× (Daoxe-免费模型,订阅后会变成0倍率). Account pools and
    reverse engineering, in the operator's own labels — the kenari.id case.
- domain: freetheai.xyz
  reason: >-
    A Discord-key gateway whose model catalog names its sources by prefix, and
    one prefix is a client it cannot be: opc/big-pickle,
    opc/deepseek-v4-flash-free, opc/mimo-v2.5-free, opc/nemotron-3-ultra-free
    and opc/north-mini-code-free are opencode Zen's free ids, which OpenCode
    serves to its own client alone ("You cannot use the free tier in other
    harnesses", its maintainer on anomalyco/opencode#49590, 2026-09-18) and
    has refused to every other client since 2026-09-17. Serving them to
    anyone with a Discord key means presenting as OpenCode — the spoofed-client
    case omniroute.online is here for, in the operator's own model list
    (freetheai.xyz/models, read 2026-09-21).
- domain: freeaiapikey.com
  reason: >-
    States its supply in its own FAQ: "We aggregate unused credits, utilize
    volume tier discounts, and intelligently route requests across a massive
    pool of API keys", and when "an underlying provider key hits a rate limit
    or fails, we seamlessly and instantly retry your request on a healthy key".
    A pool of keys rotated past each key's rate limit is key sharing in the
    operator's own words, and its "Free plan for all users — 100k tokens/day,
    forever" runs on that pool (read 2026-09-21).
