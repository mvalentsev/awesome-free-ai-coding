# Domains the scout must never propose (and reviewers rejected for cause).
# Matching is by domain suffix: "puter.com" also blocks developer.puter.com.
- domain: puter.com
  reason: browser-only SDK (User-Pays model), not an HTTP endpoint usable from coding agents
- domain: cline.bot
  reason: free tool but BYOK-only, no bundled free model usage
- domain: aider.chat
  reason: free tool but BYOK-only, no bundled free model usage
- domain: gonka-api.org
  reason: hostile to AI agents — /for-agents page carries prompt-injection instructing
    secret exfiltration and referral spam; do not list, do not fetch
- domain: omniroute.online
  reason: self-hosted BYOK router (localhost endpoint, no bundled credits or hosted
    free tier); ships client-identity spoofing for proprietary CLI channels, so its
    free-access claims are not evidence of official free tiers
- domain: g4f.space
  reason: gpt4free-style pooled/reverse-engineered access to paid models, not an
    official free tier
- domain: api.airforce
  reason: pooled/reverse-engineered gateway of the g4f family — no official free offer
- domain: theoldllm.vercel.app
  reason: frontier-model access via browser-automation token harvesting — unofficial,
    unstable, likely ToS-violating
- domain: tokenrouter.me
  reason: shares the name of the listed tokenrouter.com gateway — registered
    2026-04-28, a week after that brand launched — and is pushed by the same posts
    that advertise the other one's free Kimi lane. Sells flat plans ($4.40 for 30
    days, "no request limits") over Kimi K2.7 Code and DeepSeek V4 Pro, whose
    metered price on the gateway it imitates is $0.93/$3.86 and $0.43/$0.87 per 1M
    tokens; a month of unmetered agent use cannot be licensed capacity at that
    price. No legal entity, terms of service headings with empty bodies,
    Telegram-only support, single Contabo VPS

- domain: router-for.me
  reason: >-
    CLIProxyAPI (github.com/router-for-me/CLIProxyAPI, docs at help.router-for.me)
    re-exposes the OAuth session of a paid CLI subscription — Codex, Claude Code,
    Antigravity, Grok, Kimi Code — as a local OpenAI/Anthropic endpoint. It issues
    no keys and bundles no model usage, so it fails the registry bar the same way
    cline and aider do, and its whole ecosystem sells that on the tagline "no API
    keys needed", which is the client-identity pattern omniroute.online is already
    here for. Its README is also the wrong place to read for leads — the provider
    table is five vendor blurbs behind affiliate links, and the sponsor block is
    fourteen relay resellers, several of them selling accounts outright ("Premium
    AI Accounts & Top-ups", ChatGPT at "10% of the official subscription price").
    Its own "More choices" section links OmniRoute
- domain: voideditor.com
  reason: >-
    BYOK-only by design, the zed.dev case — Void's own home page sells it as
    "Void doesn't send your messages through a private backend like Cursor or
    Windsurf. Cut out the middleman and connect directly", so there is no
    backend that could bundle model usage and the free editor grants none.
- domain: roocode.com
  reason: >-
    BYOK-only, the cline.bot case. Every path on roocode.com 301s to
    roomote.dev, the same team's cloud agent, whose split of the work is
    "Us. Hosting, networking, sandboxes, upgrades / You. Inference key" beside
    a 7-day trial and then $49/mo. Kilo Code, which forked Roo Code, is listed
    here instead precisely because it ships model usage of its own.
- domain: roomote.dev
  reason: >-
    Where roocode.com now points — model-agnostic BYOK by its own home page,
    so the free trial buys hosting and never inference.
- domain: chatanywhere.tech
  reason: >-
    Its own README (chatanywhere/GPT_API_free, 40k stars) admits the method in
    writing: against claude-sonnet-4-6 and claude-sonnet-4-5-20250929 it says
    "现在使用的为Claude code的逆向或官方逆向的渠道" — the channel in use is a REVERSE
    ENGINEERED Claude Code channel — and against gpt-image-2-ca, "CA 版的Image为
    逆向模型". The same file calls the endpoint a "转发Host", a forwarding host,
    and prices what it forwards at "最低官方1-2折", a tenth to a fifth of list.
    A free lane of 10,000 points a day over gpt-4o and gpt-5 sits on the same
    relay. Reverse-engineered access to a paid product is the g4f case, stated
    by the operator rather than inferred.
- domain: chatanywhere.org
  reason: >-
    The second forwarding host named in the same README, for use outside
    mainland China. Same service as chatanywhere.tech.
- domain: supxh.xin
  reason: >-
    肖恩AI, a new-api instance on a personal domain handing out claude-opus-4-5,
    claude-sonnet-4-5 and gemini-3.1-pro for a daily check-in and a referral
    bonus, alongside "无限额度全模型卡" — unlimited-quota all-model cards — sold with
    coupons. No legal entity, no terms of service, no claim of authorisation
    from any of the vendors whose flagship models it serves. The capacity it
    gives away is not capacity anyone licenses to give away. The operator named
    the instance himself: speed.toter.me/api/status answers
    "system_name":"api中转" — API relay — and points its documentation at
    docs.newapi.pro.
- domain: toter.me
  reason: >-
    The API host 肖恩AI publishes for itself (speed.toter.me). Same service as
    supxh.xin.
- domain: llm7.io
  reason: >-
    Moved here from the watchlist on 2026-08-14, and the record it replaces was
    wrong on the facts: LLM7 does have a recurring free lane. docs.llm7.io says
    "turbo models are fast models available to anonymous and free-token users",
    five of its 36 rows carry that tier, and docs.llm7.io/limits grants
    anonymous callers 500,000 tokens per 24 hours with no signup at all. The
    disqualifier is provenance, not absence. `owned_by` is empty on all 36 rows;
    the paid 31 include claude-opus-5, claude-fable-5, gpt-5.6-sol, grok-4.6 and
    gemini-omni-flash at a fraction of their list price; and llm7.io/terms,
    /privacy and /about all answer 404, so the service publishes no legal entity
    and no terms of any kind. Serving four vendors' flagship models with no
    stated provenance and no legal pages is the unofficial-gateway case that
    api.airforce and tokenrouter.me are already here for. Measured on 2026-08-30,
    because "a fraction of list price" is the kind of phrase that needs a number:
    against each vendor's own published price, LLM7 sells claude-sonnet-4-6 at
    $0.12/$0.45 where Anthropic lists $3/$15 (4% and 3%), claude-haiku-4-5 at 4%,
    gpt-5.4 at 6%/5%, gemini-3.7-flash at 8%, gpt-5.5 at 11%. A reseller's volume
    discount is 15-25% off; an order of magnitude is not a discount but a
    different supply. Its free lane is not the issue and never was — the six
    turbo ids are open-weight (gpt-oss, gemma4:31b, codestral, Llama-3.1-8B,
    mistral-Nemo, minimax-m2.7).

- domain: phindai.org
  reason: >-
    An unofficial clone trading on a real vendor's name: the page titles itself
    "Phind AI: Search Engine for Developers" and answers its own FAQ with "Is
    Phind search engine free to use ... It provides a completely free version
    for all developers", while the actual Phind is phind.com, which is
    unaffiliated and answers 403 to everything. gpt4free ships it as a keyless
    backend, which is what it is — a free frontend over somebody else's paid
    model, in the g4f.space shape. Blocked rather than watchlisted because the
    risk here is a reader taking it for the vendor it imitates.
- domain: yqcloud.top
  reason: >-
    AIchatOS2, an anonymous Chinese chat frontend serving proprietary models
    with no account, no terms and no vendor behind it; gpt4free calls its
    backend directly as api.binjie.fun. Reverse-engineered access to a paid
    product, which is the standing reason on this list.
- domain: binjie.fun
  reason: >-
    The API host behind yqcloud.top's AIchatOS2 frontend — same verdict, listed
    separately because the adapter that uses it names this domain and not the
    other one.
- domain: continue.dev
  reason: >-
    The product is gone: continue.dev now serves one page, "Continue has joined
    Cursor … Continue was acquired by Cursor", continue.dev/pricing is a GitHub
    Pages 404 and hub.continue.dev no longer resolves (measured 2026-08-14).
    The open-source extension "remains freely available" and was BYOK-only
    anyway, the cline.bot case, so nothing here bundles model usage.
- domain: hub.continue.dev
  reason: >-
    Continue's model hub, listed separately because third-party lists still
    link it — the host stopped resolving when Cursor absorbed the company.
- domain: freemodel.dev
  reason: >-
    The operator describes the method in its own billing UI. freemodel.dev
    renders 44 characters without JavaScript, but its bundle carries the whole
    product copy, and the cost-breakdown panel explains a discount with "a
    discount we apply when ACCOUNT-POOL CHURN forces a re-write", beside a "High
    quality route" and a "Discounted route" billed at different multipliers of
    the standard rate. A pool of upstream accounts churning under a router is
    the g4f case, stated by the operator rather than inferred. Note what is NOT
    the reason: its three ids (gpt-5.6-luna, gpt-5.6-sol, gpt-5.6-terra) are
    OpenAI's ordinary public API ids, and its free plan is "$5 in API credits on
    signup" rather than free frontier access — a first read of this domain
    blocked it on that catalog alone, which was wrong twice over.

- domain: jiekou.ai
  reason: >-
    Reached through the models.dev digest on 2026-09-05 (1/61 rows at cost 0,
    xiaomimimo/mimo-v2-flash — which the vendor's own keyless catalog at
    api.jiekou.ai/openai/models prices at 1000/3000 in its units). The home page
    calls the service "一站式多模型 API 中转平台", a one-stop multi-model API relay,
    and its pricing page sorts every row under two labels of its own: 官方资源
    (official resource, 49 rows) and 低价专区 (low-price zone, 19 rows). In the
    low-price zone claude-opus-4-8-r, claude-opus-4-7-r and claude-opus-4-6-r are
    $1/$5 per 1M against the $5/$25 the same page prints for the official rows
    (20%), claude-sonnet-4-6-r is $0.6/$3 against $3/$15 (20%), and the -dd
    variants sit at 55%. A reseller's discount is 15-25% off; a fifth of list,
    sold under a label that separates it from the vendor's official supply, is
    the different-supply case llm7.io is here for — stated by the operator. The
    free question never arose: the catalog prices three chat rows at 0
    (qwen/qwen3.8-27b, qwen/qwen3.5-plus, slow-mock) while the pricing page
    prices Qwen3.5-Plus at $0.4/$2.4, and the quickstart's signup voucher —
    "我们为新用户提供了一些信用额度的代金券" — carries no figure.
- domain: highwayapi.ai
  reason: >-
    The "国内直连" (mainland direct) base URL jiekou.ai names on its own home page
    — one operator, one verdict.
