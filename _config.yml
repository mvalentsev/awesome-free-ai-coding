# GitHub Pages builds this repository with Jekyll. The root is index.html,
# rendered from the registry by `freetier-render` — the README is written for
# GitHub's own Markdown renderer, and kramdown serves it with its hero as raw
# text and every folded cell unfolded, so it is excluded here rather than
# published half-rendered. This file names the site so jekyll-seo-tag can write
# canonical URLs and jekyll-sitemap a sitemap, gives every generated provider
# page the theme's layout, and keeps the source tree off the site.
title: awesome-free-ai-coding
description: "Legal free LLM APIs & coding agents — self-updating, probe-verified twice a week. Free tiers, no-card trials, free models, one page per provider."
url: https://mvalentsev.github.io
baseurl: /awesome-free-ai-coding
theme: jekyll-theme-primer
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-optional-front-matter
  - jekyll-relative-links
# Every page's preview card, where a page names none of its own: a link to a
# provider's or a model's page shared anywhere — or read by an answer engine —
# carries the list's picture rather than none. _layouts/default.html is the
# page these are served in.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/social-preview.png
exclude:
  # Served as index.html instead — see the note at the top of this file.
  - README.md
  # Written for GitHub's renderer like the root README: the connection table,
  # rendered under configs/ on GitHub, would arrive here with every folded note
  # unfolded. The site carries the same table on its own page.
  - configs/README.md
  - src
  - tests
  - templates
  - pyproject.toml
  - uv.lock
  - assets/README.md
  - .github
  - .gitignore
