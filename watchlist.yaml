  - domains: [featherless.ai]
    name: Featherless AI
    checked_on: '2026-09-14'
    reason: >-
      Subscriptions only: "Chat For roleplay, stories and long conversations
      ... $25 /month" and "Developer For coding agents and API traffic ... $50
      /credits per month", over a catalog of 40,000+ open models every row of
