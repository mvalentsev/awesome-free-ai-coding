    reopen_if: >-
      StepFun's pricing page shows a zero-priced model or a signup grant.

  - domains: [zyloai.net]
    name: Zylo AI
    checked_on: '2026-09-14'
    reason: >-
      The Basic plan is real — "$0 /mo 7.2k req/day · 10/min 200k Daily Tokens
