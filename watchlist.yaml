    reopen_if: >-
      An official DeepSeek page states a free grant or a zero-priced model.

  - domains: [iflow.cn]
    name: iFlow
    checked_on: '2026-09-16'
    reason: >-
      iFlow stopped its developer service on 2026-04-17. Its own forum
