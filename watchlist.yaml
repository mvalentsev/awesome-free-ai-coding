    name: xKiro
    checked_on: '2026-09-16'
    reason: >-
      api.xkiro.com/v1/models now marks 42 rows access_tier free at 0/0, no
      longer only Qwen: openai/gpt-5.3-codex-spark, mistralai/mistral-large-2512
