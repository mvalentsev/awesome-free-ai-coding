# Services checked and NOT listed — because they have no free tier a developer
# can reach today, not because anything is wrong with them.
#
# This is the third state the registry needed. `blocklist.yaml` is a verdict on
# the service and is meant to be permanent, so putting a legitimate vendor there
# buries it on the day it opens a free lane. Leaving a lead in neither file is
# what used to happen: nothing recorded the decision, the scout re-proposed it
# every run, and a reviewer re-derived the same "no" from scratch.
#
# A record here is a verdict on the OFFER, on a DATE. `checked_on` is what makes
# it different from a quiet blocklist: after WATCH_RECHECK_DAYS (90) it stops
# suppressing proposals and is reported as due for a re-check, so a tier that
# opened in the meantime gets noticed within a quarter. `reopen_if` names the
# evidence that would change the answer, so the next look starts from the last
# one instead of from zero.
#
# Domains are suffix-matched: "siliconflow.com" also covers api.siliconflow.com.
# Delete a record to make the scout free to propose the service again.

watched:
  - domains: [modelscope.cn, modelscope.ai]
    name: ModelScope (Alibaba)
    checked_on: '2026-08-14'
    reason: >-
      The free tier is real and large — 2,000 API calls a day across a catalog
      whose keyless api-inference.modelscope.cn/v1/models lists 43 served ids,
      DeepSeek V4 Flash/Pro, Qwen3.5-397B, Qwen3-Coder, GLM-5.2, MiniMax M3 and
      Step-3.7-Flash among them. Two things keep it off the list. Registration
      binds an Alibaba Cloud account and requires real-name verification, which
      is not something a developer outside mainland China can simply complete,
      so the offer is not directly usable the way this list means it. And there
      is nothing to probe — every docs page under /docs/model-service is a
      client-rendered shell (the served HTML carries 15 characters of text and
      an empty window.__detail_data__), while the models endpoint publishes no
      prices and no quota, so a probe there could only ever confirm that ids
      exist. A row this list cannot verify is a row it will not carry.
    reopen_if: >-
      ModelScope publishes a server-rendered quota page, or the free tier
      becomes reachable without real-name verification.

  - domains: [siliconflow.com, siliconflow.cn]
    name: SiliconFlow
    checked_on: '2026-08-14'
    reason: >-
      siliconflow.com/pricing is server-rendered and states the whole offer in
      one sentence — "postpaid billing—plus $1 in free credits to get you
      started". One dollar is a sign-up courtesy, not a free tier: the same
      reasoning that kept Nous Portal off this list. No model in the pricing
      tables is priced at zero, and the catalog endpoint answers 401 on both
      the .com and .cn hosts, so there is no free lane to point an agent at.
    reopen_if: >-
      A zero-priced model appears in the served catalog, or the free grant
      becomes a recurring quota rather than a one-off dollar.

  - domains: [nebius.com]
    name: Nebius Token Factory
    checked_on: '2026-08-14'
    reason: >-
      Rebranded from Nebius AI Studio — studio.nebius.com now redirects to
      tokenfactory.nebius.com. Its served pages carry no free tier at all: the
      pricing page prices storage and GPU-hours, the product page offers a
      "Start free" button and a sales contact, and the docs quickstart carries
      no grant, quota or trial. The catalog answers 401 without a key. Nothing
      here is a free offer a developer can name, so there is nothing to list.
    reopen_if: >-
      Token Factory publishes a signup grant or a free model lane on a served
      page.

  - domains: [nscale.com]
    name: Nscale
    checked_on: '2026-08-14'
    reason: >-
      The serverless inference API exists — inference.api.nscale.com/v1/models
      answers 401 rather than 404 — but the company's public site is now
      enterprise AI-cloud marketing with no pricing page (/pricing and
      /serverless both 404) and the documentation redirects to a login wall.
      There is no public page stating a free tier and no public page a probe
      could read, which is two independent reasons the row cannot exist.
    reopen_if: >-
      Nscale puts its serverless pricing or free credits back on a public,
      server-rendered page.

  - domains: [glhf.chat]
    name: glhf.chat
    checked_on: '2026-08-14'
    reason: >-
      The service does not answer. Both the site and its OpenAI-compatible
      endpoint return Cloudflare 522 "Connection timed out" — the origin is
      down, not the edge. An offer that cannot be reached cannot be verified,
      and a dead host is not evidence of a withdrawn tier either, which is why
      this is a watch and not a block.
    reopen_if: >-
      The origin answers again and its free lane is still there.

  - domains: [x.ai]
    name: xAI (Grok API)
    checked_on: '2026-08-14'
    reason: >-
      docs.x.ai prices every surface — text, Agent, TTS, STT, Imagine — and
      names no free tier or signup grant. x.ai/api answers HTTP 403 to every
      non-browser client, so even a stated offer could not be probed from here.
      The free API credits xAI ran in exchange for data sharing are not on any
      current page.
    reopen_if: >-
      A free tier or signup grant appears on a page that answers a plain HTTP
      client.

  - domains: [deepseek.com]
    name: DeepSeek
    checked_on: '2026-08-14'
    reason: >-
      Re-checked against api-docs.deepseek.com/quick_start/pricing, which is
      server-rendered and prices every model — $0.14 in / $0.28 out per 1M for
      the cache-miss tier, no zero row anywhere. This confirms the 2026-07-27
      removal: the 5M-token signup grant that used to be cited for DeepSeek was
      only ever reported by third parties and appears on no official page.
    reopen_if: >-
      An official DeepSeek page states a free grant or a zero-priced model.

  - domains: [agnes-ai.com]
    name: Agnes AI
    checked_on: '2026-08-14'
    reason: >-
      The site titles itself "Free Omni-Modal AI API" and then publishes
      nothing to back it — /pricing and /docs both 404, the pages are a
      client-rendered shell, and api.agnes-ai.com answers its own JSON 404 for
      /v1/models, so no catalog, no prices and no quota are public. A free
      claim with no page behind it is exactly what this list refuses to repeat.
    reopen_if: >-
      Public docs or a keyless catalog appear that state what is free and on
      what terms.

  - domains: [iflow.cn]
    name: iFlow
    checked_on: '2026-08-14'
    reason: >-
      Reached through the models.dev digest, which lists iflowcn with 14 of 14
      models at cost 0 — and a rival list that says iFlow shut down on
      2026-04-17, which is wrong. The service is alive: iflow.cn serves 67k
      characters of a Chinese consumer assistant, and apis.iflow.cn answers 405
      Method Not Allowed on /v1/chat/completions, so the route exists and only
      rejects a GET. What is missing is anything to verify. The catalog path
      /v1/models answers 404, platform.iflow.cn is a client-rendered shell
      (3446 characters of text inside 35262 bytes, all of it login config), and
      the only prices served anywhere are the consumer packages on iflow.cn,
      whose free column lists its features at "0 次/月" and disabled. A row this
      list cannot probe is a row it will not carry — the ModelScope bar.
    reopen_if: >-
      apis.iflow.cn serves a model catalog, or iFlow publishes a server-rendered
      page stating the free quota of its developer platform.

  - domains: [supermaven.com]
    name: Supermaven
    checked_on: '2026-08-14'
    reason: >-
      The free tier is real, recurring and cardless — supermaven.com/pricing is
      server-rendered and states "Free Tier $0 /month", "Fast, high-quality code
      suggestions", "Works with large codebases". It is completions and nothing
      else: the same page marks "Adapts to your coding style", the 1M-token
      context, the largest model and the "$5/month in Supermaven Chat credits"
      as Pro only, and there is no API. So the free plan hands a developer no
      model access to point a coding tool at, which is the bar that keeps
      BYOK-only tools off this list. Copilot Free is listed and this is not for
      exactly that reason: its free plan carries chat and agent use, not only
      inline completions.
    reopen_if: >-
      Supermaven's free plan gains chat credits, agent use, or an API endpoint.

  - domains: [aws.amazon.com]
    name: Amazon Q Developer
    checked_on: '2026-08-14'
    reason: >-
      The free tier is real — aws.amazon.com/q/developer/pricing is
      server-rendered and says "Amazon Q Developer offers a perpetual Free Tier
      with monthly limits", 50 agentic requests a month, "Access latest Claude
      models", "Use in the IDE or CLI", with IDE limits reserved for AWS Builder
      ID users. It is not listed because it is the predecessor of an entry this
      list already carries. AWS has folded both of its surfaces into Kiro: the
      product page runs an End of support notice reading "On April 30, 2027, AWS
      will discontinue support for Amazon Q Developer IDE plugins. For
      capabilities similar to Amazon Q Developer IDE plugins, explore Kiro", and
      the user guide is blunter about the other half — "The Q CLI has become the
      Kiro CLI." Kiro is listed with its own perpetual free tier, so carrying
      both would be one offer twice, the second copy with a shutdown date on it.
      Recorded because the pricing page still advertises the tier and keeps
      reaching us through curated feeds.
    reopen_if: >-
      Amazon Q Developer outlives the 2027-04-30 plugin end-of-support as a
      product with a free tier of its own rather than as a route into Kiro.

  - domains: [novita.ai]
    name: Novita AI
    checked_on: '2026-08-14'
    reason: >-
      Listed here from 2026-07-19 until 2026-08-14, when a hand check found the
      free lane gone with no announcement anywhere. novita.ai/pricing carries
      102 published prices and not one of them is zero; the two models this
      entry named as free are now billed — inclusionai/ling-3.0-flash at
      $0.06/$0.18 per Mt and mindai/macaron-v1-venti at 15000/45000 micro-units
      — and novita.ai/models marks every one of its 102 rows "isFree": false in
      its own page data. The keyless catalog does carry eleven rows at
      input_token_price_per_m 0, but they publish no pricing object, four are
      plainly internal (ai_infer_test_1/2/3, bunny) and the rest 404 on their
      own model pages, so that is an unpriced shelf and not an offer. What is
      left is the ~$0.5 signup credit, and a trial is not a tier. The old probe
      passed through all of this because it anchored on the id
      "ling-3.0-flash" plus the word "free" — both still on the page — instead
      of on the price beside the id.
    reopen_if: >-
      novita.ai/pricing shows a zero price, or a model on novita.ai/models
      carries "isFree": true.

  - domains: [aionlabs.ai]
    name: Aion Labs
    checked_on: '2026-08-14'
    reason: >-
      Re-checked 2026-08-14, and the first reason recorded here was wrong: this
      is an LLM API vendor, not the email-agent company of the same name. The
      site sells "Powerful AI Models & Agents" with "access via an
      OpenAI-compatible API"; api.aionlabs.ai/v1/models answers
      keyless with four models — aion-2.0, aion-3.0, aion-3.0-mini and
      aion-rp-llama-3.1-8b, roleplay and storytelling variants of DeepSeek and
      GLM. The verdict is unchanged for a different reason: every one of the
      four publishes a price and none of them is zero, the cheapest being
      aion-3.0-mini at $0.0000007 per prompt token. Note the catalog answers
      {"models": [...]} rather than the OpenAI {"data": [...]} shape, so an
      api-models probe here would need that read first.
    reopen_if: >-
      A zero-priced row appears in the api.aionlabs.ai catalog.

  - domains: [tokenrouter.io]
    name: TokenRouter.io
    checked_on: '2026-08-05'
    reason: >-
      Legitimate commercial routing layer, and the third unrelated service to
      carry the TokenRouter name — check the TLD before acting on any lead
      here, because .com is the listed PaleBlueDot gateway and .me is
      blocklisted. Its quickstart says "You need at least one AI provider key
      to route requests" and sends you to platform.openai.com, i.e. BYOK-only
      with no bundled model usage, and its "Free tier available" covers the
      routing plan, not tokens — the pricing page's own words are "Pay only for
      routing and insights". Not blocklisted precisely because nothing is wrong
      with it.
    reopen_if: >-
      TokenRouter.io starts bundling model usage rather than routing only.

  - domains: [morphllm.com]
    name: Morph (fast-apply)
    checked_on: '2026-07-22'
    reason: >-
      The one entry here with a free tier that is probably real — roughly 200
      requests a month on the fast-apply model — and no way to verify it:
      morphllm.com/pricing is client-rendered, so the figure appears in no
      served HTML. Kept out on the verification rule alone, not on the offer.
    reopen_if: >-
      Morph's docs or pricing become server-rendered with the quota in them.

  - domains: [nousresearch.com]
    name: Nous Portal
    checked_on: '2026-07-22'
    reason: >-
      The free tier is $0.10 a month of credit — decorative rather than usable,
      and far below what the third-party claim of "50 RPM free" suggested.
      The date stays at the July reading on purpose: re-asked on 2026-08-14
      after a list credited it with a no-card free tier, portal.nousresearch.com
      answered 429 "Vercel Security Checkpoint" to every client tried, home page
      and pricing alike, so nothing there could be re-read either way.
    reopen_if: >-
      The monthly grant becomes large enough to run an agent session on, on a
      page the portal serves to an ordinary HTTP client.

  - domains: [arcee.ai]
    name: Arcee (Trinity)
    checked_on: '2026-07-22'
    reason: >-
      Direct API grants are application-gated, and an application with a
      selection step is not an offer a developer can simply use — the same bar
      that keeps TokenRouter's builder programme out of its entry. The :free
      Trinity variants that are open live on OpenRouter, which this list
      already covers.
    reopen_if: >-
      Arcee opens direct API credits without an application.

  - domains: [ofox.ai]
    name: OfoxAI
    checked_on: '2026-08-14'
    reason: >-
      An OpenAI-compatible gateway with a keyless catalog — api.ofox.ai/v1/models
      answers 130 rows unauthenticated — and every text model in it is priced.
      Its eight GLM rows start at glm-4.7-flashx for $0.072 per M input, and
      there is no glm-4.7-flash in the catalog at all, so the third-party claim
      that it serves GLM-4.7-Flash at $0 per M is about a model it does not
      carry. The fourteen rows that do read prompt 0 and completion 0 are video,
      image and transcription models whose real price sits in a per-second or
      per-image field beside them.
    reopen_if: >-
      A text model in api.ofox.ai/v1/models prices both prompt and completion at
      zero.

  - domains: [warp.dev]
    name: Warp
    checked_on: '2026-08-14'
    reason: >-
      The Free plan is real and costs nothing, but it bundles no model usage:
      warp.dev/pricing lists it as "Reload credits at pay-as-you-go rates" and
      "Bring your own AI inference", while the 1,500 included credits begin on
      the $20 Build plan. Third-party lists still credit the free plan with 150
      then 75 AI credits a month; that allowance is no longer on the vendor's
      own page. A terminal that asks for your own key is the cline and aider
      case, not the opencode one.
    reopen_if: >-
      The Free plan on warp.dev/pricing lists an included monthly credit or
      token allowance instead of pay-as-you-go reloads.

  - domains: [platform.xiaomimimo.com, mimo.mi.com]
    name: Xiaomi MiMo (API platform)
    checked_on: '2026-08-14'
    reason: >-
      A separate surface from the archived MiMo Code entry, and also paid. The
      keyless platform.xiaomimimo.com/api/v1/models publishes five models and
      prices all of them, the cheapest being mimo-v2.5 at $0.14 in / $0.28 out
      per M. The Token Plan is a paid subscription — the site advertises MiMo
      Claw at 14.9 yuan a month as "stackable with Token Plan" — and both
      mimo.mi.com/pricing and platform.xiaomimimo.com/pricing are client-
      rendered shells serving 29 characters of text, so no probe could read an
      offer there even if one appeared.
    reopen_if: >-
      The keyless catalog carries a zero-priced row, or a free tier appears in
      server-rendered HTML.

  - domains: [atlassian.com]
    name: Atlassian Rovo Dev
    checked_on: '2026-08-14'
    reason: >-
      The free beta that third-party lists still quote at 5M tokens a day is
      over. atlassian.com/software/rovo-dev now says Rovo Dev is generally
      available and that "limited monthly Rovo Dev credits per developer will be
      gradually rolled out to customers with a Standard, Premium, or Enterprise
      Cloud plan of Jira" — an allowance that rides on a paid subscription,
      which is the same reason Copilot's paid tiers are not entries here.
    reopen_if: >-
      Atlassian publishes a Rovo Dev allowance reachable without a paid Jira
      Cloud plan.

  - domains: [forgecode.dev]
    name: ForgeCode
    checked_on: '2026-08-14'
    reason: >-
      A coding harness that brings no model usage of its own. Its installation
      docs say ForgeCode "needs access to at least one AI model", walk you
      through entering an API key, and recommend reusing a ChatGPT Plus or
      Claude subscription you already pay for; forgecode.dev/pricing is a 404.
      The "10K tokens a day via OpenRouter" credited to it elsewhere is
      OpenRouter's own free tier reached with the reader's key, and OpenRouter
      is already an entry here.
    reopen_if: >-
      ForgeCode Services bundles model usage on a plan that costs nothing.

  - domains: [deepinfra.com]
    name: DeepInfra
    checked_on: '2026-08-14'
    reason: >-
      deepinfra.com/pricing serves 17,500 characters of text and not one of them
      is "free" or "credit" — the whole page is per-token rates for language
      models and per-execution-time rates for everything else. The signup credit
      it is still credited with elsewhere is not on the vendor's own page.
    reopen_if: >-
      DeepInfra publishes a signup credit or a free model on its pricing page.

  - domains: [fireworks.ai]
    name: Fireworks AI
    checked_on: '2026-08-14'
    reason: >-
      fireworks.ai/pricing offers "Get started with $1 in free credits" against
      serverless inference with "postpaid billing" — a grant that sits on top of
      a billing relationship rather than instead of one, and a fortieth of what
      the trials listed here carry ($10 at Upstage). Every model on the
      page is priced per token.
    reopen_if: >-
      Fireworks publishes a recurring free tier, or a signup grant reachable
      without postpaid billing that is worth an agent session.

  - domains: [baseten.co]
    name: Baseten
    checked_on: '2026-08-14'
    reason: >-
      Its pricing FAQ says only that "new Baseten accounts come with credits so
      you can get to know the UI and experiment with deployments for free" — no
      figure, anywhere on the page. There is nothing a probe could anchor on,
      and a sentence with no number in it reads the same the day the credit
      stops being granted.
    reopen_if: >-
      Baseten publishes the size of the signup credit.

  - domains: [hyperbolic.ai, hyperbolic.xyz]
    name: Hyperbolic
    checked_on: '2026-08-14'
    reason: >-
      The business is GPU rental now, not a free inference lane —
      hyperbolic.ai/pricing is a 404 and the home page sells on-demand GPUs
      "billed by the hour" and reserved capacity at discounted rates. The $1
      inference credit third-party lists still quote is not on any page it
      serves. Both domains are recorded because the lists still point at the
      older one: hyperbolic.xyz/pricing and app.hyperbolic.xyz redirect to the
      .ai host (measured 2026-08-14), so a verdict filed under one name would
      have left the other free to be re-proposed.
    reopen_if: >-
      Hyperbolic publishes an inference free tier or signup credit again.

  - domains: [inference.net]
    name: Inference.net
    checked_on: '2026-08-14'
    reason: >-
      The $0 plan is a gateway and observability tier, not free inference: it
      lists "1M included Gateway requests, 1M tracing spans, 14-day data
      retention, 1 seat, 30 req/min" and is priced "$0 + usage", so the tokens
      themselves are still bought. The only opening credit on the page, $50, is
      attached to the $250-a-month Growth plan.
    reopen_if: >-
      The $0 plan includes inference credits or a zero-priced model rather than
      routing quota.

  - domains: [chutes.ai]
    name: Chutes
    checked_on: '2026-08-14'
    reason: >-
      Re-confirms the 2026-08-06 reading, which was never written down. Its
      pricing page states the model outright — "Pay per token. No subscription,
      no minimum, no markup" — and the cheapest thing on it is a $10-a-month
      Plus plan bundling a daily request quota. The free-trial FAQ entry is a
      collapsed client-rendered answer with nothing behind it in the HTML.
    reopen_if: >-
      Chutes publishes a zero-priced model or a no-card trial quota.

  - domains: [nlpcloud.com]
    name: NLP Cloud
    checked_on: '2026-08-14'
    reason: >-
      Unprobeable from here rather than judged: nlpcloud.com/pricing.html
      answers HTTP 403 to a request carrying a normal browser User-Agent, so
      there is no served page to read the offer off — the x.ai case. Nothing is
      claimed about the offer itself.
    reopen_if: >-
      The pricing page answers a plain HTTP request, and what it then says about
      a free tier.

  - domains: [tabnine.com]
    name: Tabnine
    checked_on: '2026-08-14'
    reason: >-
      tabnine.com/pricing serves 187 characters of text — a client-rendered
      shell with the plan table assembled in the browser. Whatever its free tier
      is today, there is nothing in the HTML for a probe to anchor on, which is
      the same reason Morph is not listed.
    reopen_if: >-
      Tabnine's pricing page carries its plan limits in server-rendered HTML.

  - domains: [jetbrains.com]
    name: JetBrains AI Assistant
    checked_on: '2026-08-14'
    reason: >-
      jetbrains.com/ai serves 71 characters of text and the buy page is the
      same, so the AI Free quota cannot be read off anything this project can
      fetch. Recorded as unreadable rather than as absent.
    reopen_if: >-
      JetBrains publishes the AI Free quota in server-rendered HTML.

  - domains: [bolt.new]
    name: Bolt.new
    checked_on: '2026-08-14'
    reason: >-
      A real bundled free tier — bolt.new/pricing gives the $0 plan "300K tokens
      daily limit, 1M tokens per month" — spent inside a hosted app builder. It
      buys generations in Bolt's own workspace, not model access a developer can
      point at a repository they already have, and there is no client to install
      and no endpoint to call. That is the line this list draws: an entry has to
      hand you model access you can aim at your own code.
    reopen_if: >-
      Bolt ships a CLI or an API whose free plan includes the model usage.

  - domains: [lovable.dev]
    name: Lovable
    checked_on: '2026-08-14'
    reason: >-
      Same hosted-builder shape as Bolt, and thinner: its own FAQ says "Paid
      plans have access to a credit balance" and describes the free plan only as
      having "grants included in the free plan", with no figure in the served
      HTML.
    reopen_if: >-
      Lovable publishes a free-plan allowance in server-rendered HTML and a way
      to spend it outside its own workspace.

  - domains: [v0.dev, v0.app]
    name: v0 (Vercel)
    checked_on: '2026-08-14'
    reason: >-
      The closest of the three to qualifying and still out. Its free plan is
      "$5 of included monthly credits" with a "7 message/day limit", and it does
      have an API — api.v0.dev/v1, keyed by V0_API_KEY — but that API is
      /chats/:id/messages, a product endpoint for driving v0's own builder, not
      a model endpoint. The credit buys v0 messages, not tokens you can spend on
      your own codebase. Vercel's model credits that can be spent that way are
      already listed here as Vercel AI Gateway.
    reopen_if: >-
      The v0 free plan's credits become spendable through an OpenAI-compatible
      or otherwise general model endpoint.

  - domains: [longcat.chat]
    name: LongCat API Platform (Meituan)
    checked_on: '2026-08-14'
    reason: >-
      Listed here from 2026-07-22 for a recurring 100K free tokens a day, and
      delisted because that quota is published nowhere on Meituan's own site
      today. Two dated entries in its change log explain what happened.
      "Version: 2026-05-29 — LongCat Model Service Sunset" retired the whole
      Flash line the free quota applied to: "Effective May 29, 2026, the
      platform will retire the following 6 models: LongCat-Flash-Chat,
      LongCat-Flash-Thinking, LongCat-Flash-Thinking-2601, LongCat-Flash-Lite,
      LongCat-Flash-Omni-2603, LongCat-Flash-Chat-2602-Exp". Then "Version:
      2026-06-30 — LongCat-2.0 Release & Billing Now Available" turned on Token
      Packs and pay-as-you-go. The API is alive and good, but it is now priced:
      "Pay-As-You-Go currently supports LongCat-2.0" at $0.75 uncached input and
      $2.95 output per 1M tokens, and its prerequisites end with "Top up your
      balance at Billing → Recharge". The words "free" and 免费 appear nowhere in
      Quick Start, Token Pack, API Pay-As-You-Go, the FAQ, the API overview or
      the pricing page — the one "free" in the change log is about chatting on
      the consumer LongCat Chat app, not the API. The platform page itself is a
      21-character client-rendered shell. Complimentary credits exist as a
      concept ("If you also have complimentary credits, those are consumed
      before your paid balance") but nothing states that a new account is
      granted any, how many, or how often. Our probe never noticed, because it
      anchored on the endpoint path and the model name rather than on the
      offer — novita's failure, again. Where our figure came from, for whoever
      is tempted to re-add it: free daily quotas at LongCat belong to the era
      before GA. The Chinese change log grants one on 2026-04-20, to the
      PREVIEW model — "初始额度5,000,000 Tokens/天 ... 每日最多可获得120,000,000
      Tokens" — and 赠送 appears nowhere in that log at all. The reference
      response for GET /openai/v1/models in the docs now lists exactly one
      entry, "id": "LongCat-2.0", "owned_by": "LongCat".
    reopen_if: >-
      LongCat publishes a free daily token quota, or a stated signup grant, on
      a server-rendered page of its own.
  - domains: [anyapi.ai]
    name: AnyAPI
    checked_on: '2026-08-14'
    reason: >-
      The free plan is real, published and server-rendered: anyapi.ai/pricing
      reads "Free / Getting started / $0 / mo", "ANY Tokens: 100K / day",
      "Core features: All free and basic models", "No credit card required",
      and docs.anyapi.ai repeats it — "$0/month 100 000 ₳nyTokens per day for
      free / Basic and free models access" and "Free: Your 100K daily
      ₳nytokens reset every 24 hours". What stops it is that nothing says what
      the quota buys. The plan cards count ₳nyTokens; the FAQ on the same
      pricing page defines a different unit and never reconciles them — "A
      credit is our universal currency for API usage across all 400+ models.
      One credit equals roughly 1,000 tokens for most models, but premium
      models like GPT-4 or Claude 3 Opus consume more credits per token". At
      1,000 tokens a unit the free plan would be 100M model tokens a day, and
      the $19.90 plan 100 billion a month, which cannot be what is meant. Which
      models count as "free and basic" is published nowhere, api.anyapi.ai/v1/models
      answers 401, and there is no per-model price page — so there is nothing
      to probe that ties a model to the tier, and no arithmetic to tell a real
      gateway from a resold pool. The pricing copy still headlines GPT-4 and
      Claude 3 Opus in 2026, which is its own answer about how current it is.
    reopen_if: >-
      AnyAPI publishes which models the free plan serves, or a keyless catalog,
      or defines its token unit against real model tokens.
  - domains: [ainative.studio]
    name: AINative Studio
    checked_on: '2026-08-14'
    reason: >-
      Carried elsewhere as "a recurring ~10M tokens/month free allocation (no
      card)". Its own pricing page says otherwise, twice on one screen: the
      heading "Hobbyist (free)" is followed by "Just getting started? Start the
      Hobbyist plan — 3-day free trial, then $5/mo", and the model table under
      it is titled "Hobbyist $5/mo and up ... Token usage billed per rates
      below" with a real price on every row (Qwen3 Coder 30B $0.04/$0.04, GPT
      OSS 120B $0.42/$0.90, Gemma 4 31B $0.99/$1.49, GLM-4.7 Preview
      $1.25/$2.75). So the free part is a three-day trial on a paid plan that
      also meters tokens, and the words "free tier", "10M" and "no credit card"
