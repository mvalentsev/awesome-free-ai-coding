      is 19 ids, and 14 of them — glm-5.3, kimi-k2.6, qwen-3.8-27b,
      gemma-4-26b, melotts, aura-2-en, nova-3, lucid-origin, phoenix-1.0 and
      the flux and whisper builds — are Cloudflare Workers AI's names, whose
