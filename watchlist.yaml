    reopen_if: >-
      The Community tier includes hosted inference or credits.

  - domains: [eurouter.ai]
    name: EUrouter
    checked_on: '2026-09-14'
    reason: >-
      An EU-compliance routing gateway whose Free plan prices the routing, not
