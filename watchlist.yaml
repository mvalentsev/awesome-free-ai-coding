      quickstart; no model id ending in -Free is served on any of the three.
      The rate-limit page talks about bursts and real-time capacity and never
      about a tier.
    reopen_if: >-
      Together publishes a free tier or a zero-priced model row, or a model id
      ending in -Free returns to its catalog.

  - domains: [perplexity.ai]
    name: Perplexity (Sonar API)
    checked_on: '2026-08-14'
    reason: >-
      Pay-per-use with no free allowance of its own. The word "free" does not
      occur in the served text of docs.perplexity.ai/getting-started/pricing,
      which prices Sonar at $1 in and $1 out per 1M tokens, search requests at
      $5 per 1000 and each tool per invocation; the page's only credit language
      is "Purchase API credits through AWS Marketplace". Credits bundled with a
      paid subscription, if any, would be a wallet behind a paywall rather than
      a free tier.
    reopen_if: >-
      Perplexity publishes an API allowance reachable without a paid
      subscription or a credit purchase.

  - domains: [replicate.com]
    name: Replicate
    checked_on: '2026-08-14'
    reason: >-
      replicate.com/pricing says "You only pay for what you use on Replicate"
      and prices every model by hardware-second or by token. The only "free" in
      the served text is the "Try for free" sign-in button in the header — no
      signup grant, no recurring allowance, no zero-priced model.
    reopen_if: >-
      Replicate publishes a signup grant or a recurring allowance rather than
      pay-as-you-go only.

  - domains: [modal.com]
    name: Modal
    checked_on: '2026-08-14'
    reason: >-
      Recurring and real — modal.com/pricing gives the $0/month Starter plan
      "$30 / month free credits" — but the credits buy compute, not inference.
      They are spent on containers and GPU-seconds running a model the developer
      deploys themselves, so there is no vendor in the transaction, nothing to
      probe behind an OpenAI-compatible URL and nothing to put in a Models
      column. It fails this list's bar on shape, the way a free Colab GPU does.
    reopen_if: >-
      Modal serves models of its own behind an OpenAI-compatible endpoint on a
      free allowance.

  - domains: [zenmux.ai]
    name: ZenMux
    checked_on: '2026-08-14'
    reason: >-
      The scout proposed this on 2026-08-14 and the probe passed, because
      zenmux.ai/api/v1/models prices six of its 156 rows at 0 —
      z-ai/glm-4.6v-flash-free, z-ai/glm-4.7-flash-free,
      deepseek/deepseek-v4-flash-free, inclusionai/ling-3.0-tiny and the two
      sapiens-ai/agnes-*-flash. A zero in a price column is not a lane you can
      reach: ZenMux's own subscription guide says of its $0 Free tier "The Free
      plan can only be used in Studio Chat on the web (roughly 5 conversations
      per 5 hours) and provides no API Request access", and the other billing
      system, Pay As You Go, is documented as "prepaid balance + pay-as-you-consume"
      with a $5 minimum top-up. Neither published path hands a developer an API
      key that calls those six ids without paying, so the free price is a
      discount inside a paid plan rather than a free tier.
    reopen_if: >-
      ZenMux documents that a zero-balance Pay As You Go key may call the
      -free ids, or the Free Builder tier gains API access.

  - domains: [xfyun.cn, xf-yun.com, xinghuo.xfyun.cn]
    name: iFlytek Spark (讯飞星火)
    checked_on: '2026-08-14'
    reason: >-
      The free model is real and the vendor says so on its own page: the HTTP
      docs describe Lite as "轻量级大语言模型 ... 具有更高的响应速度，支持免费使用"
      (a lightweight model, faster to respond, free to use), give the model id
      as `lite` and publish an OpenAI-compatible base url,
      https://spark-api-open.xf-yun.com/v1/. An anchor exists too, contrary to
      an earlier note here: 「具有更高的响应速度,支持免费使用」 sits in the Lite column of
      that page's version table in served HTML, glued to the id by
      「lite指向Lite版本」 beside it. What blocks the listing is reachability. No
      served page states a quota, a QPS or a duration for the Lite lane; the
      figures that exist — the 0元/百万tokens cell and the 200,000-token free
      package — appear only after JavaScript runs on xinghuo.xfyun.cn/sparkapi,
      and that same table conditions the package on 个人认证 or 企业认证, real-name
      verification. Whether `lite` itself is reachable without it is stated
      nowhere, and console.xfyun.cn renders 「加载中……」 and nothing else. That is
      the ModelScope case: a real free model this list cannot yet tell a
      developer how to reach.
    reopen_if: >-
      iFlytek states, on a served page, what the Lite lane costs and whether it
      needs 实名认证 — or the registration gate turns out not to need a
      mainland-China identity.

  - domains: [intern-ai.org.cn]
    name: Intern AI (书生 / InternLM, Shanghai AI Lab)
    checked_on: '2026-08-14'
    reason: >-
      The docs are readable after all, at internlm.intern-ai.org.cn/doc/docs/ —
      and the trailing slash is load-bearing, since the same path without it
      answers a 168-byte stub, which is what an earlier check here mistook for
      an empty domain. 197KB of served HTML confirms the base url
      chat.intern-ai.org.cn/api/v1, the four model ids, an Anthropic-format
      endpoint with a Claude Code guide, and a quota: 「API 流控限制：默认每用户
      每分钟限制30次」, thirty requests a minute rather than the ten a feed credits
      it with. What is missing is the offer itself. Across all nine doc pages
      the words 免费, 收费, 付费, 计费 and 价格 do not occur once: the service states
      no price, free or otherwise, so there is nothing to verify and nothing an
      anchor could hang on — 每分钟限制30次 is a rate limit that would read exactly
      the same the day it started billing.
    reopen_if: >-
      Intern AI states a price, or states that the API is free, on a served
      page.

  - domains: [dxnt.com]
    name: DX TOKEN
    checked_on: '2026-08-14'
    reason: >-
      Blocklisted earlier the same day on a reason that turned out to be wrong,
      and moved here rather than left standing. The claim was that its model ids
      anonymise the upstream they route to; dxnt.com/byok refutes it in its own
      words — "在控制台添加自有端点，用 {身份码}/{模型名} 调用。请求直接转发到你的供应商" — so the
      opaque four-character prefixes (ot5k/, its0/, ry5b/) are per-user identity
      codes for a customer's OWN endpoint, not a hidden supplier, and dxnt's own
      catalog names its models plainly as dxnt/qwen3.5-397b-a17b and the like.
      Its free route is four models at multiplier 0, mostly open-weight
      (nemotron-3-nano, llama-3.2-90b-vision, step-3.7-flash,
      sensenova-6.7-flash-lite), which is capacity anyone may host. What is left
      is not enough to block and not enough to list: the service calls itself a
      中转网关, a relay gateway, discloses no sourcing for the proprietary Chinese
      models it relays, and its footer links 服务条款 and 隐私政策 both resolve to a
      page containing neither, so there are no terms and no legal entity behind
      any of it.
    reopen_if: >-
      DX TOKEN publishes terms of service and a legal entity, or states where
      the models on its own dxnt/ prefix are licensed from.

  # Eight services that had no verdict here until xtekky/gpt4free was read
  # whole on 2026-08-14 (that read's own verdict is in sources.yaml). Every
  # one of them is legitimate; none of them has a free lane this list can
  # hand a developer today.

  - domains: [giga.chat, gigachat.devices.sberbank.ru, developers.sber.ru]
    name: GigaChat API (Sber)
    checked_on: '2026-08-14'
    reason: >-
      The largest free grant this repository has ever verified, and it still
      cannot be listed. Sber's own tariff page, updated 22 July 2026, says
      "В рамках Freemium-режима пользователи получают 365 000 000 бесплатных
      токенов для генерации текста" and breaks it down in a served table that
      glues each figure to the ids it applies to — 250 000 000 for Lite
      (GigaChat, GigaChat-2), 40 000 000 for Pro, 25 000 000 for Max,
      50 000 000 for GigaChat-3-Ultra — each valid 12 months, "Генерация текста
      выполняется в одном потоке", one stream at a time. Every new account gets
      the Freemium tariff by default and no card is asked for; only the paid
      packages take one. The endpoint is OpenAI-shaped and printed in the docs:
      base_url "https://api.giga.chat/v1", model "GigaChat". What blocks it is
      the transport. Both api.giga.chat and gigachat.devices.sberbank.ru serve
      certificates issued by "C = RU, O = The Ministry of Digital Development
      and Communications, CN = Russian Trusted Sub CA", chaining to a Russian
      Trusted Root CA that is in no mainstream trust store — measured here, not
      inferred: httpx fails both with CERTIFICATE_VERIFY_FAILED, and Sber
      documents the fix as installing the НУЦ Минцифры certificates at
      application or OS level. That is a change to the reader's machine, and to
      what their machine trusts for every other TLS connection, which is not a
      thing a row in a table can ask for in a footnote. Registration is a second
      gate on top: the console takes a Сбер ID and issues scope
      GIGACHAT_API_PERS.
    reopen_if: >-
      api.giga.chat serves a certificate from a publicly trusted CA, or Sber
      documents an endpoint that does. At that point only the Сбер ID gate is
      left, which is the SenseNova case and lives inside an entry, and the
      anchor is already measured: the 365 000 000 sentence and the per-tier
      table sit in served HTML with ordinary spaces.

  - domains: [you.com]
    name: You.com API
    checked_on: '2026-08-14'
    reason: >-
      A genuinely free, genuinely keyless lane that is the wrong kind of thing.
      you.com/docs offers "Try it free — no API key required": point any
      MCP-enabled tool at https://api.you.com/mcp?profile=free and "use
      you-search with no signup or credentials", capped at 100 queries a day,
      with new accounts getting $100 in credits for the rest. It names Claude
      Code, Cursor, VS Code and JetBrains by name, so it is aimed squarely at
      the readers of this list — but what it hands them is web search, not model
      access, and CONTRIBUTING asks an entry for a lane you can point a coding
      agent's model at.
    reopen_if: >-
      You.com opens a free lane on an inference endpoint rather than on search
      and retrieval — or this list decides that free agent tooling belongs in a
      section of its own, in which case this is the first row in it.

  - domains: [blackbox.ai]
    name: Blackbox AI
    checked_on: '2026-08-14'
    reason: >-
      Two tiers on its own pricing page and neither is free: "PAY AS YOU GO",
      metered per token against prepaid credits, and "ENTERPRISE", "Your model,
      your keys, your contract". The $0 in the first column is the monthly
      commitment — "$0 / MO COMMIT ... Committed spend None — pay for what you
      use" — not a token allowance, which is the same shape this repository
      rejected for AIHubMix's neighbours and for ZenMux. The 300+ model table
      below prices every row.
    reopen_if: >-
      Blackbox publishes a free tier with a token or request allowance, on the
      pricing page rather than in an extension listing.

  - domains: [orcarouter.ai]
    name: OrcaRouter
    checked_on: '2026-08-14'
    reason: >-
      A router whose free plan is free routing, not free tokens: "Hacker Free
      Forever. Zero markup on all tokens ... 3 API keys · 0% token markup", and
      in its own words "You pay each provider's published rate; OrcaRouter adds
      $0 per token". Its structured pricing data agrees — an Offer named "Free"
      at price 0 with the description "Pay provider cost only". That is the
      standing rule here that a zero in a price column is not a lane you can
      reach: nothing is granted, the $0 is the fee for the routing.
    reopen_if: >-
      OrcaRouter grants credits or a free model lane of its own, rather than
      charging nothing to pass a paid one through.

  - domains: [aibadgr.com]
    name: Badgr
    checked_on: '2026-08-14'
    reason: >-
      Not an inference free tier — GPU capacity by the hour, advertised as
      "Available now Badgr 4090". The pricing page's $0 is a subscription that
      does not exist: "Pay as you go $0 /month + usage: every account gets the
      same features", "no setup fee, no monthly minimum". A wallet, and not even
      a wallet with anything in it.
    reopen_if: >-
      Badgr starts granting inference credits, or serves models rather than
      renting the cards they run on.

  - domains: [whiterabbitneo.com, deephat.ai]
    name: Deep Hat (formerly WhiteRabbitNeo, Kindo)
    checked_on: '2026-08-14'
    reason: >-
      Renamed since gpt4free wrote its adapter — whiterabbitneo.com now
      redirects to deephat.ai, "Deep Hat, formerly Whiterabbitneo, is Kindo's
      uncensored cybersecurity model". The four "Use it for free" and "Try it
      for free" buttons on that page all lead to the hosted app; the API route
      on the same page is "Get a demo". The weights are on Hugging Face, which
      is a licence rather than a free tier, and is not an endpoint anyone can
      point an agent at without hosting it themselves.
    reopen_if: >-
      Deep Hat publishes an API with a free lane, rather than a hosted app and
      open weights.

  - domains: [phind.com]
    name: Phind
    checked_on: '2026-08-14'
    reason: >-
      Nothing could be verified, and that is the finding. www.phind.com and
      www.phind.com/plans both answer HTTP 403 to every client tried here,
      including one sending a full browser header set — so no probe on this
      domain can read an offer, and this list would be repeating a claim rather
      than checking one. Worth the record because the name is otherwise a
      plausible candidate: a developer-facing answer engine with an editor
      extension is exactly the shape CONTRIBUTING admits when the free usage is
      bundled. Note also that gpt4free does not call phind.com at all — its
      adapter points at phindai.org, an unrelated clone, now on the blocklist.
    reopen_if: >-
      Phind serves its plans page to a non-browser client, or publishes free
      terms anywhere a probe can reach.

  - domains: [yupp.ai]
    name: Yupp
    checked_on: '2026-08-14'
    reason: >-
      Unreadable rather than absent: yupp.ai answers HTTP 429 to every request
      made here, browser headers included, and the docs.yupp.ai its adapter
      implies does not resolve at all. gpt4free's own class for it carries
      working = False and needs cloudscraper, which is the same verdict from the
      other side. Nothing states an offer, so there is nothing to verify.
    reopen_if: >-
      Yupp serves a plan or docs page to an ordinary HTTP client, and that page
      describes an API rather than a chat product.

  # The four names nejib1/Free-LLM carried that nothing here had a verdict on,
  # read 2026-08-14. The list files all four as free — Coze and Venice under
  # "permanent free tier", Cerebrium and Friendli as $30 and $10 signup credits.
  - domains: [venice.ai]
    name: Venice.ai
    checked_on: '2026-08-14'
    reason: >-
      The Free plan does carry an "API Access" checkmark, and the docs say what
      it is worth: "You can create a key before funding the account, but model
      requests will not succeed until the account can consume DIEM, bundled
      credits, or USD". DIEM comes from staking VVV and bundled credits from a
      subscription, which venice.ai/pricing states from the other side — "Pro
      subscribers get free-tier API access". So the free lane is a key that
      cannot call anything, and every row of the docs price table is quoted in
      dollars per million tokens.
    reopen_if: >-
      An unfunded Venice account gets a callable allowance, or a model appears
      priced at zero for the Free plan.

  - domains: [friendli.ai]
    name: FriendliAI
    checked_on: '2026-08-14'
    reason: >-
      friendli.ai/pricing prices everything it serves: per-token rates for the
      Model APIs — GLM-5.2 at $1.4 in / $4.4 out per 1M, gemma-4-31B-it at
      $0.14 / $0.4 — and per-second GPU time for dedicated endpoints, $2.9 an
      hour on an A100 up to $12.0 on a B300. The word "free" does not occur in
      the served text of that page at all, and its own "How do I get started?"
      answer is sign up, generate a key, make a request, with no grant in
      between. The $10 signup credit third-party lists quote is on none of it.
    reopen_if: >-
      FriendliAI states a signup grant or a zero-priced model on a page it
      serves.

  - domains: [cerebrium.ai]
    name: Cerebrium
    checked_on: '2026-08-14'
    reason: >-
      The wrong shape twice over. It is a serverless platform you deploy your
      own container to rather than a model endpoint you can aim an agent at,
      which is the BYOK case CONTRIBUTING excludes; and the free thing on
      cerebrium.ai/pricing is the Hobby plan's allowance of seats and slots —
      "Up to 3 deployed apps", 3 seats, 1 day of log retention — while the
      compute underneath is billed throughout, the page's own worked example
      putting 500,000 requests at "roughly $309" a month. No $30 credit appears
      anywhere on it.
    reopen_if: >-
      Cerebrium starts serving hosted models on a free allowance rather than
      hosting yours.

  - domains: [coze.com]
    name: Coze
    checked_on: '2026-08-14'
    reason: >-
      Nothing here can be read, so nothing can be verified: www.coze.com
      answers every path tried with the same 43,754-byte SPA shell — the API
      overview, the pricing guide, /robots.txt and /sitemap.xml alike — and the
      document API behind that shell replies {"code":700012006,"msg":"Login
      verification is invalid"}. No quota, model list or terms are served
      anywhere a probe could anchor. The shape is doubtful as well — its own
      og:title calls it an "AI Agent Intelligent Office Platform" and its API
      is /v3/chat against bots built inside its workspace, which is the
      hosted-app-builder case CONTRIBUTING excludes — but the verification rule
      alone settles it, the way it settled Morph LLM.
    reopen_if: >-
      Coze serves its developer docs or pricing to an ordinary HTTP client, and
      that page describes model access rather than bot invocations.

  - domains: [publicai.co]
    name: Public AI Inference Utility
    checked_on: '2026-09-02'
    reason: >-
      The word "Free" here names a rate-limit tier, not free inference.
      platform.publicai.co/plans puts four tiers side by side and the Free one
      buys "100 requests/minute — default when you create an API key"; the same
      page keeps the money in a separate paragraph — "Rate limits and token
      usage billing are separate ... Token usage is billed against wallet
      credits", with "New accounts receive starter credits when they first use
      billing features" and no figure attached to those credits anywhere on the
      portal. The catalog agrees: every one of the eleven models on
      platform.publicai.co/models carries a price (swiss-ai/apertus-v1.5-8b at
      $0.10/$0.20 per 1M, up to $0.82/$2.92 for the 70b), and none is listed at
      zero. An unnamed starter credit is the SiliconFlow reasoning again: a
      sign-up courtesy is not a free tier. The nonprofit itself is exactly what
      it says — a public-AI gateway fronting Apertus, SEA-LION, Olmo, Bielik and
      EuroLLM, and this list already carries SEA-LION from its own vendor.
      Re-read 2026-09-02: the plans page still says "every new API key starts
      on the free tier" and "new accounts receive starter credits when they
      first use billing features" with no figure attached, the models page
      still prices every row ($0.10 to $2.92 per 1M), and api.publicai.co/v1/models
      answers 401 to a keyless GET, so the catalog itself cannot be read
      without an account.
    reopen_if: >-
      The portal names the starter credit, or platform.publicai.co/models
      lists a model at zero.

  - domains: [crof.ai, nahcrof.com]
    name: CrofAI
    checked_on: '2026-09-02'
    reason: >-
      A free account is not a free tier. crof.ai/home sells the on-ramp — "Get
      an API key — free account, no credit card required" — and crof.ai/pricing
      states the offer in one line: "Pay for what you use. Per-token pricing
      across every model we serve. No subscriptions, no minimums — only the
      tokens you actually burn." The catalog behind it, ai.nahcrof.com/v1/models,
      is public and prices all 23 models; not one is at zero (the cheapest row
      read on 2026-08-30 was $0.35 in / $0.80 out per 1M). Reached from
      OmniRoute's provider table, where it is filed under paid.
      Re-read 2026-09-02: still 23 rows and none at zero, the cheapest still
      $0.35 in / $0.80 out per 1M, and the only "free" on the pricing page is
      a JavaScript comment about the billing portal.
    reopen_if: >-
      A model priced at 0 appears in ai.nahcrof.com/v1/models, or the pricing
      page starts naming a recurring free allowance.

  - domains: [bluesminds.com]
    name: BluesMinds
    checked_on: '2026-08-30'
    reason: >-
      OmniRoute credits it with 22 free models and ~7M tokens a month; the
      vendor publishes nothing of the kind. www.bluesminds.com is an enterprise
      page whose only two calls to action are "Sign in" and "Request access",
      /pricing 404s, and there is no docs host to read. The one thing its API
      does say is what it runs on: api.bluesminds.com/v1/models answers
      {"error":{"message":"Invalid token ...","type":"new_api_error"}}, the
      error shape of the New API resale panel, which is the software a
      key-pooling gateway is usually built from. Nothing here is verifiable and
      the free claim is a third party's.
    reopen_if: >-
      BluesMinds publishes a pricing or docs page an ordinary HTTP client can
      read, and that page names a free allowance of its own.

  - domains: [bynara.id]
    name: Nara / NaraRouter
    checked_on: '2026-09-14'
    reason: >-
      The free plan is real now and published, and what it serves is the
      reason it stays here. The keyless router.bynara.id/api/plans reads
      "Free tier with a daily token quota. No card required", token_cap_daily
      7,000,000 at 15 requests a minute, over four models — agnes-2.5-flash,
      laguna-s-2.1, stepfun-3.7-flash and tencent-hy3-free — which are other
      vendors' free lanes: Agnes prices its Flash at zero itself, Laguna S 2.1
      is free on OpenRouter and Kilo, and Step 3.7 Flash on Kilo. The paid
      day passes beside it (Freemium at Rp 5,000 a day, FreeMium Max, FreeMium
      Ultra) sell glm-5.3-free, mimo-v2.5-free, qwen3.8-flash-free,
      deepseek-v4.1-flash-free and muse-spark-1.3-contributor-free — ids named
      for free lanes, sold by the day. OmniRoute also reports that a key
      requires linking Telegram. The 2026-08-30 reading here found no pricing
      and a 401 catalog; this one was prompted by OmniRoute citing the plans
      endpoint.
    reopen_if: >-
      Nara's free plan serves a model it hosts or licenses itself, rather than
      another gateway's free lane.

  - domains: [bytez.com]
    name: Bytez
    checked_on: '2026-09-16'
    reason: >-
      Readable now: docs.bytez.com/model-api/docs/billing.md lists "$0 / month -
      Get $1 in free credits", "Run open models up to 7B parameters" and
      "Credits refresh every 4 weeks" — a recurring dollar that reaches open
      models of 7B parameters or fewer. Whether an allowance that small, on
      models that small, belongs on the list is a scope question this list has
      not settled; it stays here until it is (2026-09-16).
    reopen_if: >-
      The free credits reach larger open models, or the list settles how small
      an allowance it carries.

  - domains: [liquid.ai]
    name: Liquid AI (LFM / LEAP)
    checked_on: '2026-08-30'
    reason: >-
      The wrong shape rather than the wrong price. Liquid's product is the LEAP
      edge platform — "Discover, specialize, and deploy models on any device" —
      whose models run on the phone or laptop you ship them to, not behind a
      hosted endpoint an agent can call: api.liquid.ai/v1/models does not exist
      (404 from the marketing app) and labs.liquid.ai serves no catalog either.
      A local runtime is out of scope here for the same reason Ollama's desktop
      build is, and the "keyless" row OmniRoute files for it names no endpoint.
    reopen_if: >-
      Liquid opens a hosted LFM API with a free lane a developer can call from
      outside its own SDK.

  # The five records below replace blocklist lines removed on 2026-08-30, after a
  # full re-audit of that file found their stated reason contradicted by the
