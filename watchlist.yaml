  - domains: [openai.com]
    name: OpenAI API (complimentary tokens for data sharing)
    checked_on: '2026-09-05'
    reason: >-
      Named by every list read on 2026-09-05, usually as "$50,000 in free
      credits". The pricing page (developers.openai.com/api/docs/pricing) prices
      every model per token, marks one row Free — omni-moderation-latest — and
      carries no signup credit and no free tier. The one free thing is the
      help-center article "Sharing feedback, evaluation and fine-tuning data,
      and API inputs and outputs with OpenAI", which answers 403 to this
      repository's fetches and, as quoted by the developer forum and the
      third-party guides that cite it, says some organizations may qualify for
      daily complimentary tokens on traffic shared with OpenAI, that
      eligibility is shown only inside the organization's data-sharing settings,
      that the tokens are usable only with a positive account balance, and that
      the shared prompts and outputs are used for training. An offer decided
      per account on a page no probe can read, unlocked by a prepaid balance
      and paid for with the prompts, is not a quota this list can publish.
    reopen_if: >-
      OpenAI states the eligibility rule and the daily amounts on a public page,
      or opens a free tier that needs no balance.

