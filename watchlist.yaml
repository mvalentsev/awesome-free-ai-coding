# Services checked and NOT listed — because they have no free tier a developer
# can reach today, not because anything is wrong with them.
#
# This is the third state the registry needed. `blocklist.yaml` is a verdict on
# the service and is meant to be permanent, so putting a legitimate vendor there
# buries it on the day it opens a free lane. Leaving a lead in neither file is
# what used to happen: nothing recorded the decision, the scout re-proposed it
# every run, and a reviewer re-derived the same "no" from scratch.
#
# A record here is a verdict on the OFFER, on a DATE. `checked_on` is what makes
# it different from a quiet blocklist: after WATCH_RECHECK_DAYS (90) it stops
# suppressing proposals and is reported as due for a re-check, so a tier that
# opened in the meantime gets noticed within a quarter. `reopen_if` names the
# evidence that would change the answer, so the next look starts from the last
# one instead of from zero.
#
# Domains are suffix-matched: "siliconflow.com" also covers api.siliconflow.com.
# Delete a record to make the scout free to propose the service again.

watched:
  - domains: [modelscope.cn, modelscope.ai]
    name: ModelScope (Alibaba)
    checked_on: '2026-08-14'
    reason: >-
      The free tier is real and large — 2,000 API calls a day across a catalog
      whose keyless api-inference.modelscope.cn/v1/models lists 43 served ids,
      DeepSeek V4 Flash/Pro, Qwen3.5-397B, Qwen3-Coder, GLM-5.2, MiniMax M3 and
      Step-3.7-Flash among them. Two things keep it off the list. Registration
      binds an Alibaba Cloud account and requires real-name verification, which
      is not something a developer outside mainland China can simply complete,
      so the offer is not directly usable the way this list means it. And there
      is nothing to probe — every docs page under /docs/model-service is a
      client-rendered shell (the served HTML carries 15 characters of text and
      an empty window.__detail_data__), while the models endpoint publishes no
      prices and no quota, so a probe there could only ever confirm that ids
      exist. A row this list cannot verify is a row it will not carry.
    reopen_if: >-
      ModelScope publishes a server-rendered quota page, or the free tier
      becomes reachable without real-name verification.

  - domains: [siliconflow.com, siliconflow.cn]
    name: SiliconFlow
    checked_on: '2026-08-14'
    reason: >-
      siliconflow.com/pricing is server-rendered and states the whole offer in
      one sentence — "postpaid billing—plus $1 in free credits to get you
      started". One dollar is a sign-up courtesy, not a free tier: the same
      reasoning that kept Nous Portal off this list. No model in the pricing
      tables is priced at zero, and the catalog endpoint answers 401 on both
      the .com and .cn hosts, so there is no free lane to point an agent at.
    reopen_if: >-
      A zero-priced model appears in the served catalog, or the free grant
      becomes a recurring quota rather than a one-off dollar.

  - domains: [nebius.com]
    name: Nebius Token Factory
    checked_on: '2026-08-14'
    reason: >-
      Rebranded from Nebius AI Studio — studio.nebius.com now redirects to
      tokenfactory.nebius.com. Its served pages carry no free tier at all: the
      pricing page prices storage and GPU-hours, the product page offers a
      "Start free" button and a sales contact, and the docs quickstart carries
      no grant, quota or trial. The catalog answers 401 without a key. Nothing
      here is a free offer a developer can name, so there is nothing to list.
    reopen_if: >-
      Token Factory publishes a signup grant or a free model lane on a served
      page.

  - domains: [nscale.com]
    name: Nscale
    checked_on: '2026-08-14'
    reason: >-
      The serverless inference API exists — inference.api.nscale.com/v1/models
      answers 401 rather than 404 — but the company's public site is now
      enterprise AI-cloud marketing with no pricing page (/pricing and
      /serverless both 404) and the documentation redirects to a login wall.
      There is no public page stating a free tier and no public page a probe
      could read, which is two independent reasons the row cannot exist.
    reopen_if: >-
      Nscale puts its serverless pricing or free credits back on a public,
      server-rendered page.

  - domains: [glhf.chat]
    name: glhf.chat
    checked_on: '2026-08-14'
    reason: >-
      The service does not answer. Both the site and its OpenAI-compatible
      endpoint return Cloudflare 522 "Connection timed out" — the origin is
      down, not the edge. An offer that cannot be reached cannot be verified,
      and a dead host is not evidence of a withdrawn tier either, which is why
      this is a watch and not a block.
    reopen_if: >-
      The origin answers again and its free lane is still there.

  - domains: [x.ai]
    name: xAI (Grok API)
    checked_on: '2026-08-14'
    reason: >-
      docs.x.ai prices every surface — text, Agent, TTS, STT, Imagine — and
      names no free tier or signup grant. x.ai/api answers HTTP 403 to every
      non-browser client, so even a stated offer could not be probed from here.
      The free API credits xAI ran in exchange for data sharing are not on any
      current page.
    reopen_if: >-
      A free tier or signup grant appears on a page that answers a plain HTTP
      client.

  - domains: [deepseek.com]
    name: DeepSeek
    checked_on: '2026-08-14'
    reason: >-
      Re-checked against api-docs.deepseek.com/quick_start/pricing, which is
      server-rendered and prices every model — $0.14 in / $0.28 out per 1M for
      the cache-miss tier, no zero row anywhere. This confirms the 2026-07-27
      removal: the 5M-token signup grant that used to be cited for DeepSeek was
      only ever reported by third parties and appears on no official page.
    reopen_if: >-
      An official DeepSeek page states a free grant or a zero-priced model.

  - domains: [agnes-ai.com]
    name: Agnes AI
    checked_on: '2026-08-14'
    reason: >-
      The site titles itself "Free Omni-Modal AI API" and then publishes
      nothing to back it — /pricing and /docs both 404, the pages are a
      client-rendered shell, and api.agnes-ai.com answers its own JSON 404 for
      /v1/models, so no catalog, no prices and no quota are public. A free
      claim with no page behind it is exactly what this list refuses to repeat.
    reopen_if: >-
      Public docs or a keyless catalog appear that state what is free and on
      what terms.

  - domains: [iflow.cn]
    name: iFlow
    checked_on: '2026-08-14'
    reason: >-
      Reached through the models.dev digest, which lists iflowcn with 14 of 14
      models at cost 0 — and a rival list that says iFlow shut down on
      2026-04-17, which is wrong. The service is alive: iflow.cn serves 67k
      characters of a Chinese consumer assistant, and apis.iflow.cn answers 405
      Method Not Allowed on /v1/chat/completions, so the route exists and only
      rejects a GET. What is missing is anything to verify. The catalog path
      /v1/models answers 404, platform.iflow.cn is a client-rendered shell
      (3446 characters of text inside 35262 bytes, all of it login config), and
      the only prices served anywhere are the consumer packages on iflow.cn,
      whose free column lists its features at "0 次/月" and disabled. A row this
      list cannot probe is a row it will not carry — the ModelScope bar.
    reopen_if: >-
      apis.iflow.cn serves a model catalog, or iFlow publishes a server-rendered
      page stating the free quota of its developer platform.

  - domains: [supermaven.com]
    name: Supermaven
    checked_on: '2026-08-14'
    reason: >-
      The free tier is real, recurring and cardless — supermaven.com/pricing is
      server-rendered and states "Free Tier $0 /month", "Fast, high-quality code
      suggestions", "Works with large codebases". It is completions and nothing
      else: the same page marks "Adapts to your coding style", the 1M-token
      context, the largest model and the "$5/month in Supermaven Chat credits"
      as Pro only, and there is no API. So the free plan hands a developer no
      model access to point a coding tool at, which is the bar that keeps
      BYOK-only tools off this list. Copilot Free is listed and this is not for
      exactly that reason: its free plan carries chat and agent use, not only
      inline completions.
    reopen_if: >-
      Supermaven's free plan gains chat credits, agent use, or an API endpoint.

  - domains: [aws.amazon.com]
    name: Amazon Q Developer
    checked_on: '2026-08-14'
    reason: >-
      The free tier is real — aws.amazon.com/q/developer/pricing is
      server-rendered and says "Amazon Q Developer offers a perpetual Free Tier
      with monthly limits", 50 agentic requests a month, "Access latest Claude
      models", "Use in the IDE or CLI", with IDE limits reserved for AWS Builder
      ID users. It is not listed because it is the predecessor of an entry this
      list already carries. AWS has folded both of its surfaces into Kiro: the
      product page runs an End of support notice reading "On April 30, 2027, AWS
      will discontinue support for Amazon Q Developer IDE plugins. For
      capabilities similar to Amazon Q Developer IDE plugins, explore Kiro", and
      the user guide is blunter about the other half — "The Q CLI has become the
      Kiro CLI." Kiro is listed with its own perpetual free tier, so carrying
      both would be one offer twice, the second copy with a shutdown date on it.
      Recorded because the pricing page still advertises the tier and keeps
      reaching us through curated feeds.
    reopen_if: >-
      Amazon Q Developer outlives the 2027-04-30 plugin end-of-support as a
      product with a free tier of its own rather than as a route into Kiro.

  - domains: [novita.ai]
    name: Novita AI
    checked_on: '2026-08-14'
    reason: >-
      Listed here from 2026-07-19 until 2026-08-14, when a hand check found the
      free lane gone with no announcement anywhere. novita.ai/pricing carries
      102 published prices and not one of them is zero; the two models this
      entry named as free are now billed — inclusionai/ling-3.0-flash at
      $0.06/$0.18 per Mt and mindai/macaron-v1-venti at 15000/45000 micro-units
      — and novita.ai/models marks every one of its 102 rows "isFree": false in
      its own page data. The keyless catalog does carry eleven rows at
      input_token_price_per_m 0, but they publish no pricing object, four are
      plainly internal (ai_infer_test_1/2/3, bunny) and the rest 404 on their
      own model pages, so that is an unpriced shelf and not an offer. What is
      left is the ~$0.5 signup credit, and a trial is not a tier. The old probe
      passed through all of this because it anchored on the id
      "ling-3.0-flash" plus the word "free" — both still on the page — instead
      of on the price beside the id.
    reopen_if: >-
      novita.ai/pricing shows a zero price, or a model on novita.ai/models
      carries "isFree": true.

  - domains: [aionlabs.ai]
    name: Aion Labs
    checked_on: '2026-08-14'
    reason: >-
      Re-checked 2026-08-14, and the first reason recorded here was wrong: this
      is an LLM API vendor, not the email-agent company of the same name. The
      site sells "Powerful AI Models & Agents" with "access via an
      OpenAI-compatible API"; api.aionlabs.ai/v1/models answers
      keyless with four models — aion-2.0, aion-3.0, aion-3.0-mini and
      aion-rp-llama-3.1-8b, roleplay and storytelling variants of DeepSeek and
      GLM. The verdict is unchanged for a different reason: every one of the
      four publishes a price and none of them is zero, the cheapest being
      aion-3.0-mini at $0.0000007 per prompt token. Note the catalog answers
      {"models": [...]} rather than the OpenAI {"data": [...]} shape, so an
      api-models probe here would need that read first.
    reopen_if: >-
      A zero-priced row appears in the api.aionlabs.ai catalog.

  - domains: [tokenrouter.io]
    name: TokenRouter.io
    checked_on: '2026-08-05'
    reason: >-
      Legitimate commercial routing layer, and the third unrelated service to
      carry the TokenRouter name — check the TLD before acting on any lead
      here, because .com is the listed PaleBlueDot gateway and .me is
      blocklisted. Its quickstart says "You need at least one AI provider key
      to route requests" and sends you to platform.openai.com, i.e. BYOK-only
      with no bundled model usage, and its "Free tier available" covers the
      routing plan, not tokens — the pricing page's own words are "Pay only for
      routing and insights". Not blocklisted precisely because nothing is wrong
      with it.
    reopen_if: >-
      TokenRouter.io starts bundling model usage rather than routing only.

  - domains: [morphllm.com]
    name: Morph (fast-apply)
    checked_on: '2026-07-22'
    reason: >-
      The one entry here with a free tier that is probably real — roughly 200
      requests a month on the fast-apply model — and no way to verify it:
      morphllm.com/pricing is client-rendered, so the figure appears in no
      served HTML. Kept out on the verification rule alone, not on the offer.
    reopen_if: >-
      Morph's docs or pricing become server-rendered with the quota in them.

  - domains: [nousresearch.com]
    name: Nous Portal
    checked_on: '2026-07-22'
    reason: >-
      The free tier is $0.10 a month of credit — decorative rather than usable,
      and far below what the third-party claim of "50 RPM free" suggested.
      The date stays at the July reading on purpose: re-asked on 2026-08-14
      after a list credited it with a no-card free tier, portal.nousresearch.com
      answered 429 "Vercel Security Checkpoint" to every client tried, home page
      and pricing alike, so nothing there could be re-read either way.
    reopen_if: >-
      The monthly grant becomes large enough to run an agent session on, on a
      page the portal serves to an ordinary HTTP client.

  - domains: [arcee.ai]
    name: Arcee (Trinity)
    checked_on: '2026-07-22'
    reason: >-
      Direct API grants are application-gated, and an application with a
      selection step is not an offer a developer can simply use — the same bar
      that keeps TokenRouter's builder programme out of its entry. The :free
      Trinity variants that are open live on OpenRouter, which this list
      already covers.
    reopen_if: >-
      Arcee opens direct API credits without an application.

  - domains: [ofox.ai]
    name: OfoxAI
    checked_on: '2026-08-14'
    reason: >-
      An OpenAI-compatible gateway with a keyless catalog — api.ofox.ai/v1/models
      answers 130 rows unauthenticated — and every text model in it is priced.
      Its eight GLM rows start at glm-4.7-flashx for $0.072 per M input, and
      there is no glm-4.7-flash in the catalog at all, so the third-party claim
      that it serves GLM-4.7-Flash at $0 per M is about a model it does not
      carry. The fourteen rows that do read prompt 0 and completion 0 are video,
      image and transcription models whose real price sits in a per-second or
      per-image field beside them.
    reopen_if: >-
      A text model in api.ofox.ai/v1/models prices both prompt and completion at
      zero.

  - domains: [warp.dev]
    name: Warp
    checked_on: '2026-08-14'
    reason: >-
      The Free plan is real and costs nothing, but it bundles no model usage:
      warp.dev/pricing lists it as "Reload credits at pay-as-you-go rates" and
      "Bring your own AI inference", while the 1,500 included credits begin on
      the $20 Build plan. Third-party lists still credit the free plan with 150
      then 75 AI credits a month; that allowance is no longer on the vendor's
      own page. A terminal that asks for your own key is the cline and aider
      case, not the opencode one.
    reopen_if: >-
      The Free plan on warp.dev/pricing lists an included monthly credit or
      token allowance instead of pay-as-you-go reloads.

  - domains: [platform.xiaomimimo.com, mimo.mi.com]
    name: Xiaomi MiMo (API platform)
    checked_on: '2026-08-14'
    reason: >-
      A separate surface from the archived MiMo Code entry, and also paid. The
      keyless platform.xiaomimimo.com/api/v1/models publishes five models and
      prices all of them, the cheapest being mimo-v2.5 at $0.14 in / $0.28 out
      per M. The Token Plan is a paid subscription — the site advertises MiMo
      Claw at 14.9 yuan a month as "stackable with Token Plan" — and both
      mimo.mi.com/pricing and platform.xiaomimimo.com/pricing are client-
      rendered shells serving 29 characters of text, so no probe could read an
      offer there even if one appeared.
    reopen_if: >-
      The keyless catalog carries a zero-priced row, or a free tier appears in
      server-rendered HTML.

  - domains: [atlassian.com]
    name: Atlassian Rovo Dev
    checked_on: '2026-08-14'
    reason: >-
      The free beta that third-party lists still quote at 5M tokens a day is
      over. atlassian.com/software/rovo-dev now says Rovo Dev is generally
      available and that "limited monthly Rovo Dev credits per developer will be
      gradually rolled out to customers with a Standard, Premium, or Enterprise
      Cloud plan of Jira" — an allowance that rides on a paid subscription,
      which is the same reason Copilot's paid tiers are not entries here.
    reopen_if: >-
      Atlassian publishes a Rovo Dev allowance reachable without a paid Jira
      Cloud plan.

  - domains: [forgecode.dev]
    name: ForgeCode
    checked_on: '2026-08-14'
    reason: >-
      A coding harness that brings no model usage of its own. Its installation
      docs say ForgeCode "needs access to at least one AI model", walk you
      through entering an API key, and recommend reusing a ChatGPT Plus or
      Claude subscription you already pay for; forgecode.dev/pricing is a 404.
      The "10K tokens a day via OpenRouter" credited to it elsewhere is
      OpenRouter's own free tier reached with the reader's key, and OpenRouter
      is already an entry here.
    reopen_if: >-
      ForgeCode Services bundles model usage on a plan that costs nothing.

  - domains: [deepinfra.com]
    name: DeepInfra
    checked_on: '2026-08-14'
    reason: >-
      deepinfra.com/pricing serves 17,500 characters of text and not one of them
      is "free" or "credit" — the whole page is per-token rates for language
      models and per-execution-time rates for everything else. The signup credit
      it is still credited with elsewhere is not on the vendor's own page.
    reopen_if: >-
      DeepInfra publishes a signup credit or a free model on its pricing page.

  - domains: [fireworks.ai]
    name: Fireworks AI
    checked_on: '2026-08-14'
    reason: >-
      fireworks.ai/pricing offers "Get started with $1 in free credits" against
      serverless inference with "postpaid billing" — a grant that sits on top of
      a billing relationship rather than instead of one, and a fortieth of what
      the trials listed here carry ($10 at Upstage and AI21). Every model on the
      page is priced per token.
    reopen_if: >-
      Fireworks publishes a recurring free tier, or a signup grant reachable
      without postpaid billing that is worth an agent session.

  - domains: [baseten.co]
    name: Baseten
    checked_on: '2026-08-14'
    reason: >-
      Its pricing FAQ says only that "new Baseten accounts come with credits so
      you can get to know the UI and experiment with deployments for free" — no
      figure, anywhere on the page. There is nothing a probe could anchor on,
      and a sentence with no number in it reads the same the day the credit
      stops being granted.
    reopen_if: >-
      Baseten publishes the size of the signup credit.

  - domains: [hyperbolic.ai, hyperbolic.xyz]
    name: Hyperbolic
    checked_on: '2026-08-14'
    reason: >-
      The business is GPU rental now, not a free inference lane —
      hyperbolic.ai/pricing is a 404 and the home page sells on-demand GPUs
      "billed by the hour" and reserved capacity at discounted rates. The $1
      inference credit third-party lists still quote is not on any page it
      serves. Both domains are recorded because the lists still point at the
      older one: hyperbolic.xyz/pricing and app.hyperbolic.xyz redirect to the
      .ai host (measured 2026-08-14), so a verdict filed under one name would
      have left the other free to be re-proposed.
    reopen_if: >-
      Hyperbolic publishes an inference free tier or signup credit again.

  - domains: [inference.net]
    name: Inference.net
    checked_on: '2026-08-14'
    reason: >-
      The $0 plan is a gateway and observability tier, not free inference: it
      lists "1M included Gateway requests, 1M tracing spans, 14-day data
      retention, 1 seat, 30 req/min" and is priced "$0 + usage", so the tokens
      themselves are still bought. The only opening credit on the page, $50, is
      attached to the $250-a-month Growth plan.
    reopen_if: >-
      The $0 plan includes inference credits or a zero-priced model rather than
      routing quota.

  - domains: [chutes.ai]
    name: Chutes
    checked_on: '2026-08-14'
    reason: >-
      Re-confirms the 2026-08-06 reading, which was never written down. Its
      pricing page states the model outright — "Pay per token. No subscription,
      no minimum, no markup" — and the cheapest thing on it is a $10-a-month
      Plus plan bundling a daily request quota. The free-trial FAQ entry is a
      collapsed client-rendered answer with nothing behind it in the HTML.
    reopen_if: >-
      Chutes publishes a zero-priced model or a no-card trial quota.

  - domains: [nlpcloud.com]
    name: NLP Cloud
    checked_on: '2026-08-14'
    reason: >-
      Unprobeable from here rather than judged: nlpcloud.com/pricing.html
      answers HTTP 403 to a request carrying a normal browser User-Agent, so
      there is no served page to read the offer off — the x.ai case. Nothing is
      claimed about the offer itself.
    reopen_if: >-
      The pricing page answers a plain HTTP request, and what it then says about
      a free tier.

  - domains: [tabnine.com]
    name: Tabnine
    checked_on: '2026-08-14'
    reason: >-
      tabnine.com/pricing serves 187 characters of text — a client-rendered
      shell with the plan table assembled in the browser. Whatever its free tier
      is today, there is nothing in the HTML for a probe to anchor on, which is
      the same reason Morph is not listed.
    reopen_if: >-
      Tabnine's pricing page carries its plan limits in server-rendered HTML.

  - domains: [jetbrains.com]
    name: JetBrains AI Assistant
    checked_on: '2026-08-14'
    reason: >-
      jetbrains.com/ai serves 71 characters of text and the buy page is the
      same, so the AI Free quota cannot be read off anything this project can
      fetch. Recorded as unreadable rather than as absent.
    reopen_if: >-
      JetBrains publishes the AI Free quota in server-rendered HTML.

  - domains: [bolt.new]
    name: Bolt.new
    checked_on: '2026-08-14'
    reason: >-
      A real bundled free tier — bolt.new/pricing gives the $0 plan "300K tokens
      daily limit, 1M tokens per month" — spent inside a hosted app builder. It
      buys generations in Bolt's own workspace, not model access a developer can
      point at a repository they already have, and there is no client to install
      and no endpoint to call. That is the line this list draws: an entry has to
      hand you model access you can aim at your own code.
    reopen_if: >-
      Bolt ships a CLI or an API whose free plan includes the model usage.

  - domains: [lovable.dev]
    name: Lovable
    checked_on: '2026-08-14'
    reason: >-
      Same hosted-builder shape as Bolt, and thinner: its own FAQ says "Paid
      plans have access to a credit balance" and describes the free plan only as
      having "grants included in the free plan", with no figure in the served
      HTML.
    reopen_if: >-
      Lovable publishes a free-plan allowance in server-rendered HTML and a way
      to spend it outside its own workspace.

  - domains: [v0.dev, v0.app]
    name: v0 (Vercel)
    checked_on: '2026-08-14'
    reason: >-
      The closest of the three to qualifying and still out. Its free plan is
      "$5 of included monthly credits" with a "7 message/day limit", and it does
      have an API — api.v0.dev/v1, keyed by V0_API_KEY — but that API is
      /chats/:id/messages, a product endpoint for driving v0's own builder, not
      a model endpoint. The credit buys v0 messages, not tokens you can spend on
      your own codebase. Vercel's model credits that can be spent that way are
      already listed here as Vercel AI Gateway.
    reopen_if: >-
      The v0 free plan's credits become spendable through an OpenAI-compatible
      or otherwise general model endpoint.

  - domains: [longcat.chat]
    name: LongCat API Platform (Meituan)
    checked_on: '2026-08-14'
    reason: >-
      Listed here from 2026-07-22 for a recurring 100K free tokens a day, and
      delisted because that quota is published nowhere on Meituan's own site
      today. Two dated entries in its change log explain what happened.
      "Version: 2026-05-29 — LongCat Model Service Sunset" retired the whole
      Flash line the free quota applied to: "Effective May 29, 2026, the
      platform will retire the following 6 models: LongCat-Flash-Chat,
      LongCat-Flash-Thinking, LongCat-Flash-Thinking-2601, LongCat-Flash-Lite,
      LongCat-Flash-Omni-2603, LongCat-Flash-Chat-2602-Exp". Then "Version:
      2026-06-30 — LongCat-2.0 Release & Billing Now Available" turned on Token
      Packs and pay-as-you-go. The API is alive and good, but it is now priced:
      "Pay-As-You-Go currently supports LongCat-2.0" at $0.75 uncached input and
      $2.95 output per 1M tokens, and its prerequisites end with "Top up your
      balance at Billing → Recharge". The words "free" and 免费 appear nowhere in
      Quick Start, Token Pack, API Pay-As-You-Go, the FAQ, the API overview or
      the pricing page — the one "free" in the change log is about chatting on
      the consumer LongCat Chat app, not the API. The platform page itself is a
      21-character client-rendered shell. Complimentary credits exist as a
      concept ("If you also have complimentary credits, those are consumed
      before your paid balance") but nothing states that a new account is
      granted any, how many, or how often. Our probe never noticed, because it
      anchored on the endpoint path and the model name rather than on the
      offer — novita's failure, again. Where our figure came from, for whoever
      is tempted to re-add it: free daily quotas at LongCat belong to the era
      before GA. The Chinese change log grants one on 2026-04-20, to the
      PREVIEW model — "初始额度5,000,000 Tokens/天 ... 每日最多可获得120,000,000
      Tokens" — and 赠送 appears nowhere in that log at all. The reference
      response for GET /openai/v1/models in the docs now lists exactly one
      entry, "id": "LongCat-2.0", "owned_by": "LongCat".
    reopen_if: >-
      LongCat publishes a free daily token quota, or a stated signup grant, on
      a server-rendered page of its own.
  - domains: [anyapi.ai]
    name: AnyAPI
    checked_on: '2026-08-14'
    reason: >-
      The free plan is real, published and server-rendered: anyapi.ai/pricing
      reads "Free / Getting started / $0 / mo", "ANY Tokens: 100K / day",
      "Core features: All free and basic models", "No credit card required",
      and docs.anyapi.ai repeats it — "$0/month 100 000 ₳nyTokens per day for
      free / Basic and free models access" and "Free: Your 100K daily
      ₳nytokens reset every 24 hours". What stops it is that nothing says what
      the quota buys. The plan cards count ₳nyTokens; the FAQ on the same
      pricing page defines a different unit and never reconciles them — "A
      credit is our universal currency for API usage across all 400+ models.
      One credit equals roughly 1,000 tokens for most models, but premium
      models like GPT-4 or Claude 3 Opus consume more credits per token". At
      1,000 tokens a unit the free plan would be 100M model tokens a day, and
      the $19.90 plan 100 billion a month, which cannot be what is meant. Which
      models count as "free and basic" is published nowhere, api.anyapi.ai/v1/models
      answers 401, and there is no per-model price page — so there is nothing
      to probe that ties a model to the tier, and no arithmetic to tell a real
      gateway from a resold pool. The pricing copy still headlines GPT-4 and
      Claude 3 Opus in 2026, which is its own answer about how current it is.
    reopen_if: >-
      AnyAPI publishes which models the free plan serves, or a keyless catalog,
      or defines its token unit against real model tokens.
  - domains: [ainative.studio]
    name: AINative Studio
    checked_on: '2026-08-14'
    reason: >-
      Carried elsewhere as "a recurring ~10M tokens/month free allocation (no
      card)". Its own pricing page says otherwise, twice on one screen: the
      heading "Hobbyist (free)" is followed by "Just getting started? Start the
      Hobbyist plan — 3-day free trial, then $5/mo", and the model table under
      it is titled "Hobbyist $5/mo and up ... Token usage billed per rates
      below" with a real price on every row (Qwen3 Coder 30B $0.04/$0.04, GPT
      OSS 120B $0.42/$0.90, Gemma 4 31B $0.99/$1.49, GLM-4.7 Preview
      $1.25/$2.75). So the free part is a three-day trial on a paid plan that
      also meters tokens, and the words "free tier", "10M" and "no credit card"
      appear nowhere on the page. Its keyless api.ainative.studio/api/v1/models
      does answer 200 with 84 rows, but they carry no prices and include
      other vendors' catalogs (claude-3-sonnet owned_by anthropic,
      arcee-trinity owned_by digitalocean) tagged source "playground".
    reopen_if: >-
      AINative publishes a recurring no-card allowance on a served page, with
      the models it covers.
  - domains: [aihorde.net]
    name: AI Horde
    checked_on: '2026-08-14'
    reason: >-
      Genuinely free and genuinely legitimate — "A free, community-powered
      generation service: volunteers share spare computer power so anyone can
      generate images and text", open source, kudos-priority rather than
      payment, and its status endpoints answer keyless. It fails this list's
      bar on shape, not on honesty. There is no OpenAI-compatible route to
      point a coding agent at: generation goes through /api/v2/generate/text/async
      as a queued job, and the client that added it to a proxy had to write a
      dedicated adapter because max_tokens must be >=16, stop must be an array,
      there is no tool calling and no upstream streaming. Nor is there a model
      set to publish: /api/v2/status/models?type=text is a live census of
      whichever volunteers are online, today mostly roleplay fine-tunes
      (aphrodite/TheDrummer/Cydonia-24B, koboldcpp/Angelic_Eclipse-12B) beside
      one google/gemma-4-31b, each row carrying its own queue and ETA.
    reopen_if: >-
      AI Horde publishes an OpenAI-compatible chat endpoint with tool calling,
      or a stable set of models it guarantees.

  - domains: [together.ai]
    name: Together AI
    checked_on: '2026-08-14'
    reason: >-
      Serverless inference priced per token with no free lane on its own pages.
      together.ai/pricing is a per-1M-token table whose cheapest row is still
      paid, and the word "free" does not occur once in the served text of that
      page, of docs.together.ai/docs/serverless/rate-limits, or of the
      quickstart; no model id ending in -Free is served on any of the three.
      The rate-limit page talks about bursts and real-time capacity and never
      about a tier.
    reopen_if: >-
      Together publishes a free tier or a zero-priced model row, or a model id
      ending in -Free returns to its catalog.

  - domains: [perplexity.ai]
    name: Perplexity (Sonar API)
    checked_on: '2026-08-14'
    reason: >-
      Pay-per-use with no free allowance of its own. The word "free" does not
      occur in the served text of docs.perplexity.ai/getting-started/pricing,
      which prices Sonar at $1 in and $1 out per 1M tokens, search requests at
      $5 per 1000 and each tool per invocation; the page's only credit language
      is "Purchase API credits through AWS Marketplace". Credits bundled with a
      paid subscription, if any, would be a wallet behind a paywall rather than
      a free tier.
    reopen_if: >-
      Perplexity publishes an API allowance reachable without a paid
      subscription or a credit purchase.

  - domains: [replicate.com]
    name: Replicate
    checked_on: '2026-08-14'
    reason: >-
      replicate.com/pricing says "You only pay for what you use on Replicate"
      and prices every model by hardware-second or by token. The only "free" in
      the served text is the "Try for free" sign-in button in the header — no
      signup grant, no recurring allowance, no zero-priced model.
    reopen_if: >-
      Replicate publishes a signup grant or a recurring allowance rather than
      pay-as-you-go only.

  - domains: [modal.com]
    name: Modal
    checked_on: '2026-08-14'
    reason: >-
      Recurring and real — modal.com/pricing gives the $0/month Starter plan
      "$30 / month free credits" — but the credits buy compute, not inference.
      They are spent on containers and GPU-seconds running a model the developer
      deploys themselves, so there is no vendor in the transaction, nothing to
      probe behind an OpenAI-compatible URL and nothing to put in a Models
      column. It fails this list's bar on shape, the way a free Colab GPU does.
    reopen_if: >-
      Modal serves models of its own behind an OpenAI-compatible endpoint on a
      free allowance.

  - domains: [zenmux.ai]
    name: ZenMux
    checked_on: '2026-08-14'
    reason: >-
      The scout proposed this on 2026-08-14 and the probe passed, because
      zenmux.ai/api/v1/models prices six of its 156 rows at 0 —
      z-ai/glm-4.6v-flash-free, z-ai/glm-4.7-flash-free,
      deepseek/deepseek-v4-flash-free, inclusionai/ling-3.0-tiny and the two
      sapiens-ai/agnes-*-flash. A zero in a price column is not a lane you can
      reach: ZenMux's own subscription guide says of its $0 Free tier "The Free
      plan can only be used in Studio Chat on the web (roughly 5 conversations
      per 5 hours) and provides no API Request access", and the other billing
      system, Pay As You Go, is documented as "prepaid balance + pay-as-you-consume"
      with a $5 minimum top-up. Neither published path hands a developer an API
      key that calls those six ids without paying, so the free price is a
      discount inside a paid plan rather than a free tier.
    reopen_if: >-
      ZenMux documents that a zero-balance Pay As You Go key may call the
      -free ids, or the Free Builder tier gains API access.

  - domains: [xfyun.cn, xf-yun.com, xinghuo.xfyun.cn]
    name: iFlytek Spark (讯飞星火)
    checked_on: '2026-08-14'
    reason: >-
      The free model is real and the vendor says so on its own page: the HTTP
      docs describe Lite as "轻量级大语言模型 ... 具有更高的响应速度，支持免费使用"
      (a lightweight model, faster to respond, free to use), give the model id
      as `lite` and publish an OpenAI-compatible base url,
      https://spark-api-open.xf-yun.com/v1/. An anchor exists too, contrary to
      an earlier note here: 「具有更高的响应速度,支持免费使用」 sits in the Lite column of
      that page's version table in served HTML, glued to the id by
      「lite指向Lite版本」 beside it. What blocks the listing is reachability. No
      served page states a quota, a QPS or a duration for the Lite lane; the
      figures that exist — the 0元/百万tokens cell and the 200,000-token free
      package — appear only after JavaScript runs on xinghuo.xfyun.cn/sparkapi,
      and that same table conditions the package on 个人认证 or 企业认证, real-name
      verification. Whether `lite` itself is reachable without it is stated
      nowhere, and console.xfyun.cn renders 「加载中……」 and nothing else. That is
      the ModelScope case: a real free model this list cannot yet tell a
      developer how to reach.
    reopen_if: >-
      iFlytek states, on a served page, what the Lite lane costs and whether it
      needs 实名认证 — or the registration gate turns out not to need a
      mainland-China identity.

  - domains: [intern-ai.org.cn]
    name: Intern AI (书生 / InternLM, Shanghai AI Lab)
    checked_on: '2026-08-14'
    reason: >-
      The docs are readable after all, at internlm.intern-ai.org.cn/doc/docs/ —
      and the trailing slash is load-bearing, since the same path without it
      answers a 168-byte stub, which is what an earlier check here mistook for
      an empty domain. 197KB of served HTML confirms the base url
      chat.intern-ai.org.cn/api/v1, the four model ids, an Anthropic-format
      endpoint with a Claude Code guide, and a quota: 「API 流控限制：默认每用户
      每分钟限制30次」, thirty requests a minute rather than the ten a feed credits
      it with. What is missing is the offer itself. Across all nine doc pages
      the words 免费, 收费, 付费, 计费 and 价格 do not occur once: the service states
      no price, free or otherwise, so there is nothing to verify and nothing an
      anchor could hang on — 每分钟限制30次 is a rate limit that would read exactly
      the same the day it started billing.
    reopen_if: >-
      Intern AI states a price, or states that the API is free, on a served
      page.

  - domains: [dxnt.com]
    name: DX TOKEN
    checked_on: '2026-08-14'
    reason: >-
      Blocklisted earlier the same day on a reason that turned out to be wrong,
      and moved here rather than left standing. The claim was that its model ids
      anonymise the upstream they route to; dxnt.com/byok refutes it in its own
      words — "在控制台添加自有端点，用 {身份码}/{模型名} 调用。请求直接转发到你的供应商" — so the
      opaque four-character prefixes (ot5k/, its0/, ry5b/) are per-user identity
      codes for a customer's OWN endpoint, not a hidden supplier, and dxnt's own
      catalog names its models plainly as dxnt/qwen3.5-397b-a17b and the like.
      Its free route is four models at multiplier 0, mostly open-weight
      (nemotron-3-nano, llama-3.2-90b-vision, step-3.7-flash,
      sensenova-6.7-flash-lite), which is capacity anyone may host. What is left
      is not enough to block and not enough to list: the service calls itself a
      中转网关, a relay gateway, discloses no sourcing for the proprietary Chinese
      models it relays, and its footer links 服务条款 and 隐私政策 both resolve to a
      page containing neither, so there are no terms and no legal entity behind
      any of it.
    reopen_if: >-
      DX TOKEN publishes terms of service and a legal entity, or states where
      the models on its own dxnt/ prefix are licensed from.

  # Eight services that had no verdict here until xtekky/gpt4free was read
  # whole on 2026-08-14 (that read's own verdict is in sources.yaml). Every
  # one of them is legitimate; none of them has a free lane this list can
  # hand a developer today.

  - domains: [giga.chat, gigachat.devices.sberbank.ru, developers.sber.ru]
    name: GigaChat API (Sber)
    checked_on: '2026-08-14'
    reason: >-
      The largest free grant this repository has ever verified, and it still
      cannot be listed. Sber's own tariff page, updated 22 July 2026, says
      "В рамках Freemium-режима пользователи получают 365 000 000 бесплатных
      токенов для генерации текста" and breaks it down in a served table that
      glues each figure to the ids it applies to — 250 000 000 for Lite
      (GigaChat, GigaChat-2), 40 000 000 for Pro, 25 000 000 for Max,
      50 000 000 for GigaChat-3-Ultra — each valid 12 months, "Генерация текста
      выполняется в одном потоке", one stream at a time. Every new account gets
      the Freemium tariff by default and no card is asked for; only the paid
      packages take one. The endpoint is OpenAI-shaped and printed in the docs:
      base_url "https://api.giga.chat/v1", model "GigaChat". What blocks it is
      the transport. Both api.giga.chat and gigachat.devices.sberbank.ru serve
      certificates issued by "C = RU, O = The Ministry of Digital Development
      and Communications, CN = Russian Trusted Sub CA", chaining to a Russian
      Trusted Root CA that is in no mainstream trust store — measured here, not
      inferred: httpx fails both with CERTIFICATE_VERIFY_FAILED, and Sber
      documents the fix as installing the НУЦ Минцифры certificates at
      application or OS level. That is a change to the reader's machine, and to
      what their machine trusts for every other TLS connection, which is not a
      thing a row in a table can ask for in a footnote. Registration is a second
      gate on top: the console takes a Сбер ID and issues scope
      GIGACHAT_API_PERS.
    reopen_if: >-
      api.giga.chat serves a certificate from a publicly trusted CA, or Sber
      documents an endpoint that does. At that point only the Сбер ID gate is
      left, which is the SenseNova case and lives inside an entry, and the
      anchor is already measured: the 365 000 000 sentence and the per-tier
      table sit in served HTML with ordinary spaces.

  - domains: [you.com]
    name: You.com API
    checked_on: '2026-08-14'
    reason: >-
      A genuinely free, genuinely keyless lane that is the wrong kind of thing.
      you.com/docs offers "Try it free — no API key required": point any
      MCP-enabled tool at https://api.you.com/mcp?profile=free and "use
      you-search with no signup or credentials", capped at 100 queries a day,
      with new accounts getting $100 in credits for the rest. It names Claude
      Code, Cursor, VS Code and JetBrains by name, so it is aimed squarely at
      the readers of this list — but what it hands them is web search, not model
      access, and CONTRIBUTING asks an entry for a lane you can point a coding
      agent's model at.
    reopen_if: >-
      You.com opens a free lane on an inference endpoint rather than on search
      and retrieval — or this list decides that free agent tooling belongs in a
      section of its own, in which case this is the first row in it.

  - domains: [blackbox.ai]
    name: Blackbox AI
    checked_on: '2026-08-14'
    reason: >-
      Two tiers on its own pricing page and neither is free: "PAY AS YOU GO",
      metered per token against prepaid credits, and "ENTERPRISE", "Your model,
      your keys, your contract". The $0 in the first column is the monthly
      commitment — "$0 / MO COMMIT ... Committed spend None — pay for what you
      use" — not a token allowance, which is the same shape this repository
      rejected for AIHubMix's neighbours and for ZenMux. The 300+ model table
      below prices every row.
    reopen_if: >-
      Blackbox publishes a free tier with a token or request allowance, on the
      pricing page rather than in an extension listing.

  - domains: [orcarouter.ai]
    name: OrcaRouter
    checked_on: '2026-08-14'
    reason: >-
      A router whose free plan is free routing, not free tokens: "Hacker Free
      Forever. Zero markup on all tokens ... 3 API keys · 0% token markup", and
      in its own words "You pay each provider's published rate; OrcaRouter adds
      $0 per token". Its structured pricing data agrees — an Offer named "Free"
      at price 0 with the description "Pay provider cost only". That is the
      standing rule here that a zero in a price column is not a lane you can
      reach: nothing is granted, the $0 is the fee for the routing.
    reopen_if: >-
      OrcaRouter grants credits or a free model lane of its own, rather than
      charging nothing to pass a paid one through.

  - domains: [aibadgr.com]
    name: Badgr
    checked_on: '2026-08-14'
    reason: >-
      Not an inference free tier — GPU capacity by the hour, advertised as
      "Available now Badgr 4090". The pricing page's $0 is a subscription that
      does not exist: "Pay as you go $0 /month + usage: every account gets the
      same features", "no setup fee, no monthly minimum". A wallet, and not even
      a wallet with anything in it.
    reopen_if: >-
      Badgr starts granting inference credits, or serves models rather than
      renting the cards they run on.

  - domains: [whiterabbitneo.com, deephat.ai]
    name: Deep Hat (formerly WhiteRabbitNeo, Kindo)
    checked_on: '2026-08-14'
    reason: >-
      Renamed since gpt4free wrote its adapter — whiterabbitneo.com now
      redirects to deephat.ai, "Deep Hat, formerly Whiterabbitneo, is Kindo's
      uncensored cybersecurity model". The four "Use it for free" and "Try it
      for free" buttons on that page all lead to the hosted app; the API route
      on the same page is "Get a demo". The weights are on Hugging Face, which
      is a licence rather than a free tier, and is not an endpoint anyone can
      point an agent at without hosting it themselves.
    reopen_if: >-
      Deep Hat publishes an API with a free lane, rather than a hosted app and
      open weights.

  - domains: [phind.com]
    name: Phind
    checked_on: '2026-08-14'
    reason: >-
      Nothing could be verified, and that is the finding. www.phind.com and
      www.phind.com/plans both answer HTTP 403 to every client tried here,
      including one sending a full browser header set — so no probe on this
      domain can read an offer, and this list would be repeating a claim rather
      than checking one. Worth the record because the name is otherwise a
      plausible candidate: a developer-facing answer engine with an editor
      extension is exactly the shape CONTRIBUTING admits when the free usage is
      bundled. Note also that gpt4free does not call phind.com at all — its
      adapter points at phindai.org, an unrelated clone, now on the blocklist.
    reopen_if: >-
      Phind serves its plans page to a non-browser client, or publishes free
      terms anywhere a probe can reach.

  - domains: [yupp.ai]
    name: Yupp
    checked_on: '2026-08-14'
    reason: >-
      Unreadable rather than absent: yupp.ai answers HTTP 429 to every request
      made here, browser headers included, and the docs.yupp.ai its adapter
      implies does not resolve at all. gpt4free's own class for it carries
      working = False and needs cloudscraper, which is the same verdict from the
      other side. Nothing states an offer, so there is nothing to verify.
    reopen_if: >-
      Yupp serves a plan or docs page to an ordinary HTTP client, and that page
      describes an API rather than a chat product.

  # The four names nejib1/Free-LLM carried that nothing here had a verdict on,
  # read 2026-08-14. The list files all four as free — Coze and Venice under
  # "permanent free tier", Cerebrium and Friendli as $30 and $10 signup credits.
  - domains: [venice.ai]
    name: Venice.ai
    checked_on: '2026-08-14'
    reason: >-
      The Free plan does carry an "API Access" checkmark, and the docs say what
      it is worth: "You can create a key before funding the account, but model
      requests will not succeed until the account can consume DIEM, bundled
      credits, or USD". DIEM comes from staking VVV and bundled credits from a
      subscription, which venice.ai/pricing states from the other side — "Pro
      subscribers get free-tier API access". So the free lane is a key that
      cannot call anything, and every row of the docs price table is quoted in
      dollars per million tokens.
    reopen_if: >-
      An unfunded Venice account gets a callable allowance, or a model appears
      priced at zero for the Free plan.

  - domains: [friendli.ai]
    name: FriendliAI
    checked_on: '2026-08-14'
    reason: >-
      friendli.ai/pricing prices everything it serves: per-token rates for the
      Model APIs — GLM-5.2 at $1.4 in / $4.4 out per 1M, gemma-4-31B-it at
      $0.14 / $0.4 — and per-second GPU time for dedicated endpoints, $2.9 an
      hour on an A100 up to $12.0 on a B300. The word "free" does not occur in
      the served text of that page at all, and its own "How do I get started?"
      answer is sign up, generate a key, make a request, with no grant in
      between. The $10 signup credit third-party lists quote is on none of it.
    reopen_if: >-
      FriendliAI states a signup grant or a zero-priced model on a page it
      serves.

  - domains: [cerebrium.ai]
    name: Cerebrium
    checked_on: '2026-08-14'
    reason: >-
      The wrong shape twice over. It is a serverless platform you deploy your
      own container to rather than a model endpoint you can aim an agent at,
      which is the BYOK case CONTRIBUTING excludes; and the free thing on
      cerebrium.ai/pricing is the Hobby plan's allowance of seats and slots —
      "Up to 3 deployed apps", 3 seats, 1 day of log retention — while the
      compute underneath is billed throughout, the page's own worked example
      putting 500,000 requests at "roughly $309" a month. No $30 credit appears
      anywhere on it.
    reopen_if: >-
      Cerebrium starts serving hosted models on a free allowance rather than
      hosting yours.

  - domains: [coze.com]
    name: Coze
    checked_on: '2026-08-14'
    reason: >-
      Nothing here can be read, so nothing can be verified: www.coze.com
      answers every path tried with the same 43,754-byte SPA shell — the API
      overview, the pricing guide, /robots.txt and /sitemap.xml alike — and the
      document API behind that shell replies {"code":700012006,"msg":"Login
      verification is invalid"}. No quota, model list or terms are served
      anywhere a probe could anchor. The shape is doubtful as well — its own
      og:title calls it an "AI Agent Intelligent Office Platform" and its API
      is /v3/chat against bots built inside its workspace, which is the
      hosted-app-builder case CONTRIBUTING excludes — but the verification rule
      alone settles it, the way it settled Morph LLM.
    reopen_if: >-
      Coze serves its developer docs or pricing to an ordinary HTTP client, and
      that page describes model access rather than bot invocations.

  - domains: [publicai.co]
    name: Public AI Inference Utility
    checked_on: '2026-08-30'
    reason: >-
      The word "Free" here names a rate-limit tier, not free inference.
      platform.publicai.co/plans puts four tiers side by side and the Free one
      buys "100 requests/minute — default when you create an API key"; the same
      page keeps the money in a separate paragraph — "Rate limits and token
      usage billing are separate ... Token usage is billed against wallet
      credits", with "New accounts receive starter credits when they first use
      billing features" and no figure attached to those credits anywhere on the
      portal. The catalog agrees: every one of the eleven models on
      platform.publicai.co/models carries a price (swiss-ai/apertus-v1.5-8b at
      $0.10/$0.20 per 1M, up to $0.82/$2.92 for the 70b), and none is listed at
      zero. An unnamed starter credit is the SiliconFlow reasoning again: a
      sign-up courtesy is not a free tier. The nonprofit itself is exactly what
      it says — a public-AI gateway fronting Apertus, SEA-LION, Olmo, Bielik and
      EuroLLM, and this list already carries SEA-LION from its own vendor.
    reopen_if: >-
      The portal names the starter credit, or /v1/models starts returning a
      model priced at zero.

  - domains: [crof.ai, nahcrof.com]
    name: CrofAI
    checked_on: '2026-08-30'
    reason: >-
      A free account is not a free tier. crof.ai/home sells the on-ramp — "Get
      an API key — free account, no credit card required" — and crof.ai/pricing
      states the offer in one line: "Pay for what you use. Per-token pricing
      across every model we serve. No subscriptions, no minimums — only the
      tokens you actually burn." The catalog behind it, ai.nahcrof.com/v1/models,
      is public and prices all 23 models; not one is at zero (the cheapest row
      read on 2026-08-30 was $0.35 in / $0.80 out per 1M). Reached from
      OmniRoute's provider table, where it is filed under paid.
    reopen_if: >-
      A model priced at 0 appears in ai.nahcrof.com/v1/models, or the pricing
      page starts naming a recurring free allowance.

  - domains: [bluesminds.com]
    name: BluesMinds
    checked_on: '2026-08-30'
    reason: >-
      OmniRoute credits it with 22 free models and ~7M tokens a month; the
      vendor publishes nothing of the kind. www.bluesminds.com is an enterprise
      page whose only two calls to action are "Sign in" and "Request access",
      /pricing 404s, and there is no docs host to read. The one thing its API
      does say is what it runs on: api.bluesminds.com/v1/models answers
      {"error":{"message":"Invalid token ...","type":"new_api_error"}}, the
      error shape of the New API resale panel, which is the software a
      key-pooling gateway is usually built from. Nothing here is verifiable and
      the free claim is a third party's.
    reopen_if: >-
      BluesMinds publishes a pricing or docs page an ordinary HTTP client can
      read, and that page names a free allowance of its own.

  - domains: [bynara.id]
    name: Nara / NaraRouter
    checked_on: '2026-08-30'
    reason: >-
      An Indonesian startup's product page, not an offer. bynara.id describes
      NaraRouter as "one OpenAI-compatible gateway to route, track, and control
      AI usage across providers" and says nothing about price, quota or a free
      lane anywhere in its 3,362 characters; router.bynara.id/v1/models answers
      401 "A valid API key is required", so the catalog cannot be read either.
      The three free models OmniRoute lists for it are a third party's claim
      with no vendor page behind them.
    reopen_if: >-
      Nara publishes pricing or docs naming a free allowance, or its catalog
      becomes readable and carries a model at zero.

  - domains: [bytez.com]
    name: Bytez
    checked_on: '2026-08-30'
    reason: >-
      Nothing on this domain can be read by a probe. bytez.com serves a 63KB
      shell that renders 22 characters of text, docs.bytez.com renders 900 from
      half a megabyte, /pricing 404s into a client-side not-found, and
      api.bytez.com/models/v2/list/models answers {"error":"Unauthorized"}. The
      free claim carried by OmniRoute is a ~1M-token signup credit — a one-time
      grant even as reported — and no page here states it. The verification
      rule settles it the way it settled Coze and Morph.
    reopen_if: >-
      Bytez serves a pricing or docs page to an ordinary HTTP client and that
      page names a recurring free allowance rather than signup credits.

  - domains: [liquid.ai]
    name: Liquid AI (LFM / LEAP)
    checked_on: '2026-08-30'
    reason: >-
      The wrong shape rather than the wrong price. Liquid's product is the LEAP
      edge platform — "Discover, specialize, and deploy models on any device" —
      whose models run on the phone or laptop you ship them to, not behind a
      hosted endpoint an agent can call: api.liquid.ai/v1/models does not exist
      (404 from the marketing app) and labs.liquid.ai serves no catalog either.
      A local runtime is out of scope here for the same reason Ollama's desktop
      build is, and the "keyless" row OmniRoute files for it names no endpoint.
    reopen_if: >-
      Liquid opens a hosted LFM API with a free lane a developer can call from
      outside its own SDK.

  # The five records below replace blocklist lines removed on 2026-08-30, after a
  # full re-audit of that file found their stated reason contradicted by the
  # vendor's own catalog or pricing page. A blocklist entry is permanent and says
  # "never propose this"; four of these say no such thing, and one was wrong.
  - domains: [xkiro.com]
    name: xKiro
    checked_on: '2026-08-30'
    reason: >-
      Blocked on 2026-08-30 and un-blocked the same day: the reason given —
      "sells a 5,000,000 free tokens/day plan over models it does not own" —
      confused the catalog with the free lane, which is the mistake this
      repository has a written rule against. api.xkiro.com/v1/models carries an
      `access_tier` field per row, and every one of the 17 `:free` ids is Qwen at
      `access_tier: free` with pricing 0/0, while claude-opus-5, the gpt-5.6 line
      and grok-4.6 are all `access_tier: paid`. The paid prices are not
      relay-shaped either: measured against each vendor's list, gpt-5.6-sol is
      sold ABOVE list ($4.50/$27 against $4/$20), claude-opus-5 at 85% and
      grok-4.6 at 75% — ordinary markup and discount, not the order of magnitude
      that disqualified llm7.io. It publishes terms, privacy, about, contact,
      docs and a status page, all served. Its own plan card reads "Free — $0/month
      — Free forever — Free tokens 100K / day — Access to 35+ free models — no
      card required". Not listed only because nothing here has called that lane,
      and because the page's "35+ free models" overstates its own catalog by
      double.
    reopen_if: >-
      Anyone verifies a keyless-of-charge call on the free lane, or the catalog's
      `:free` set stops matching what the pricing page promises.

  - domains: [unorouter.com]
    name: UnoRouter
    checked_on: '2026-08-30'
    reason: >-
      Blocked on 2026-08-30 and un-blocked the same day for the same error as
      xKiro: the frontier ids that triggered it are the paid catalog, not the
      free lane. Of 227 `:free` ids only nine are frontier-named, and all nine
      are Google's cheap tier (gemini-flash-lite, gemini-3.5/3.6-flash-lite,
      embeddings, robotics previews) — no Claude, no GPT. What keeps it off the
      list is what cannot be read rather than what was found: its catalog
      publishes no prices at all, so no probe here can tell a free id from a
      metered one; its 338 rows are `owned_by: "custom"` on 318 of them; and 17
      Claude ids are spelled in a vocabulary no public catalog uses —
      claude-opus-5[1m], claude-sonnet-5-thinking[1m] — which a router may well
      have invented for a context-and-reasoning preset, but which nothing on the
      site explains. Its paid plans sell $50 of credit for $25, permanently.
    reopen_if: >-
      Its catalog starts publishing per-model prices, or a page states what the
      free lane grants and where the `[1m]` ids come from.

  - domains: [zed.dev]
    name: Zed (Personal plan)
    checked_on: '2026-08-30'
    reason: >-
      The blocklist said "free plan is BYOK / external agents only, no bundled
      model usage", and zed.dev/pricing contradicts it: the Personal plan is
      "$0 forever" and lists "2,000 accepted edit predictions" beside "Unlimited
      use with your API keys or external agents". Those predictions run on Zed's
      own hosted model, which is bundled usage in exactly the shape that keeps
      GitHub Copilot Free on this list at 2,000 completions a month. Two things
      stop it short of a row rather than of a re-check: the number carries no
      period anywhere on the page, and Zed's own FAQ describes Personal as being
      "for users who want a best-in-class code editor without AI capabilities",
      so the vendor's two statements about its own free plan disagree. Edit
      predictions are also completions and nothing else — no chat, no agent, no
      model you can aim at a task.
    reopen_if: >-
      Zed states the period on the 2,000 predictions, or the Personal plan gains
      any chat or agent usage of its own.

  - domains: [reka.ai]
    name: Reka AI
    checked_on: '2026-08-30'
    reason: >-
      Moved off the blocklist, where it sat since 2026-08-11 with a reason that
      ended "delete this line if an account shows otherwise" — a verdict written
      to expire, filed where nothing expires. The finding itself still holds and
      is a watchlist finding: the entry once claimed "$10 free credits at the
      start of every month" on the strength of one dated announcement post, and
      no live vendor page corroborates a recurring grant. platform.reka.ai/pricing
      today sells Pay as you go at $0/mo with "Credits — Top up anytime", and the
      only free thing it names is in the past tense, a banner reading "Free
      credits used". A legitimate vendor with no free tier a developer can reach
      is the definition of this file, not of the blocklist.
    reopen_if: >-
      A Reka page states a recurring free grant, or the signup credit is named
      with a figure.

  - domains: [api.navy, navyai.dev]
    name: NavyAI
    checked_on: '2026-08-30'
    reason: >-
      Moved off the blocklist because the fact it rested on is not what the
      catalog says. The reason read "163 models, 77 of them paid frontier ids —
      claude-opus-5, claude-opus-4.8, the gpt-5.6 line, o3 — offered on a free
      plan of 150K tokens/day", and api.navy/v1/models carries a `premium` flag
      per row: 50 rows are premium and they are precisely that frontier line
      (gpt-5.6-sol/terra/luna, 5.5, 5.4, 5.3-codex), while the frontier-named
      rows that are NOT premium are the mini, nano and lite tiers. There is also
      a `token_multiplier` per row — 20 for claude-opus-5, 16 for gpt-5.6-sol,
      1 for the ordinary rows — so the quota is spent at a rate that matches the
      model's cost. That is the shape of a metered plan, not of capacity given
      away. Not listed because nothing here can be read: api.navy and its docs
      answer a Cloudflare challenge to every non-browser client, so the free
      plan's terms cannot be verified from outside a browser.
    reopen_if: >-
      NavyAI serves a pricing or docs page to an ordinary HTTP client, and that
      page states what the free plan grants and which models it covers.

  - domains: [cto.new]
    name: cto.new
    checked_on: '2026-09-02'
    reason: >-
      Moved off the blocklist, for the reason five other domains were on
      2026-08-30: the verdict was a statement about the offer on a date, filed
      where nothing expires. It read "free models are chat-only: no API endpoint
      and no free agent runs ... so no probe on this domain can verify
      anything", and the second half is simply not true — docs.cto.new answers
      an ordinary client with HTTP 200 and carries the free tier's terms in the
      vendor's own words. The first half is a scope judgement, which is what
      this file is for. Out of scope rather than out of free tier, then, which
      is the rarer of the two answers here. cto.new is an AI business builder —
      its own
      documentation is Headquarters, Website, Tasks, Finance, Ads, Inbox, Files
      and a Marketplace — and the coding surface a developer would point at a
      repository is not among them. It is Engine Labs' product, which the
      documentation gives away without saying so: every asset on docs.cto.new
      is served from mintcdn.com/enginelabs/. The free tier itself is real and
      unquantified: "Use cto completely free. Access to the best value models
      with generous usage limits that reset every day", carrying its own caveat
      that "access to the free tier may be restricted in some locations and on
      some networks". Which models it reaches is not stated; the models page
      names Claude Opus 5, Claude Fable 5, Kimi K3, GPT-5.6, DeepSeek V4 Pro,
      Gemini 3.1 Pro and GLM 5.3 Flash for the product as a whole, and the free
      page says only "the best value models". Note for a re-read: cto.new
      answers a Vercel Security Checkpoint with HTTP 429 to any ordinary client,
      and docs.cto.new is the readable surface — its Mintlify .md forms
      (docs.cto.new/fair-use.md, /pricing.md) are the machine-readable one, and
      the llms.txt beside them lists every page.
    reopen_if: >-
      It ships a surface a developer uses on code directly — a CLI, an IDE
      extension or an OpenAI-compatible endpoint — reachable on the free tier.
