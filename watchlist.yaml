    reopen_if: >-
      Featherless publishes a free plan or a free model lane.

  - domains: [stepfun.com, stepfun.ai]
    name: StepFun (阶跃星辰)
    checked_on: '2026-09-14'
    reason: >-
      Every model on platform.stepfun.com/docs/zh/guides/pricing/details is
