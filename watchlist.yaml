      API/SDK access and offers only a student discount campaign — "高校师生专属｜模型定制低至5折",
      to 2026-09-15, for mainland, Hong Kong, Macau and Taiwan faculty and
      students — with no free quota anywhere on it; the console is a login
      page.
    reopen_if: >-
      A free quota with a figure on a readable page.

  - domains: [mancer.tech]
    name: Mancer
    checked_on: '2026-09-05'
    reason: >-
      Honest and OpenAI-compatible by URL swap — its FAQ says "We offer free
      models, use them to test before making a purchase" — and the models page
      (read 2026-09-05) marks exactly one row FREE: MythoLite, a LLaMA-2 13B
      roleplay tune with a 2,560-token context and a 150-token output cap.
      Every coding-tagged row beside it (DeepSeek V4 Flash, GLM 4.7, GPT OSS
      120B and 20B) is metered in credits. A free lane that cannot finish a
      function is not one a coding agent can use.
    reopen_if: >-
      A coding-capable model marked FREE on the models page.

  - domains: [empero.org]
    name: Empero (free.empero.org)
    checked_on: '2026-09-05'
    reason: >-
      "A free community endpoint" for GLM 5.3 Flash from an "Independent AI
      research lab" that says it is "built in Germany", with weights on Hugging
      Face under empero-ai. On 2026-09-05 free.empero.org is a maintenance
      page — "We are switching the free endpoint to new models" and "We are
      preparing the free endpoint for Qwen3.8-Flash-Next" — and no terms, rate
      limit, sign-up or catalog page could be read. Nothing here says how it
      is hosted or funded.
    reopen_if: >-
      The endpoint answers and a page states its limits and terms.

  - domains: [awanllm.com]
    name: AwanLLM
    checked_on: '2026-09-05'
    reason: >-
      The pricing page (read 2026-09-05) still sells a Lite plan "Free
      forever" — "20 req/minute", "200 req/day" on small models, "10 req/day"
      on large ones, "Unlimited Tokens!" — over a catalog that stopped in 2024
      (Llama 3 and 3.1, 8B and 70B). api.awanllm.com timed out on every call
      that day, catalog and chat alike, at 40 seconds, so the offer cannot be
      shown to answer, and a plan whose API does not respond is not one this
      list can verify twice a week.
    reopen_if: >-
      api.awanllm.com answers a request.

  - domains: [kluster.ai]
    name: kluster.ai
    checked_on: '2026-09-05'
    reason: >-
      Still linked by two of the lists read on 2026-09-05. None of kluster.ai,
      platform.kluster.ai or api.kluster.ai resolves in DNS that day, and the
      last read of its successor lists recorded the API sunset as 2026-06-09.
    reopen_if: >-
      The domain resolves and a page carries a free tier.

  - domains: [mlvoca.com]
    name: mlvoca
    checked_on: '2026-09-17'
    reason: >-
      The vendor's own repository, github.com/mlvoca/free-llm-api, now names
      the models and the terms: "a publicly hosted /api/generate endpoint
      based on the Ollama API" serving TinyLlama and DeepSeek R1 (1.5b),
      which "currently works without any kind of rate limit or API key", and
      "Commercial use of this api is not allowed". It names no operator
      beyond a Proton Mail address, and mlvoca.com still answers 403 to
      every fetch (2026-09-17). There is nothing here a probe can anchor on
      that dies with the offer — a README outlives the endpoint it describes
      — and the endpoint speaks Ollama's generate route rather than chat
      completions, so the keyless check cannot call it either.
    reopen_if: >-
      mlvoca.com serves a readable page about the endpoint, or the service
      answers an OpenAI-compatible chat completions route.

  - domains: [b.ai]
    name: B.AI
    checked_on: '2026-09-18'
    reason: >-
      Nothing free is left. b.ai itself still renders the word BAI and nothing
      else, but docs.b.ai is server-rendered and its sitemap lists the LLM
      service's pages. "Promotions and Pricing Updates" ended the free models
      the Chinese list credited it with: for Qwen3.8-Flash, Hy3 and MiMo-V2.5
      "The current free offer changes to a limited-time discount at 17:00 on
      September 16, 2026 (Singapore Time, UTC+8)", billed from then "at 10% of
      the standard reference price", and every model in "Pricing and Usage"
      carries a price. What remains is a referral gift, not a sign-up one: a
      friend who registers through an invitation link "can claim a dedicated
      invitation registration gift of 300,000 Credits" — $0.30 at 1,000,000
      Credits to the dollar — valid 30 days. Login is by Web3 wallet or Google,
      and api.b.ai/v1/models answers 401 without a key (2026-09-18).
    reopen_if: >-
      A model priced at zero on the promotions page again, or a grant to
      anyone who signs up, without an invitation.

  - domains: [developer.amd.com.cn]
    name: AMD Token Factory (China developer site)
    checked_on: '2026-09-05'
    reason: >-
      A Chinese list credits it with a daily $10-equivalent quota on
      AMD-hosted open models, OpenAI-compatible, no card, run with ZZ.ai and
      limited-time. The page at /radeon/tokenfactory is client-rendered: the
      readable part (2026-09-05) is a help notice for the "AMD AI 开发者计划",
      the Developer Cloud and a joint ModelScope incentive program, with no
      quota, model, endpoint or sign-up term in it. The domain is AMD's China
      developer site.
    reopen_if: >-
      A server-rendered page with the quota and the sign-up terms.

  - domains: [bigmodel.cn]
    name: Zhipu BigModel (China console of Z.ai)
    checked_on: '2026-09-05'
    reason: >-
      The mainland console of the vendor this list carries as Z.ai, named by
      five of the lists read on 2026-09-05 (one of them: "永久免费, 仅限速" —
      permanently free, rate-limited only — on the GLM Flash models). The same
      Flash models are the listed row's free lane at api.z.ai, and what the
      China console adds is a mainland account whose sign-up this list cannot
      read. Here so the console stops being proposed as a second vendor.
    reopen_if: >-
      A readable sign-up page for non-mainland accounts, or a free model the
      international site does not carry.

  - domains: [qianfan.baidubce.com, cloud.baidu.com]
    name: Baidu Qianfan (百度千帆)
    checked_on: '2026-09-05'
    reason: >-
      The new-user quota is documented at cloud.baidu.com/doc/qianfan/s/Imi2rpirg
      (updated 2025-11-17, read 2026-09-05): from 2025-10-24, a user who has
      "阅读并同意用户协议" is granted "100万" tokens per model with "3个月" validity
      on 17 models — ERNIE-4.5-Turbo and ERNIE-X1-Turbo, DeepSeek-R1 and V3.1,
      Kimi-K2-Instruct, Qwen3-Coder-480B-A35B-Instruct among them — for online
      inference only. A one-off three-month grant is a trial rather than a
      standing lane, and the page says nothing about who may open the
      account; Baidu AI Cloud's sign-up is the mainland real-name flow this
      list cannot read, beside Alibaba's China site for the same reason.
    reopen_if: >-
      A readable page saying the console opens without mainland real-name
      verification, or an international console carrying the grant.

  - domains: [volcengine.com, volces.com]
    name: Volcengine Ark (火山方舟)
    checked_on: '2026-09-05'
    reason: >-
      Named by two Chinese lists for its 协作奖励计划, the data-collaboration
      reward. The program page (docs.volcengine.com/docs/82379/1391869,
      updated 2026-08-31) is client-rendered and came back empty to this
      repository's fetch on 2026-09-05; what could be read is the vendor's
      2025-11-20 notice as quoted by nodeseek and linux.do — the reward for
      individual users rose "由原本每日每模型的50万免费tokens奖励提升至200万", granted as a
      next-day rebate of what was consumed, for accounts that pass real-name
      verification and authorize their prompts and outputs for model
      training — and a 2026-09-01 notice that 38 models left the program. A
      mainland real-name account and a training authorization are two walls
      this list does not carry, and the page that would say so is unreadable.
    reopen_if: >-
      A server-rendered program page, and a sign-up readable outside the
      mainland.

  - domains: [wandb.ai]
    name: W&B Inference (Weights & Biases)
    checked_on: '2026-09-05'
    reason: >-
      A third-party dataset reports "$100/month of Serverless Inference
      credits on the Free plan". The vendor's usage-limits page (read
      2026-09-05) says instead that "Serverless Inference credits come with
      Free, Pro, and Academic plans for a limited time" — no amount, no
      expiry — and lists "$100/month" as the Free tier's default spending
      cap on pay-as-you-go, which a free account must turn on once the
      credits are gone. The per-model price list (DeepSeek V4 Flash $0.14 /
      $0.28, Qwen3 Coder 480B $1.00 / $1.50 per million) carries no free row,
      and the service is "only available from supported geographic
      locations" under CoreWeave's terms.
    reopen_if: >-
      A stated credit amount, or a model priced 0.

  - domains: [pioneer.ai]
    name: Pioneer (Fastino Labs)
    checked_on: '2026-09-11'
    reason: >-
      "An inference API built by Fastino Labs", surfaced by the provider table
      of mnfst/llm-gateway. Every model on the home page is priced per token
      — Claude Sonnet 5 at $2.00 / $10.00, GPT-5.5 at $5.00 / $30.00, Gemma 4
      12B at $0.25 / $0.25, GLiNER2 Large at $0.20 / $0.20 per 1M — and
      pioneer.ai/pricing sells seats: "PRO $20/seat/month, $40/seat/month in
      platform credits included", Enterprise $50/seat. No signup credit and no
      free lane on either page as rendered here on 2026-09-11; the only "trial"
      in the page text is the name of its web font.
    reopen_if: >-
      pioneer.ai/pricing states a free tier or a signup credit.

  - domains: [zerolimitai.com]
    name: ZeroLimitAI
    checked_on: '2026-09-11'
    reason: >-
      The product behind ClawLabsAI/free-ai-models, whose README funnels
      readers to "one OpenAI-compatible endpoint that auto-routes every
      request to whichever free model is answering best". zerolimitai.com/developers
      does hand out a key — "OpenAI-compatible · Free tier", base URL
      https://www.zerolimitai.com/api/v1, model "auto" — but the free key
      "expires after 7 days" and carries no stated quota; the paid tiers are
      "Lifetime Core $49 one-time … 2,000 API calls/day" and "Lifetime Pro
      $99 … 10,000 API calls/day", sold beside "Unlimited chat". What the key
      routes to is "the best free AI model available — Llama 4 Scout, DeepSeek
      R1, Qwen3 235B", the models other vendors serve on their own free lanes,
      and neither /terms nor /about says where those requests go or under
      what licence; /docs answers 404. A relay reselling lifetime access to
      upstream free lanes is the provenance question llm7.io was blocked over,
      but the models here are open-weight and the operator publishes terms and
      a named team, so it stays a verdict rather than a block. Read 2026-09-11.
    reopen_if: >-
      It publishes the free key's quota and where its "free models" are served
      from.

  - domains: [allrouter.ai]
    name: AllRouter
    checked_on: '2026-09-11'
    reason: >-
      Named by cuihuan/awesome-ai-gateway's relay watch-list as carrying "a
      free GLM/Gemma tier". allrouter.ai and /pricing are a 2 KB client-rendered
      shell, /docs is readable (23 KB) and holds no "free" wording at all, and
      api.allrouter.ai does not resolve (2026-09-11). Unreadable rather than
      absent.
    reopen_if: >-
      A page this repository can read states the free tier.

  - domains: [aimlapi.com]
    name: AIMLAPI
    checked_on: '2026-09-16'
    reason: >-
      "The Free Tier is currently paused" (docs.aimlapi.com/faq/free-tier,
      2026-09-16), though the marketing pages still offer "Free credits on
      signup".
    reopen_if: >-
      The free tier resumes, with its quota stated.

  - domains: [byteplus.com, bytepluses.com]
    name: BytePlus ModelArk
    checked_on: '2026-09-16'
    reason: >-
      A one-off trial, readable now in the docs' page data: ModelArk has a mode
      in which "calls to the inference API consume only the 500k free tokens
      granted by the platform", and the campaign terms grant "500,000 (Five
      Hundred Thousand) tokens per Model", "redeemable only once per BytePlus
      account", after "BytePlus account registration and enterprise information
      submission". Sign-up has you "select one of the options as your payment
      method", and no page read says the tokens can be spent before one is added
      (2026-09-16).
    reopen_if: >-
      A page says the free tokens need no payment method, or the grant recurs.

  - domains: [clarifai.com]
    name: Clarifai
    checked_on: '2026-09-12'
    reason: >-
      The one text-LLM row of pacocartones/free-llm-api-hub left without a
      verdict here, because nothing under the domain answers. clarifai.com and
      www.clarifai.com time out on 443 and on 80 alike — from this network on
      2026-09-05, 2026-09-11 and 2026-09-12, and from a GitHub runner on
      2026-09-12, which is what takes a local block off the table — while
      api.clarifai.com, docs.clarifai.com, status.clarifai.com and
      portal.clarifai.com every one answer NXDOMAIN on Google's public
      resolver. The domain's nameservers are dns1 and dns2 at
      registrar-servers.com, the registrar's own default pair, and www
      resolves into static.rcn.com. A platform whose API subdomain does not
      exist in DNS cannot be verified to offer anything, which is the rule
      that settled Coze and Morph LLM. It is here and not on the blocklist
      because none of this is a verdict on the company.
    reopen_if: >-
      clarifai.com or api.clarifai.com answers an ordinary HTTP client again,
      and the page it serves states the free tier.

  - domains: [aider.chat]
    name: aider
    checked_on: '2026-09-14'
    reason: >-
      Moved here from the blocklist, where it sat as "BYOK-only, no bundled
      free model usage". That is true of aider and it is still a verdict on an
      offer, not on the tool — Cline sat on the blocklist under the same words
      for two months while its own provider handed out free models, because
      nothing on that list ever comes up for a re-check. aider ships no provider of its
      own: its model docs send readers to other vendors' free tiers — "Aider
      works with a number of free API providers: OpenRouter offers free access
      to many models, with limitations on daily usage", Gemini beside it — which
      this list carries directly. The repository was last pushed on 2026-05-22.
    reopen_if: >-
      aider ships a hosted provider or a sign-in of its own that includes model
      usage.

  - domains: [roomote.dev]
    name: Roomote
    checked_on: '2026-09-14'
    reason: >-
      Moved here from the blocklist for the reason aider was: BYOK-only
      describes what is offered today, not the company. Roomote is the cloud
      coding agent the Roo Code team shut Roo Code down to build, and it
      bundles no inference — "Every plan includes app hosting and a sandbox
      provider — you just bring an inference key from any provider we
      support". What is free is the hosting: "a free 7-day trial, no credit
      card" on Roomote Cloud, then from $49/mo, and self-hosting that "is free
      for up to 10 users". Neither buys a token.
    reopen_if: >-
      A Roomote plan, trial or self-hosted tier includes model usage instead of
      asking for an inference key.

  - domains: [puter.com]
    name: Puter
    checked_on: '2026-09-14'
    reason: >-
      Moved here from the blocklist, where it sat as a browser-only SDK with no
      HTTP endpoint a coding agent could use. That stopped being true: Puter now
      serves an OpenAI-compatible endpoint at api.puter.com/puterai/openai/v1
      and an Anthropic-compatible one at api.puter.com/puterai/anthropic, with
      its own tutorials for Claude Code, Cline and Kilo Code, and "every Puter
      account includes an allowance of storage, database, and AI usage at no
      charge". The two do not meet. Its rate-limits page says the compatible
      endpoints "additionally require a paid plan — a free account calling
      them gets 402 subscription_required", while the free allowance runs
      through puter.ai.* and /drivers/call, which no coding agent speaks, and
      the size of that allowance is shown only in the dashboard. The site's
      "Free, Unlimited Claude API" tutorials are the marketing half of the same
      site, not what its docs describe.
    reopen_if: >-
      A free Puter account can call the OpenAI- or Anthropic-compatible
      endpoint without a paid plan.

  - domains: [zoocode.dev]
    name: Zoo Code
    checked_on: '2026-09-14'
    reason: >-
      The community fork that carried on when Roo Code shut down, and the one
      Roo Code's own shutdown notice recommends. Its release notes invite users
      to take the Zoo Gateway key "to any OpenAI-compatible client or
      workflow", but the gateway is prepaid — the terms
      read "Zoo Code credits are prepaid units" and "Minimum purchase amount is
      $5 USD", non-refundable, and name no company. The public catalog behind
      zoocode.dev/models serves 251 models at Vercel AI Gateway's own rates
      plus a ninth (minimax/minimax-m3 at $0.3333/$1.3333 against Vercel's
      $0.30/$1.20), and the seven it prices at zero are exactly Vercel's seven
      — the Ling 3.0 Flash Fin, Sante and VL ids and laguna-s-2.1-free —
      already on this list under Vercel AI Gateway. The v3.82.0 release notes
      promise "free access to MiniMax-M3 through Zoo Gateway" for a limited
      time while the same catalog prices it, and no page says an account
      without credits can call anything. Read 2026-09-14.
    reopen_if: >-
      Zoo's docs or terms state that an account without purchased credits can
      call Zoo Gateway models, or MiniMax-M3 appears at zero in its public
      catalog.

  - domains: [fastrouter.ai]
    name: FastRouter
    checked_on: '2026-09-14'
    reason: >-
      Operated by AI.tech Ltd under New York law, with a real :free lane in a
      keyless catalog — openai/gpt-oss-120b:free, openai/gpt-oss-20b:free,
      google/gemma4-26b:free, nvidia/nemotron-3-nano-30b:free,
      nvidia/nemotron-3-super:free and sarvam/sarvam-105b:free, all priced 0 —
      that a new account cannot use. Its own docs set the gate:
      "up to 10 requests per org per day, with no payment required for
      organizations having paid credit balance >$1", and "Free models cannot
      be used when your organization's paid credit balance is <= $1". The
      signup grant the site advertises — "Get Millions Of Tokens To Start.
      Free Credits On Us" — carries no figure, and the $0 Starter plan is a
      gateway plan for your own keys ("1 BYOK key · 1M requests / month").
    reopen_if: >-
      The :free models answer an account that has never paid, or the signup
      credit is published as a figure.

  - domains: [naga.ac]
    name: NagaAI
    checked_on: '2026-09-14'
    reason: >-
      The free tier is published — "Start free on zero-cost models", 15+
      models at 10 RPM and 100 RPD — and what it serves is other gateways'
      free lanes: the :free ids in its keyless catalog are
      ling-3.0-flash-vl:free, ling-3.0-flash-sante:free,
      ling-3.0-flash-fin:free, nex-n2.5-pro:free, nex-n2.5-mini:free,
      dots-3-note-preview:free, lfm-2.5-2.6b:free and
      nemotron-3.5-lightning:free, the lane OpenRouter and Kilo already carry
