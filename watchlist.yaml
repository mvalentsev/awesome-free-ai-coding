    reopen_if: >-
      Command Code offers a $0 plan with model usage included.

  - domains: [kimchi.dev]
    name: Kimchi (CAST AI)
    checked_on: '2026-09-14'
    reason: >-
      CAST AI's open-source coding agent. The $0 Community tier is the
