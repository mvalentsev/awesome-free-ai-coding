      A $1 monthly allowance with no card — "Free $0.00 /mo ... $1 of model
      usage / month 10 requests / minute 1 API key Access to all open models" —
      on a gateway that markets "27 frontier models" and serves seven from its
      keyless catalog: nemotron-3-ultra, nemotron-3-super, gpt-oss-20b,
      laguna-xs-2.1, llama-3.2-11b-vision, flux.1-dev and an embedder, ids
      spelled the way NVIDIA's API catalog spells them. Prices sit above the
      makers' (DeepSeek V4 Flash at $0.27/$1.10), which is not the relay
      pattern, but the terms (June 2026) name no company and nothing says
      whose capacity the allowance spends.
    reopen_if: >-
      Speka names its operator and where its models are served, and the
      catalog carries what the home page claims.

  - domains: [logfare.ai]
    name: Logfare
    checked_on: '2026-09-14'
    reason: >-
      "Free LLM Inference. No Limits", with the price stated plainly — "In
      exchange for free inference, we log every request — prompts,
      completions, and metadata. After PII scrubbing this may be used in our
      private, internal evaluation datasets" — and an operator described only
      as "an independent research and engineering group"; /terms and /about
      answer 404, and the privacy policy names no company. The keyless catalog
      is 19 ids, and 14 of them — glm-5.3, kimi-k2.6, qwen-3.8-27b,
      gemma-4-26b, melotts, aura-2-en, nova-3, lucid-origin, phoenix-1.0 and
      the flux and whisper builds — are Cloudflare Workers AI's names, whose
      free allocation is 10,000 neurons a day per account. Unlimited free use
      of it is either paid for by someone unnamed or pooled.
    reopen_if: >-
      Logfare publishes terms naming its operator and a stated quota, or says
      how the inference is paid for.

  - domains: [openadapter.dev, openadapter.in]
    name: OpenAdapter
    checked_on: '2026-09-14'
    reason: >-
      OpenAdapter, Inc. sells a coding subscription — "4x Cheaper than Claude
      Code", Lite at $9/mo for "~400 requests over 5h" — across 72+ open
      models, and does have a free plan: "Try OpenAdapter Strict daily quota
      across the full catalog. No credit card." The quota is never given a
      number, and the pitch is resale on its own words: "Same models.
      Fraction of the price. One subscription replaces 3+ separate provider
      plans", beside an "0G Network" section of privately hosted models.
      Nothing says which provider plans are being replaced, or under what
      licence.
    reopen_if: >-
      OpenAdapter publishes the free plan's daily quota and where its models
      are served from.

  - domains: [free.ai]
    name: Free.ai
    checked_on: '2026-09-14'
    reason: >-
      A consumer suite of 477+ tools whose free allowance is real and small in
      the way that matters here: "Anonymous users get 6,000 tokens/day. Sign up
      free for 30,000 tokens/day", spent on "Qwen 2.5 for chat" — 2024-era 7B
      to 72B models on its own GPUs — while "GPT-6, Claude, Veo + 584 premium
      models" start at $5. The API sits at api.free.ai/v1/chat/ with ids like
      qwen7b rather than a model a coding agent would be pointed at.
    reopen_if: >-
      The free daily allowance covers a current coding model on the API.

  - domains: [greenpt.com, greenpt.ai]
    name: GreenPT
    checked_on: '2026-09-14'
    reason: >-
      EU-hosted chat on renewable energy, where the free part is a trial and
      the API is paid: "All API usage requires an active Pro, Teams, or
      API-only subscription", every plan comes "with a 14-day free trial
      included", and the entry plan is €4,50/month for 15 prompts a day.
    reopen_if: >-
      GreenPT's API gets a free allowance outside the subscription trial.

  - domains: [synthetic.new]
    name: Synthetic
    checked_on: '2026-09-14'
    reason: >-
      A flat subscription for open models — "Subscription Packs ... $1 /day $30
      /mo Rate Limit 500 requests/5hr" — with the alternative "All models are
      pay-per-token". No free plan or grant on the pricing page.
    reopen_if: >-
      Synthetic offers a free plan or signup allowance.

  - domains: [nlpcloud.com, nlpcloud.io]
    name: NLP Cloud
    checked_on: '2026-09-14'
    reason: >-
      OmniRoute's changelog says the free tier "is a recurring monthly free
      plan (10,000 requests/month)", and nothing on the vendor's side can be
      read to confirm it: nlpcloud.com/pricing answers a Cloudflare "Just a
      moment... Enable JavaScript and cookies to continue" challenge from this
      network and from a GitHub runner alike (2026-09-14), and
      api.nlpcloud.io/v1/models is a 404. The same OmniRoute file marks its
      terms "avoid" for proxy use.
    reopen_if: >-
      A pricing or docs page an ordinary HTTP client can read states the free
      plan.

  - domains: [baichuan-ai.com]
    name: Baichuan (百川)
    checked_on: '2026-09-14'
    reason: >-
      A mainland console with nothing readable: platform.baichuan-ai.com renders
      108 characters, and api.baichuan-ai.com/v1/models answers api_key_empty.
      OmniRoute's own correction is that "current reality is only a one-time 80
      CNY trial credit for new users (valid 3 months)" — a trial, and on the
      same mainland-registration terms that keep the other Chinese consoles off
      this list.
    reopen_if: >-
      A readable page states the grant and a registration open outside the
      mainland.

  - domains: [gitlawb.com]
    name: gitlawb
    checked_on: '2026-09-14'
    reason: >-
      A crypto-native agent platform — "Sponsored tips funded with USDC",
      spending permissions "on a Base wallet" — whose opengateway catalog
      prices 13 of its 14 ids and zeroes one, nvidia/nemotron-3-ultra-550b-a55b:free,
      a model this list already carries free on five rows. OmniRoute's note is
      that its free MiMo access "was removed in May 2026" and the Nemotron row
      is "a temporary promotional model".
    reopen_if: >-
      gitlawb publishes a free lane of its own beyond one promotional id.

  - domains: [monsterapi.ai]
    name: MonsterAPI
    checked_on: '2026-09-14'
    reason: >-
      Unreachable: monsterapi.ai and api.monsterapi.ai both answer SERVFAIL on
      Google's public resolver (2026-09-14), so no page or catalog can be
      read. The free tier OmniRoute last described was one-time trial credits
      with "0 credits/month" recurring.
    reopen_if: >-
      The domain resolves again and a readable page states a free allowance.

  - domains: [ampcode.com]
    name: Amp
    checked_on: '2026-09-14'
    reason: >-
      Free today only with inference you bring. The Hobby tier announced on
      2026-09-13 is "Free" with "Use your ChatGPT sub & other subs", "Bring
      your own keys (BYOK)" and "Pay-as-you-go for orbs", and the announcement
      says it outright: "Amp is now free to use when you bring your own compute
      and model subscriptions/keys ... You can still pay for model inference
      through Amp if you want, with no markup." The bundled lane Amp was known
      for is gone: its 2025-10-15 Amp Free post now opens "Update 4: Amp Free
      is paused. We don't intend to bring it back", after the ad-funded $10 a
      day of 2026-01-08 and "Amp Free Is Full (For Now)" on 2026-02-10.
    reopen_if: >-
      Amp brings back a free credit grant or a free mode that needs no
      subscription or key of your own.

  - domains: [factory.ai]
    name: Factory (Droid)
    checked_on: '2026-09-14'
    reason: >-
      No free plan. Individual plans start at "Pro $20 / mo", then Plus at
      $100 and Max at $200, and the free-sounding parts are inside them:
      "Droid Core: free open-weight model pool with separate Rate Limits after
      Standard Usage runs out" and "BYOK is free up to an allowance on all
      Individual plans" both describe what a subscription includes
      (docs.factory.ai/pricing/individuals).
    reopen_if: >-
      Factory offers a $0 plan whose Droid Core or other model usage needs no
      subscription.

  - domains: [openhands.dev, all-hands.dev]
    name: OpenHands Cloud
    checked_on: '2026-09-14'
    reason: >-
      The free hosted tier bundles no model usage: "Individual Free — Bring
      your own key or use our providers at-cost", ten conversations a day, and
      the FAQ spells out the second half — "the OpenHands LLM provider
      (available within the Individual Tier), which provides multiple model
      options at cost, with no markup on a pay-as-you-go basis". The agent is
      hosted free; the inference is yours to pay for or bring, the aider case.
    reopen_if: >-
      OpenHands Cloud includes model credits or a free model on its Individual
      tier.

  - domains: [dev.meta.ai, api.meta.ai, developer.meta.com]
    name: Meta Model API (Muse Spark, Muse Code)
    checked_on: '2026-09-14'
    reason: >-
      Pay-as-you-go behind a card. dev.meta.ai/docs/pricing-rate-limits.md
      prices muse-spark-1.3 at $1.25/$4.25 per 1M and its Contributor tier —
      the model Cline's free lane carries as
      cline-free/muse-spark-1.3-contributor — at $0.10/$0.20, "Heavily
      discounted token pricing in exchange for permission to use your prompts
      and completions to train future Meta models". The help center's sign-up
      article: "To start making
      requests, set up two more things: Add a payment method ... Create an API
      key." The docs mention "platform free-tier credits" with no figure; the
      only figure is in the site config shipped with every docs page for the
      dashboard's welcome dialog, "You have $20 in free credits to start
      building right away" — a one-off grant on the far side of that card.
      Meta's own cookbook README still says "the preview is free", the pricing
      page being the later word. Muse Code, the terminal agent on the same
      account, is billed per token or sold as monthly subscriptions. The help
      center renders only in a browser; the docs are readable as Markdown.
    reopen_if: >-
      An account can make requests without a payment method, or a docs page
      states the free-tier credit as a figure.

  - domains: [qwenlm.github.io]
    name: Qwen Code (Qwen OAuth)
    checked_on: '2026-09-14'
    reason: >-
      The sign-in that made Qwen Code a free agent is gone, in its own docs:
      "The Qwen OAuth free tier was discontinued on 2026-04-15. Existing cached
      tokens may continue working briefly, but new requests will be
      rejected." The /auth menu now offers Alibaba Cloud's Coding Plan ("weekly
      quota included", for a fixed monthly fee), a Token Plan, a Model Studio
      API key or a third-party key, which leaves a BYOK agent. Alibaba's free
      Model Studio quota is carried here as a row of its own.
    reopen_if: >-
      Qwen Code's auth menu offers a sign-in with a free quota again.

  - domains: [sweep.dev]
    name: Sweep (JetBrains plugin)
    checked_on: '2026-09-14'
    reason: >-
      A one-off trial on Sweep's own models with nothing readable about its
      terms. sweep.dev/pricing offers "Free Trial Free Try Sweep risk-free
      1,000 Autocompletes $5 API credits included", then Basic at $10 a month
      for unlimited autocomplete, Pro at $20 and Ultra at $60. The
      documentation it links answers HTTP 402 (docs.sweep.dev, 2026-09-14) and
      its terms and blog URLs serve the home page, so neither the trial's
      conditions nor whether it takes a card can be read.
    reopen_if: >-
      Sweep publishes the trial's terms on a page that answers, card or no
      card, or adds a recurring free allowance.

  - domains: [lingyiwanwu.com]
    name: 01.AI (Yi API)
    checked_on: '2026-09-16'
    reason: >-
      01.AI closed its model API: api.lingyiwanwu.com answers GET /v1/models
      with HTTP 410 {"error":{"code":"model_service_closed","message":"Model
      service has been discontinued"}}. The company is alive on the same
      domain — www.lingyiwanwu.com announces "2026.07 万策平台发布", an
      enterprise decision platform — so the offer ended, not the service. It
      sat on the blocklist from 2026-09-14 as a product that was gone, which
      would have buried a vendor that can reopen an API. OmniRoute's feed still
      names its "Yi-Light" free models.
    reopen_if: >-
      api.lingyiwanwu.com/v1/models serves models again, or 01.AI publishes API
      pricing with a free allowance.

  - domains: [cerebras.ai]
    name: Cerebras Inference
    checked_on: '2026-09-16'
    reason: >-
      Listed from 2026-07-19 to 2026-09-16 as a trial marked with a card, and
      taken off because CONTRIBUTING excludes one-off credits that require one.
      inference-docs.cerebras.ai/support/rate-limits: "New accounts receive $5 in
      free credits after adding a verified payment method. These credits expire
      30 days after they’re granted", "If you skip adding a payment method at
      sign-up, Playground and API access remain inactive until you do", and "Is
      there a permanently free tier? No."
    reopen_if: >-
      Cerebras grants credits without a payment method, or a free allowance that
      recurs.

  - domains: [infomaniak.com]
    name: Infomaniak AI Services
    checked_on: '2026-09-16'
    reason: >-
      Listed from 2026-09-02 to 2026-09-16 as a trial marked with a card, and
      taken off because CONTRIBUTING excludes one-off credits that require one:
      "One million free credits allow you to test the service without commitment
      for one month" and "A credit card is required to start using the API"
      (support guide 2845).
    reopen_if: >-
      The trial credits stop requiring a card, or a free allowance recurs.

  - domains: [scaleway.com]
    name: Scaleway Generative APIs
    checked_on: '2026-09-16'
    reason: >-
      Listed from 2026-07-20 to 2026-09-16 as a free tier marked with a card, and
      taken off because CONTRIBUTING excludes one-off credits that require one.
      "Every new customer gets 1,000,000 free tokens—start paying only from the
      1,000,001st token" is a once-per-customer grant, and Scaleway's account
      docs say "Ordering Scaleway resources requires a valid credit card".
    reopen_if: >-
      The free tokens stop requiring a card, or become a recurring allowance.

  - domains: [aiberm.com, aiberm.org]
    name: Aiberm
    checked_on: '2026-09-16'
    reason: >-
      A paid relay with nothing free found and no cause shown. It sat on the
      blocklist from 2026-09-14 on its own discount claim ("85–90% off
      Claude, 90% off GPT"), and a price is not provenance. Its FAQ separates
      "claude-" models, discounted and "best suited for coding scenarios",
      from "anthropic/" models "Routed through AWS", without saying where the
      first kind come from. aiberm.org is its mainland mirror.
    reopen_if: >-
      Aiberm offers a free allowance, or states where its discounted Claude
      capacity comes from.

