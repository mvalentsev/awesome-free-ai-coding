      rates — gpt-5.6-sol at $1/$5 per 1M against OpenAI's $4/$20,
      claude-sonnet-5 at $1/$5 — with no statement of where they are served
      from.
    reopen_if: >-
      NagaAI's free lane carries a model it serves itself, or it states where
      its below-list frontier capacity comes from.

  - domains: [commandcode.ai]
    name: Command Code
    checked_on: '2026-09-14'
    reason: >-
      A coding agent for open models whose cheapest plan is paid. The home
      page FAQ says "Free tier for solo developers", but the pricing page
      starts at "Go $1 /month + processing fee" with $10 of credits, then
      GOAT at $10/mo with $70. The free models it advertises — "Free on Laguna
      S 2.1 Free on Ling 3.0 Flash Free on LongCat 2.0 Free on Ling 3.0 Flash
      Sante", "Requests cost no credits while capacity lasts" — are listed
